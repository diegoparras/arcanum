name: Publicar imagen Docker (GHCR)

# Publica ghcr.io/<owner>/arcanum automáticamente:
#  - push a main           -> tags :latest + :X.Y.Z (de package.json) + :sha, y Release vX.Y.Z
#                             con las notas de esa versión del CHANGELOG.md
#  - tag vX.Y.Z (release)  -> tag :X.Y.Z + :X.Y
# Cada versión dice que cambia: sin su sección en el CHANGELOG el build no sale.
# Usa el GITHUB_TOKEN del runner: sin tokens manuales.
#
# Cadena de suministro (auditoría 2026-11-26, B-17): no se publica nada sin pasar tests, lint y
# npm audit; las acciones van fijadas por SHA (con la versión al lado) y el token del runner solo
# puede escribir en el job que publica.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: npm audit (dependencias de la app)
        run: npm audit --omit=dev --audit-level=high

  build-push:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear el tag y el Release de la versión
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Version y novedades (CHANGELOG)
        id: ver
        run: |
          V="$(node src/tools/notas-version.js --version)"
          node src/tools/notas-version.js > "$RUNNER_TEMP/notas.md"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          {
            echo "## Arcanum v$V"
            echo
            cat "$RUNNER_TEMP/notas.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login a GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/arcanum
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build y push (multi-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release de la version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::warning::La v$V ya estaba publicada: este deploy no subio la version (patch) ni sumo novedades."
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "Arcanum v$V" --notes-file "$RUNNER_TEMP/notas.md"
          fi
