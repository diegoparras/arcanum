      responses: { '200': { description: PDF, content: { application/pdf: {} } } }

  /api/lotes:
    get:
      tags: [Facturador]
      summary: Lista de lotes con resumen de aging
      parameters: [{ name: cuit, in: query, schema: { type: string } }]
      responses: { '200': { description: ok } }
    post:
      tags: [Facturador]
      summary: Crear lote de facturación (JSON items[] o csv)
      description: "Body: { cuit, nombre, perfil (pyme|asociacion), items[]|csv }. Cada ítem: nombre, cuit, email, tipoComprobante, puntoVenta, importeTotal (o neto/iva), periodo."
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: creado } }
  /api/lotes/{id}:
    get: { tags: [Facturador], summary: "Detalle del lote (items + aging verde/amarillo/rojo)", parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ok } } }
  /api/lotes/{id}/export.csv:
    get: { tags: [Facturador], summary: Export CSV del lote con aging, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: csv } } }
  /api/lotes/{id}/emitir:
    post: { tags: [Facturador], summary: Emitir el CAE de todos los pendientes del lote, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: "{ total, emitidos, resultados[] }" } } }
  /api/lotes/{id}/items/{itemId}/{accion}:
    post:
      tags: [Facturador]
      summary: "Acción sobre un ítem: emitir | recibido | solicitar"
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: itemId, in: path, required: true, schema: { type: integer } }
        - { name: accion, in: path, required: true, schema: { type: string, enum: [emitir, recibido, solicitar] } }
      responses: { '200': { description: ok } }

  /api/comprobantes:
    get:
      tags: [Comprobantes]
      summary: Lista de comprobantes emitidos
      parameters:
        - { name: cuit, in: query, schema: { type: string } }
        - { name: desde, in: query, schema: { type: string } }
        - { name: hasta, in: query, schema: { type: string } }
      responses: { '200': { description: ok } }
  /api/comprobantes/export.csv:
    get: { tags: [Comprobantes], summary: Export CSV (Libro IVA), responses: { '200': { description: csv } } }
  /api/comprobantes/{cuit}/{pv}/{tipo}/{nro}/pdf:
    get:
      tags: [Comprobantes]
      summary: PDF del comprobante con QR de ARCA
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string } }
        - { name: pv, in: path, required: true, schema: { type: integer } }
        - { name: tipo, in: path, required: true, schema: { type: integer } }
        - { name: nro, in: path, required: true, schema: { type: integer } }
      responses: { '200': { description: PDF, content: { application/pdf: {} } } }

  /api/usuarios:
    get: { tags: [Usuarios], summary: Lista de usuarios (admin+), responses: { '200': { description: ok } } }
    post:
      tags: [Usuarios]
      summary: Crea un usuario (superadmin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { username: { type: string }, email: { type: string }, nombre: { type: string }, password: { type: string }, role: { type: string, enum: [superadmin, admin, operador, lectura] }, cuitAllow: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: ok } }
  /api/usuarios/{username}:
    patch:
      tags: [Usuarios]
      summary: Cambia email, nombre, rol o si está activo (superadmin). Desactivado no entra ni con contraseña ni con un pase de la suite, y sus sesiones abiertas se cierran.
      parameters: [ { name: username, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { email: { type: string }, nombre: { type: string }, role: { type: string, enum: [superadmin, admin, operador, lectura] }, activo: { type: boolean } } } } } }
      responses: { '200': { description: ok }, '404': { description: no existe }, '409': { description: email repetido } }

  /api/webhooks:
    get: { tags: [Webhooks], summary: Lista webhooks (admin+), responses: { '200': { description: ok } } }
    post:
      tags: [Webhooks]
      summary: Crea un webhook (admin+)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { url: { type: string }, eventos: { type: array, items: { type: string } }, secret: { type: string } } } } } }
      responses: { '200': { description: ok } }
  /api/webhooks/{id}:
    delete: { tags: [Webhooks], summary: Borra un webhook (admin+), parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: ok } } }
  /api/webhooks/{id}/probar:
    post: { tags: [Webhooks], summary: Manda un evento "prueba" y devuelve lo que contestó el destino (admin+), parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: "prueba: { entregado, status, ms }" }, '404': { description: no existe } } }

  /api/fisherboy/config:
    get: { tags: [Mis Comprobantes], summary: URL de Fisherboy y si hay token cargado (superadmin; el token nunca vuelve), responses: { '200': { description: "fisherboy: { url, tokenCargado }" } } }
    put: { tags: [Mis Comprobantes], summary: Guarda URL y token de Fisherboy (token cifrado; superadmin), requestBody: { content: { application/json: { schema: { type: object, properties: { url: { type: string }, token: { type: string } } } } } }, responses: { '200': { description: ok } } }
  /api/fisherboy/salud:
    get: { tags: [Mis Comprobantes], summary: Si Fisherboy responde (admin+), responses: { '200': { description: "fisherboy: { ok, version }" } } }
  /api/mis-comprobantes/receta:
    get: { tags: [Mis Comprobantes], summary: Receta que corre Fisherboy para bajar Mis Comprobantes (admin+), responses: { '200': { description: "receta: { url, pasos }" } } }
    put: { tags: [Mis Comprobantes], summary: Reemplaza la receta (superadmin), requestBody: { content: { application/json: { schema: { type: object, required: [url, pasos], properties: { url: { type: string }, pasos: { type: array, items: { type: object } } } } } } }, responses: { '200': { description: ok }, '400': { description: receta inválida } } }
    delete: { tags: [Mis Comprobantes], summary: Vuelve a la receta por defecto (superadmin), responses: { '200': { description: ok } } }
  /api/mis-comprobantes/{cuit}:
    get:
      tags: [Mis Comprobantes]
      summary: Comprobantes emitidos y recibidos ya bajados
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string } }
        - { name: tipo, in: query, schema: { type: string, enum: [emitido, recibido] } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: limite, in: query, schema: { type: integer, maximum: 5000 } }
        - { name: clase, in: query, schema: { type: string, enum: [facturas, nc, nd] } }
        - { name: cbte, in: query, description: Tipo de comprobante de ARCA, schema: { type: integer } }
        - { name: contraparte, in: query, description: CUIT o documento de la contraparte, schema: { type: string } }
        - { name: q, in: query, description: Texto en el nombre o dígitos del CUIT de la contraparte, schema: { type: string, maxLength: 80 } }
      responses: { '200': { description: comprobantes } }
  /api/mis-comprobantes/{cuit}/descargados:
    get:
      tags: [Mis Comprobantes]
      summary: Listado paginado de los comprobantes ya bajados, para integraciones
      description: >-
        Del más nuevo al más viejo, con montos en número y un id estable por comprobante. No entra a ARCA: devuelve lo
        guardado en la última sincronización. Si hay más resultados, "siguiente" trae el cursor de la próxima página.
        Sin resultados en la primera página, "mensaje" lo dice con el periodo pedido. El CAE no trae vencimiento: Mis
        Comprobantes no lo informa.
      parameters:
        - { name: cuit, in: path, required: true, description: CUIT titular, schema: { type: string } }
        - { name: tipo, in: query, schema: { type: string, enum: [emitidos, recibidos] } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: cuit, in: query, description: CUIT o documento de la contraparte, schema: { type: string } }
        - { name: tipoCbte, in: query, description: "Código de ARCA del tipo (1 Factura A, 6 Factura B, 11 Factura C)", schema: { type: integer } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: El valor "siguiente" de la página anterior, schema: { type: string } }
      responses:
        '200':
          description: >-
            { ok, cuit, filtros, cantidad, siguiente, mensaje?, comprobantes: [{ id, tipo, tipoComprobante, tipoNombre,
            comprobante, puntoVenta, numero, numeroHasta?, fecha, contraparte: { cuit, documento, tipoDocumento, nombre },
            importes: { total, netoGravado, noGravado, exento, iva }, moneda, cotizacion, cae }] }
        '400': { description: filtro o cursor inválido }
        '403': { description: CUIT fuera del alcance }
  /api/mis-comprobantes/{cuit}/analisis:
    get:
      tags: [Mis Comprobantes]
      summary: Totales, comparación con el periodo anterior, evolución por mes, principales clientes y proveedores, tipos y subtotales
      description: Acepta los mismos filtros que el listado. Sin desde/hasta, los últimos 12 meses. Importes en pesos con signo (las notas de crédito restan); el periodo no puede pasar de 5 años.
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string } }
        - { name: tipo, in: query, schema: { type: string, enum: [emitido, recibido] } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: clase, in: query, schema: { type: string, enum: [facturas, nc, nd] } }
        - { name: cbte, in: query, schema: { type: integer } }
        - { name: contraparte, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
      responses: { '200': { description: analisis }, '400': { description: filtro o periodo inválido }, '403': { description: CUIT fuera del alcance } }
  /api/mis-comprobantes/{cuit}/export.csv:
    get: { tags: [Mis Comprobantes], summary: Lo mismo en CSV (separador punto y coma), con los mismos filtros, parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: CSV } } }
  /api/mis-comprobantes/{cuit}/recibidos:
    get:
      tags: [Mis Comprobantes]
      summary: Recibidos de un rango y qué período está bajado (para conciliar con Factorum)
      description: >-
        Los comprobantes recibidos del CUIT con fecha de emisión entre `desde` y `hasta` (a lo sumo 2 años), ordenados por fecha,
        hasta 20.000 en una respuesta (`truncado` dice si había más; `total` cuántos hay). `cobertura` dice qué parte del período
        está bajada según las sincronizaciones que terminaron bien (`rangos`, `faltan`, `cubre`), la última que terminó bien, la
        última corrida (con su error, si falló) y la que está en curso. Alcanza con el rol lectura, dentro de los CUITs de la clave.
        Importes en la moneda del comprobante (con `tipoCambio`); `cuitEmisor` es el documento del emisor y `emisorApocrifo` sale
        de la constatación de recibidos (null si no se constató).
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string } }
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
        - { name: limite, in: query, schema: { type: integer, maximum: 20000 } }
      responses:
        '200':
          description: >-
            { ok, cuit, desde, hasta, total, tope, truncado, cobertura: { sincronizado, cubre, rangos: [{ desde, hasta }], faltan: [{ desde, hasta }],
            ultimaSincronizacion: { corrida, terminada, desde, hasta, cantidad } | null, ultimaCorrida: { corrida, estado, iniciada, terminada, desde, hasta, error } | null,
            enCurso: { corrida, estado, desde, hasta } | null, credencial, sincronizarDiaria }, comprobantes: [{ fecha, cbteTipo, puntoVenta, numeroDesde, numeroHasta,
            cae, docTipo, cuitEmisor, emisor, moneda, tipoCambio, netoGravado, noGravado, exento, iva, total, emisorApocrifo }] }
        '400': { description: CUIT o fechas inválidas, o período de más de 2 años }
        '403': { description: CUIT fuera del alcance }
  /api/mis-comprobantes/{cuit}/corridas:
    get: { tags: [Mis Comprobantes], summary: Historial de sincronizaciones, parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: corridas } } }
  /api/mis-comprobantes/{cuit}/credencial:
    get: { tags: [Mis Comprobantes], summary: Si hay clave fiscal cargada (nunca la devuelve), parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: "credencial: { cargada, cuitLogin, sincronizar, actualizada }" } } }
    put: { tags: [Mis Comprobantes], summary: Carga o cambia la clave fiscal (cifrada) y la sincronización diaria (admin+), parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], requestBody: { content: { application/json: { schema: { type: object, properties: { cuitLogin: { type: string }, clave: { type: string, format: password }, sincronizar: { type: boolean } } } } } }, responses: { '200': { description: ok } } }
    delete: { tags: [Mis Comprobantes], summary: Borra la clave fiscal (admin+), parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: ok } } }
  /api/mis-comprobantes/{cuit}/sincronizar:
    post:
      tags: [Mis Comprobantes]
      summary: Baja Mis Comprobantes con la sesión de agente de Fisherboy (admin+, u operador con ese CUIT)
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [desde, hasta], properties: { tipo: { type: string, enum: [emitidos, recibidos, ambos] }, desde: { type: string, format: date }, hasta: { type: string, format: date } } } } } }
      responses: { '202': { description: "corrida creada; seguila con /corridas/{id}" }, '400': { description: sin clave fiscal o fechas inválidas }, '409': { description: ya hay una corrida en curso para ese CUIT }, '503': { description: Fisherboy no configurado o caído } }
  /api/mis-comprobantes/corridas/{id}:
    get: { tags: [Mis Comprobantes], summary: Estado de una corrida, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: corrida } } }
  /api/mis-comprobantes/corridas/{id}/frame:
    get: { tags: [Mis Comprobantes], summary: Vista en vivo del navegador (JPEG 1280x800; 204 si no cambió desde `desde`), parameters: [ { name: id, in: path, required: true, schema: { type: integer } }, { name: desde, in: query, schema: { type: integer } } ], responses: { '200': { description: imagen }, '204': { description: sin cambios } } }
  /api/mis-comprobantes/corridas/{id}/evento:
    post: { tags: [Mis Comprobantes], summary: "Evento humano en el navegador: click, doble, texto, tecla, scroll, atras, recargar (solo en modo humano)", parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: ok }, '409': { description: la sesión no está en modo humano } } }
  /api/mis-comprobantes/corridas/{id}/tomar-control:
    post: { tags: [Mis Comprobantes], summary: Pausa la receta o la IA y pasa el navegador a una persona, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: ok } } }
  /api/mis-comprobantes/corridas/{id}/devolver:
    post: { tags: [Mis Comprobantes], summary: Devuelve el control a la receta o la IA, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: ok } } }

  /api/factorum/config:
    get: { tags: [Facturas recibidas], summary: URL de Factorum y si hay token cargado (superadmin; el token nunca vuelve), responses: { '200': { description: "factorum: { url, tokenCargado }" } } }
    put: { tags: [Facturas recibidas], summary: Guarda URL y token de Factorum (token cifrado; superadmin), requestBody: { content: { application/json: { schema: { type: object, properties: { url: { type: string }, token: { type: string } } } } } }, responses: { '200': { description: ok } } }
  /api/factorum/salud:
    get: { tags: [Facturas recibidas], summary: Si Factorum responde (versión, OCR, IA, si constata con Arcanum), responses: { '200': { description: "factorum: { ok, version, ocr, ia, arcanum }" } } }
  /api/factorum/verificar:
    post:
      tags: [Facturas recibidas]
      summary: Veredicto de una factura (valida, invalida, apocrifa, con_errores, no_verificable) sin guardarla (operador+)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nombre, contenido_base64], properties: { nombre: { type: string }, contenido_base64: { type: string, description: "hasta 20 MB" }, cuit_consultante: { type: string, description: "si falta y el usuario tiene un único CUIT permitido, se usa ese" }, ia: { type: boolean } } } } } }
      responses: { '200': { description: "{ veredicto, mensaje, resultado, constatacion }" }, '403': { description: rol o CUIT no permitido }, '503': { description: Factorum no configurado o caído } }
  /api/factorum/lotes:
    get: { tags: [Facturas recibidas], summary: Lotes subidos (con scope por CUIT, solo los de sus clientes), responses: { '200': { description: "{ lotes, total }" } } }
    post:
      tags: [Facturas recibidas]
      summary: Sube un lote de facturas o un ZIP; se procesa en segundo plano (operador+)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [archivos], properties: { archivos: { type: array, items: { type: object, properties: { nombre: { type: string }, contenido_base64: { type: string } } } }, cliente_cuit: { type: string }, nombre: { type: string }, ia: { type: boolean }, constatar: { type: boolean } } } } } }
      responses: { '202': { description: "lote creado" }, '413': { description: "más de 20 MB por archivo o 60 MB por lote" } }
  /api/factorum/lotes/{id}:
    get: { tags: [Facturas recibidas], summary: Un lote y su avance, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: lote } } }
  /api/factorum/comprobantes:
    get:
      tags: [Facturas recibidas]
      summary: Comprobantes leídos por Factorum
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [ok, revisar, error, aprobado] } }
        - { name: cliente, in: query, description: "CUIT del cliente; con scope por CUIT, obligatorio si hay varios permitidos", schema: { type: string } }
        - { name: emisor, in: query, schema: { type: string } }
        - { name: lote, in: query, schema: { type: integer } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: "razón social, CUIT o número", schema: { type: string } }
        - { name: limite, in: query, schema: { type: integer, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: "{ comprobantes, total }" } }
  /api/factorum/comprobantes/{id}:
    get: { tags: [Facturas recibidas], summary: Un comprobante con sus correcciones, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: "{ comprobante, correcciones }" } } }
    patch: { tags: [Facturas recibidas], summary: Corrige campos y opcionalmente aprueba (operador+; el usuario lo pone Arcanum), parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], requestBody: { content: { application/json: { schema: { type: object, properties: { campos: { type: object }, aprobar: { type: boolean } } } } } }, responses: { '200': { description: comprobante } } }
  /api/factorum/comprobantes/{id}/archivo:
    get: { tags: [Facturas recibidas], summary: Archivo original (PDF o imagen), parameters: [ { name: id, in: path, required: true, schema: { type: integer } }, { name: descargar, in: query, schema: { type: string, enum: ['1'] } } ], responses: { '200': { description: archivo } } }
  /api/factorum/resumen:
    get:
      tags: [Facturas recibidas]
      summary: Totales por alícuota, tipo y estado (las notas de crédito restan)
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [ok, revisar, error, aprobado] } }
        - { name: cliente, in: query, description: "CUIT del cliente; con scope por CUIT, obligatorio si hay varios permitidos", schema: { type: string } }
        - { name: emisor, in: query, schema: { type: string } }
        - { name: lote, in: query, schema: { type: integer } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: "razón social, CUIT o número", schema: { type: string } }
      responses: { '200': { description: "resumen: { cantidad, neto_gravado, iva_21, iva_10_5, otros_tributos, total, por_estado, por_tipo }" } }
  /api/factorum/export.xlsx:
    get:
      tags: [Facturas recibidas]
      summary: Excel con una fila por comprobante y una hoja Resumen
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [ok, revisar, error, aprobado] } }
        - { name: cliente, in: query, description: "CUIT del cliente; con scope por CUIT, obligatorio si hay varios permitidos", schema: { type: string } }
        - { name: emisor, in: query, schema: { type: string } }
        - { name: lote, in: query, schema: { type: integer } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: "razón social, CUIT o número", schema: { type: string } }
      responses: { '200': { description: xlsx } }
  /api/factorum/export.csv:
    get:
      tags: [Facturas recibidas]
      summary: CSV separado por punto y coma, UTF-8 con BOM y coma decimal
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [ok, revisar, error, aprobado] } }
        - { name: cliente, in: query, description: "CUIT del cliente; con scope por CUIT, obligatorio si hay varios permitidos", schema: { type: string } }
        - { name: emisor, in: query, schema: { type: string } }
        - { name: lote, in: query, schema: { type: integer } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: "razón social, CUIT o número", schema: { type: string } }
      responses: { '200': { description: CSV } }

  /api/monotributo/categorias:
    get: { tags: [Monotributo], summary: Topes por categoría cargados en Arcanum (con su vigencia), responses: { '200': { description: "categorias: { vigencia, fuente, topes }" } } }
    put: { tags: [Monotributo], summary: Reemplaza los topes (superadmin), requestBody: { content: { application/json: { schema: { type: object, required: [topes], properties: { vigencia: { type: string }, fuente: { type: string }, topes: { type: object, additionalProperties: { type: number } } } } } } }, responses: { '200': { description: ok } } }
  /api/monotributo/{cuit}:
    get:
      tags: [Monotributo]
      summary: Facturado en los últimos 12 meses contra el tope de la categoría (Mis Comprobantes + lo emitido por Arcanum)
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string } }
        - { name: categoria, in: query, description: "A a K; si falta, se toma del padrón", schema: { type: string } }
      responses: { '200': { description: "monotributo: { ingresos, categoria, tope, usado, alerta, margen, categoriaSugerida, vigenciaTopes }" } }

  /api/constatacion:
    post:
      tags: [Mis Comprobantes]
      summary: Constatación masiva de comprobantes recibidos (WSCDC + APOC del emisor), hasta 500. Solo consulta, no guarda; la permite el rol lectura (dentro de sus CUITs)
      requestBody: { content: { application/json: { schema: { type: object, required: [cuit], properties: { cuit: { type: string, description: quien los recibió (con certificado y WSCDC) }, items: { type: array, items: { type: object } }, csv: { type: string, description: "formato propio (cuitEmisor;puntoVenta;tipo;numero;fecha;importe;cae) o el CSV de Mis Comprobantes recibidos" } } } } } }
      responses: { '200': { description: "constatacion: { cantidad, validos, invalidos, conError, emisoresApocrifos, resultados }" }, '413': { description: más de 500 } }
  /api/mis-comprobantes/{cuit}/constatar:
    post: { tags: [Mis Comprobantes], summary: Constata los recibidos de Mis Comprobantes que no se constataron y guarda el resultado, parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: "constatacion: { cantidad, validos, invalidos, pendientes, observados }" } } }
  /api/mis-comprobantes/{cuit}/constatar/detener:
    post: { tags: [Mis Comprobantes], summary: Detiene la constatación de recibidos en curso (lo constatado queda; el resto sigue pendiente), parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: "constatacion: { estado, deteniendo, hechos, total }" }, '409': { description: no hay una constatación corriendo } } }

  /api/cola:
    get:
      tags: [Contingencia]
      summary: Comprobantes en la cola de contingencia (los que se pidieron con ARCA caído)
      parameters:
        - { name: cuit, in: query, schema: { type: string } }
        - { name: estado, in: query, schema: { type: string, enum: [pendiente, procesando, emitido, rechazado, requiere_humano, cancelado] } }
      responses: { '200': { description: cola } }
  /api/cola/{id}:
    get: { tags: [Contingencia], summary: Un ítem de la cola, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: item } } }
  /api/cola/{id}/reintentar:
    post: { tags: [Contingencia], summary: "Reintenta ya. Con fechaHoy=true lo emite con la fecha de hoy (solo si una persona lo decide)", parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], requestBody: { content: { application/json: { schema: { type: object, properties: { fechaHoy: { type: boolean } } } } } }, responses: { '200': { description: item }, '409': { description: ya emitido o cancelado } } }
  /api/cola/{id}/cancelar:
    post: { tags: [Contingencia], summary: Cancela un ítem que todavía no salió, parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ], responses: { '200': { description: item }, '409': { description: ya emitido } } }

  /api/caea/{cuit}:
    get: { tags: [Contingencia], summary: "CAEA del CUIT: config, códigos por quincena y comprobantes CAEA sin informar", parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: "caea: { config, caeas, pendientes }" } } }
  /api/caea/{cuit}/config:
    put:
      tags: [Contingencia]
      summary: Prende o apaga CAEA para el CUIT (admin+). El punto de venta se valida en ARCA (EmisionTipo CAEA)
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { activo: { type: boolean }, puntoVenta: { type: integer }, minutosEspera: { type: integer, minimum: 5 } } } } } }
      responses: { '200': { description: config }, '400': { description: punto de venta inexistente, bloqueado o no CAEA }, '503': { description: no se pudo validar con ARCA } }
  /api/caea/{cuit}/solicitar:
    post: { tags: [Contingencia], summary: Pide o recupera el CAEA de la quincena en curso y la próxima, parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: "quincenas: [{ periodo, orden, estado: obtenido|ya_estaba|todavia_no }]" } } }
  /api/caea/{cuit}/informar:
    post: { tags: [Contingencia], summary: "Informa a ARCA lo emitido con CAEA y los CAEA vencidos sin movimiento", parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: "informe: { informados, errores }, sinMovimiento" } } }

  /api/wsfev1/sincronizar:
    post:
      tags: [Contingencia]
      summary: Trae de ARCA los comprobantes emitidos por fuera de Arcanum (huecos incluidos) y avisa diferencias
      requestBody: { content: { application/json: { schema: { type: object, required: [cuit], properties: { cuit: { type: string }, dias: { type: integer, default: 90 } } } } } }
      responses: { '200': { description: "sincronizacion: { traidos, porPuntoVenta, diferencias, pendiente }" } }

  /api/wsaa/{cuit}/{service}:
    get:
      tags: [Servicios]
      summary: Inspecciona el Ticket de Acceso (diagnóstico)
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string, example: wsfe } }
      responses: { '200': { description: ok } }
    delete:
      tags: [Servicios]
      summary: Invalida el Ticket de Acceso cacheado
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: ok } }
