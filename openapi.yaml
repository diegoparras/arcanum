      description: "items[] con codigoCondicionIVA e importeIVA por línea; subtotalesIVA[] por alícuota."
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: aprobado }, '422': { description: rechazado } }

  /api/padron/{alcance}/{cuit}:
