openapi: 3.0.3
info:
  title: Arcanum — Gateway REST para ARCA (ex-AFIP)
  version: 0.10.6
  description: >
    API REST self-hosted que envuelve los Web Services SOAP de ARCA. Firma WSAA
    100% local, token cacheado, multi-cliente y multi-entorno. Pensada para n8n.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8094
    description: Instancia local
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - name: MCP
  - name: Mis Comprobantes
  - name: Facturas recibidas
  - name: Monotributo
  - name: Contingencia
  - name: Claves
  - name: Auth
  - name: Config
  - name: Clientes
  - name: Servicios
  - name: WSFEv1
  - name: Padron
  - name: e-Ventanilla
  - name: Comprobantes
  - name: Webhooks
  - name: Usuarios
  - name: Metricas
components:
  securitySchemes:
    ApiKeyAuth: { type: apiKey, in: header, name: X-API-Key }
    BearerAuth: { type: http, scheme: bearer, description: "La misma clave, como Authorization: Bearer <clave>" }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Un reintento con la misma clave devuelve el comprobante ya emitido (no pide otro CAE). Equivale a idempotencyKey en el cuerpo.
  schemas:
    AlicuotaIva:
      type: object
      properties:
        id: { type: integer, example: 5, description: "3=27%,4=10.5%,5=21%,6=5%,8=2.5%,9=0%" }
        baseImponible: { type: number, example: 100 }
        importe: { type: number, example: 21 }
    ComprobanteAsociado:
      type: object
      properties:
        tipo: { type: integer }
        puntoVenta: { type: integer }
        numero: { type: integer }
        cuit: { type: string }
        fecha: { type: string }
    Comprobante:
      type: object
      required: [cuit, puntoVenta, tipoComprobante, importeTotal]
      properties:
        cuit: { type: string, example: "20111111112" }
        puntoVenta: { type: integer, example: 1 }
        tipoComprobante: { type: integer, example: 11, description: "1=A,6=B,11=C,3/8/13=NC,2/7/12=ND" }
        concepto: { type: integer, example: 1, description: "1=Productos,2=Servicios,3=Ambos" }
        tipoDocReceptor: { type: integer, example: 99 }
        nroDocReceptor: { type: string, example: "0" }
        numero: { type: integer, nullable: true, description: "Si se omite, ultimo autorizado + 1" }
        fecha: { type: string, example: "2026-06-24" }
        importeNeto: { type: number }
        importeIva: { type: number }
        importeTotal: { type: number }
        importeNoGravado: { type: number }
        importeExento: { type: number }
        importeTributos: { type: number }
        moneda: { type: string, example: "PES" }
        cotizacion: { type: number, example: 1 }
        idempotencyKey: { type: string, description: "Evita doble CAE en reintentos" }
        alicuotasIva: { type: array, items: { $ref: '#/components/schemas/AlicuotaIva' } }
        comprobantesAsociados: { type: array, items: { $ref: '#/components/schemas/ComprobanteAsociado' } }
        fechaServicioDesde: { type: string, nullable: true }
        fechaServicioHasta: { type: string, nullable: true }
        fechaVtoPago: { type: string, nullable: true }
        condicionIvaReceptor: { type: integer, description: "RG 5616: 1 Responsable Inscripto, 4 Exento, 5 Consumidor Final, 6 Monotributo" }
        receptorNombre: { type: string, description: "Para el PDF. Con CUIT (tipoDocReceptor 80), si falta se toma del padron de ARCA" }
        receptorDomicilio: { type: string, description: "Para el PDF. Con CUIT, si falta se toma del padron de ARCA" }
        condicionVenta: { type: string, example: "Contado", description: "Para el PDF" }
        items:
          type: array
          description: "Detalle para el PDF (no viaja a ARCA en WSFEv1)"
          items: { type: object, properties: { codigo: { type: string }, descripcion: { type: string }, cantidad: { type: number }, unidadMedida: { type: string }, precioUnitario: { type: number }, bonifPct: { type: number }, subtotal: { type: number } } }
        pdf: { type: object, properties: { modelo: { type: string, enum: [arca, arcanum] }, nombreArchivo: { type: string } } }
        contingencia: { type: boolean, description: "Si ARCA no responde, encolar (202) en vez de fallar" }
paths:
  /api/health:
    get: { tags: [Metricas], summary: Estado del servicio (sin auth), security: [], responses: { '200': { description: OK } } }
  /metrics:
    get: { tags: [Metricas], summary: Metricas en formato Prometheus (sin auth), security: [], responses: { '200': { description: texto Prometheus } } }
  /api/metrics:
    get: { tags: [Metricas], summary: Metricas (JSON), responses: { '200': { description: resumen } } }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login de la UI (devuelve cookie de sesion)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { username: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: ok }, '401': { description: credenciales invalidas }, '429': { description: demasiados intentos } }
  /api/auth/logout:
    post: { tags: [Auth], summary: Cierra la sesion, security: [], responses: { '200': { description: ok } } }
  /api/auth/me:
    get: { tags: [Auth], summary: Usuario autenticado, responses: { '200': { description: ok } } }
  /api/auth/config:
    get: { tags: [Auth], summary: Indica si OIDC esta habilitado, security: [], responses: { '200': { description: ok } } }
  /api/auth/oidc/login:
    get: { tags: [Auth], summary: Inicia el login OIDC (redirect), security: [], responses: { '302': { description: redirect al issuer } } }
  /api/auth/oidc/callback:
    get: { tags: [Auth], summary: Callback OIDC (verifica id_token), security: [], responses: { '302': { description: redirect a / } } }

  /mcp:
    post:
      tags: [MCP]
      summary: Servidor MCP de solo consulta (JSON-RPC 2.0, Streamable HTTP, sin estado)
      description: >
        Herramientas padron, comprobante, ultimo_comprobante, puntos_de_venta y estado_arca.
        Ninguna emite ni modifica nada. Exige clave (Bearer o X-API-Key); no acepta la cookie del panel.
      security: [ { BearerAuth: [] }, { ApiKeyAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, example: { jsonrpc: "2.0", id: 1, method: tools/list } } } } }
      responses: { '200': { description: respuesta JSON-RPC }, '202': { description: notificacion aceptada (sin cuerpo) }, '401': { description: falta la clave o es invalida }, '405': { description: solo POST } }

  /api/claves:
    get: { tags: [Claves], summary: Lista las claves de API (rol admin+), responses: { '200': { description: ok } } }
    post:
      tags: [Claves]
      summary: Crea una clave de API. La clave en claro se devuelve una sola vez.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nombre, rol], properties: { nombre: { type: string, example: SecretarIA }, rol: { type: string, enum: [lectura, operador, admin] }, cuits: { type: array, items: { type: string } }, venceDias: { type: integer, minimum: 1, maximum: 3650 }, limitePorMinuto: { type: integer, minimum: 1 } } } } } }
      responses: { '200': { description: clave creada }, '400': { description: datos invalidos }, '403': { description: rol insuficiente } }
  /api/claves/{id}/rotar:
    post:
      tags: [Claves]
      summary: Rota una clave. Crea una nueva con los mismos permisos; la anterior vence en graciaDias (7 por defecto).
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { graciaDias: { type: integer, minimum: 0, maximum: 90 } } } } } }
      responses: { '200': { description: clave nueva (en claro, una sola vez) y vencimiento de la anterior }, '404': { description: no existe, vencida o dada de baja } }
  /api/claves/{id}/uso:
    get:
      tags: [Claves]
      summary: Uso de una clave (totales, por operacion, por dia y ultimos pedidos)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: dias, in: query, required: false, schema: { type: integer, default: 30, maximum: 365 } }
      responses: { '200': { description: ok } }
  /api/claves/{id}:
    delete:
      tags: [Claves]
      summary: Da de baja una clave (deja de funcionar al instante)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: ok }, '404': { description: no existe o ya dada de baja } }

  /api/config:
    get: { tags: [Config], summary: Entorno activo y version, responses: { '200': { description: ok } } }
  /api/novedades:
    get:
      tags: [Config]
      summary: Que cambio en cada version (del CHANGELOG)
      description: Sin parametros, las notas de la version que corre. Con `desde`, las de las versiones posteriores a esa y hasta la actual (la UI lo usa para avisar despues de un deploy). Con `todas=1`, el historial.
      parameters:
        - { name: desde, in: query, required: false, schema: { type: string, example: 0.10.2 } }
        - { name: todas, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: '{ ok, version, versiones: [{ version, fecha, secciones: [{ titulo, items: [string] }] }] }'
  /api/config/entorno:
    post:
      tags: [Config]
      summary: Cambia el entorno (homo/prod). Rol admin+. Persistido.
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { entorno: { type: string, enum: [homo, prod] } } } } } }
      responses: { '200': { description: ok }, '403': { description: rol insuficiente } }

  /api/tenants:
    get: { tags: [Clientes], summary: Lista de CUITs con metadata del certificado, responses: { '200': { description: ok } } }
    post:
      tags: [Clientes]
      summary: Alta de cliente — genera clave y CSR (rol operador+)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { cuit: { type: string }, nombre: { type: string } } } } } }
      responses: { '200': { description: devuelve el CSR } }
  /api/tenants/{cuit}/csr:
    get:
      tags: [Clientes]
      summary: Descarga el CSR generado
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: PEM del CSR } }
  /api/tenants/{cuit}/certificate:
    post:
      tags: [Clientes]
      summary: Carga el .crt que devolvio ARCA (valida que case con la clave)
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { certPem: { type: string } } } } } }
      responses: { '200': { description: ok }, '422': { description: el cert no corresponde a la clave } }
  /api/tenants/{cuit}/importar:
    post:
      tags: [Clientes]
      summary: Importa un par clave+certificado existente
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { nombre: { type: string }, keyPem: { type: string }, certPem: { type: string } } } } } }
      responses: { '200': { description: ok } }
  /api/tenants/{cuit}/emisor:
    get:
      tags: [Clientes]
      summary: Datos fiscales del emisor para el PDF y cuales faltan
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: "emisor { razonSocial, nombreFantasia, domicilio, condicionIva (RI|MONOTRIBUTO|EXENTO), iibb, inicioActividades, mipyme }, faltan [{ campo, etiqueta, desdeArca }]" } }
    put:
      tags: [Clientes]
      summary: Guarda los datos fiscales del emisor (rol operador+)
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { razonSocial: { type: string }, nombreFantasia: { type: string }, domicilio: { type: string }, condicionIva: { type: string, enum: [RI, MONOTRIBUTO, EXENTO] }, iibb: { type: string }, inicioActividades: { type: string, format: date }, mipyme: { type: boolean } } } } } }
      responses: { '200': { description: ok } }
  /api/tenants/{cuit}/emisor/completar:
    post:
      tags: [Clientes]
      summary: Completa desde el padron de ARCA razon social, domicilio y condicion frente al IVA que esten vacios (no pisa lo cargado). Ingresos Brutos e inicio de actividades no los da ARCA.
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: "emisor, completados [campo], faltan [...], error (si el padron no respondio)" } }
  /api/tenants/{cuit}:
    delete:
      tags: [Clientes]
      summary: Elimina un cliente (rol operador+)
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }

  /api/services:
    get: { tags: [Servicios], summary: Catalogo de servicios de ARCA, responses: { '200': { description: ok } } }
    post: { tags: [Servicios], summary: Agrega un servicio al catalogo (rol admin+), responses: { '200': { description: ok } } }
  /api/services/{id}:
    get:
      tags: [Servicios]
      summary: Detalle de un servicio
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }
    put:
      tags: [Servicios]
      summary: Edita un servicio (rol admin+)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }
    delete:
      tags: [Servicios]
      summary: Borra / restaura un servicio (rol admin+)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }
  /api/services/{id}/operaciones:
    get:
      tags: [Servicios]
      summary: Introspeccion del WSDL — lista operaciones y campos
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }
  /api/services/{id}/verificar:
    get:
      tags: [Servicios]
      summary: Verifica si el certificado del CUIT esta asociado a este servicio
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cuit, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: "{ asociado: bool, motivo? }" } }
  /api/services/{id}/reset:
    post: { tags: [Servicios], summary: Restaura un builtin al default (admin+), parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: ok } } }
  /api/services/{id}/enabled:
    post: { tags: [Servicios], summary: Habilita/deshabilita un servicio (admin+), parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: ok } } }

  /api/ws/{servicio}/{operacion}:
    post:
      tags: [Servicios]
      summary: Passthrough generico — invoca cualquier operacion de cualquier servicio
      parameters:
        - { name: servicio, in: path, required: true, schema: { type: string } }
        - { name: operacion, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { cuit: { type: string }, params: { type: object } } } } } }
      responses: { '200': { description: respuesta de ARCA parseada } }

  /api/wsfev1/status:
    get: { tags: [WSFEv1], summary: Estado de WSFEv1 (FEDummy), responses: { '200': { description: ok } } }
  /api/wsfev1/parametros/{nombre}:
    get:
      tags: [WSFEv1]
      summary: Tablas de parametros (catalogos)
      parameters:
        - { name: nombre, in: path, required: true, schema: { type: string, enum: [tiposComprobante, tiposDocumento, tiposConcepto, alicuotasIva, monedas, tiposTributo, puntosVenta] } }
        - { name: cuit, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: ok } }
  /api/wsfev1/ultimo-autorizado:
    get:
      tags: [WSFEv1]
      summary: Ultimo numero autorizado
      parameters:
        - { name: cuit, in: query, required: true, schema: { type: string } }
        - { name: puntoVenta, in: query, required: true, schema: { type: integer } }
        - { name: tipoComprobante, in: query, required: true, schema: { type: integer } }
      responses: { '200': { description: ok } }
  /api/wsfev1/consultar:
    get:
      tags: [WSFEv1]
      summary: Consulta / reimprime un comprobante
      parameters:
        - { name: cuit, in: query, required: true, schema: { type: string } }
        - { name: puntoVenta, in: query, required: true, schema: { type: integer } }
        - { name: tipoComprobante, in: query, required: true, schema: { type: integer } }
        - { name: numero, in: query, required: true, schema: { type: integer } }
      responses: { '200': { description: ok } }
  /api/wsfev1/comprobantes/vista-previa:
    post:
      tags: [WSFEv1]
      summary: Vista previa de un comprobante (NO emite ni reserva numero)
      description: >
        Mismo cuerpo que la emision. Valida importes, IVA, tipo, receptor (con su padron si es CUIT), condicion de IVA,
        fecha y RG 5866, sugiere la letra y devuelve el numero que le tocaria y el cuerpo listo para emitir.
        Permitido tambien a las claves de rol lectura.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Comprobante' } } } }
      responses: { '200': { description: "vistaPrevia: { valido, problemas, advertencias, numeroPropuesto, cuerpoParaEmitir, ... }" } }
  /api/wsfev1/comprobantes:
    # contingencia: true (o header X-Arcanum-Contingencia: 1) => si ARCA no responde, 202 { encolado, cola }
    post:
      tags: [WSFEv1]
      summary: Emitir comprobante y obtener CAE
      description: Requiere rol operador o superior (una clave de rol lectura recibe 403).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Comprobante' } } } }
      responses: { '200': { description: aprobado }, '403': { description: solo lectura o rol insuficiente }, '422': { description: rechazado } }
  /api/wsfev1/lote:
    post:
      tags: [WSFEv1]
      summary: Emision por lote (JSON {comprobantes:[...]} o CSV)
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { comprobantes: { type: array, items: { $ref: '#/components/schemas/Comprobante' } } } } }
          text/csv: { schema: { type: string } }
      responses: { '200': { description: "{ total, aprobados, rechazados, resultados[] }" } }

  /api/wsfex/status:
    get: { tags: [WSFEXv1], summary: Estado (FEXDummy), responses: { '200': { description: ok } } }
  /api/wsfex/ultimo-autorizado:
    get:
      tags: [WSFEXv1]
      summary: Ultimo Nro de Factura E autorizado
      parameters:
        - { name: cuit, in: query, required: true, schema: { type: string } }
        - { name: puntoVenta, in: query, required: true, schema: { type: integer } }
      responses: { '200': { description: "{ ultimoNumero, fecha }" } }
  /api/wsfex/comprobantes:
    post:
      tags: [WSFEXv1]
      summary: Emitir Factura E de exportacion (cod. 19) y obtener CAE
      description: "Requiere: puntoVenta, cliente, paisDestino, moneda, cotizacion, importeTotal, items[]. Opcional: incoterms, tipoExportacion, permisoExistente, permisos[]."
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: aprobado }, '422': { description: rechazado } }

  /api/wsmtxca/status:
    get: { tags: [WSMTXCA], summary: Estado (dummy), responses: { '200': { description: ok } } }
  /api/wsmtxca/ultimo-autorizado:
    get:
      tags: [WSMTXCA]
      summary: Ultimo Nro autorizado (por pto de venta y tipo)
      parameters:
        - { name: cuit, in: query, required: true, schema: { type: string } }
        - { name: puntoVenta, in: query, required: true, schema: { type: integer } }
        - { name: tipoComprobante, in: query, required: true, schema: { type: integer } }
      responses: { '200': { description: "{ ultimoNumero }" } }
  /api/wsmtxca/comprobantes:
    post:
      tags: [WSMTXCA]
      summary: Emitir comprobante con detalle (IVA por item) y obtener CAE
      description: "items[] con codigoCondicionIVA e importeIVA por linea; subtotalesIVA[] por alicuota."
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: aprobado }, '422': { description: rechazado } }

  /api/padron/{alcance}/{cuit}:
    get:
      tags: [Padron]
      summary: Consulta de padron (a13=Mi Categoria, a5=Constancia)
      parameters:
        - { name: alcance, in: path, required: true, schema: { type: string, enum: [a13, a5] } }
        - { name: cuit, in: path, required: true, schema: { type: string, description: CUIT a consultar } }
        - { name: cuit, in: query, required: true, schema: { type: string, description: CUIT representante (cert cargado) } }
        - { name: fresco, in: query, required: false, schema: { type: string, enum: ['1'] }, description: "1 = ignorar el cache de una hora y consultar a ARCA" }
      responses: { '200': { description: "datos del contribuyente + cache: { usado, consultado }" } }

  /api/apoc/{cuit}:
    get:
      tags: [Padron]
      summary: Consulta base de apocrifos (WSAPOC) — ¿el CUIT figura como apocrifo?
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string, description: CUIT a consultar } }
        - { name: cuit, in: query, required: true, schema: { type: string, description: CUIT representante (cert cargado) } }
      responses: { '200': { description: "{ esApocrifo, codigo, descripcion, fechaCondicion, fechaPublicacion }" } }

  /api/contribuyente/{cuit}:
    get:
      tags: [Padron]
      summary: Vista consolidada (padron A5 + apocrifos) con semaforo de riesgo fiscal
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string, description: CUIT a consultar } }
        - { name: cuit, in: query, required: true, schema: { type: string, description: CUIT representante (cert cargado) } }
      responses: { '200': { description: "{ semaforo: VERDE|AMARILLO|ROJO, fiscal: { tipoContribuyente, condicionIVA, tipoComprobante, estadoClave }, apoc, motivoRiesgo }" } }

  /api/eventanilla/status:
    get: { tags: [e-Ventanilla], summary: Estado (dummy), responses: { '200': { description: ok } } }
  /api/eventanilla/comunicaciones:
    get:
      tags: [e-Ventanilla]
      summary: Lista comunicaciones (ventana max 31 dias)
      parameters:
        - { name: cuit, in: query, required: true, schema: { type: string } }
        - { name: desde, in: query, schema: { type: string, example: "2026-05-25" } }
