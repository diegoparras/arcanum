openapi: 3.0.3
info:
  title: Arcanum — Gateway REST para ARCA (ex-AFIP)
  version: 2.3.1
  description: >
    API REST self-hosted que envuelve los Web Services SOAP de ARCA. Firma WSAA
    100% local, token cacheado, multi-cliente y multi-entorno. Pensada para n8n.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8094
    description: Instancia local
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - name: MCP
  - name: Mis Comprobantes
  - name: Facturas recibidas
  - name: Monotributo
  - name: Contingencia
  - name: Claves
  - name: Suite
  - name: Auth
  - name: Config
  - name: Clientes
  - name: Servicios
  - name: WSFEv1
  - name: Padron
  - name: e-Ventanilla
  - name: Comprobantes
  - name: Webhooks
  - name: Usuarios
  - name: Metricas
components:
  securitySchemes:
    ApiKeyAuth: { type: apiKey, in: header, name: X-API-Key }
    BearerAuth: { type: http, scheme: bearer, description: "La misma clave, como Authorization: Bearer <clave>" }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Un reintento con la misma clave devuelve el comprobante ya emitido (no pide otro CAE). Equivale a idempotencyKey en el cuerpo. La clave vale por CUIT y entorno - la misma clave en otro CUIT es otra emisión.
  schemas:
    AlicuotaIva:
      type: object
      properties:
        id: { type: integer, example: 5, description: "3=27%,4=10.5%,5=21%,6=5%,8=2.5%,9=0%" }
        baseImponible: { type: number, example: 100 }
        importe: { type: number, example: 21 }
    ComprobanteAsociado:
      type: object
      properties:
        tipo: { type: integer }
        puntoVenta: { type: integer }
        numero: { type: integer }
        cuit: { type: string }
        fecha: { type: string }
    Comprobante:
      type: object
      required: [cuit, puntoVenta, tipoComprobante, importeTotal]
      properties:
        cuit: { type: string, example: "20111111112" }
        puntoVenta: { type: integer, example: 1 }
        tipoComprobante: { type: integer, example: 11, description: "1=A,6=B,11=C,3/8/13=NC,2/7/12=ND" }
        concepto: { type: integer, example: 1, description: "1=Productos,2=Servicios,3=Ambos" }
        tipoDocReceptor: { type: integer, example: 99 }
        nroDocReceptor: { type: string, example: "0" }
        numero: { type: integer, nullable: true, description: "Si se omite, último autorizado + 1" }
        fecha: { type: string, example: "2026-06-24" }
        importeNeto: { type: number }
        importeIva: { type: number }
        importeTotal: { type: number }
        importeNoGravado: { type: number }
        importeExento: { type: number }
        importeTributos: { type: number }
        moneda: { type: string, example: "PES" }
        cotizacion: { type: number, example: 1 }
        idempotencyKey: { type: string, description: "Evita doble CAE en reintentos" }
        alicuotasIva: { type: array, items: { $ref: '#/components/schemas/AlicuotaIva' } }
        comprobantesAsociados: { type: array, items: { $ref: '#/components/schemas/ComprobanteAsociado' } }
        fechaServicioDesde: { type: string, nullable: true }
        fechaServicioHasta: { type: string, nullable: true }
        fechaVtoPago: { type: string, nullable: true }
        condicionIvaReceptor: { type: integer, description: "RG 5616: 1 Responsable Inscripto, 4 Exento, 5 Consumidor Final, 6 Monotributo" }
        receptorNombre: { type: string, description: "Para el PDF. Con CUIT (tipoDocReceptor 80), si falta se toma del padrón de ARCA" }
        receptorDomicilio: { type: string, description: "Para el PDF. Con CUIT, si falta se toma del padrón de ARCA" }
        condicionVenta: { type: string, example: "Contado", description: "Para el PDF" }
        items:
          type: array
          description: "Detalle para el PDF (no viaja a ARCA en WSFEv1)"
          items: { type: object, properties: { codigo: { type: string }, descripcion: { type: string }, cantidad: { type: number }, unidadMedida: { type: string }, precioUnitario: { type: number }, bonifPct: { type: number }, subtotal: { type: number } } }
        pdf: { type: object, properties: { modelo: { type: string, enum: [arca, arcanum] }, nombreArchivo: { type: string } } }
        contingencia: { type: boolean, description: "Si ARCA no responde, encolar (202) en vez de fallar" }
paths:
  /api/health:
    get: { tags: [Metricas], summary: Estado del servicio (sin auth), security: [], responses: { '200': { description: OK } } }
  /metrics:
    get: { tags: [Metricas], summary: Métricas en formato Prometheus (sin auth), security: [], responses: { '200': { description: texto Prometheus } } }
  /api/metrics:
    get: { tags: [Metricas], summary: Métricas (JSON), responses: { '200': { description: resumen } } }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login de la UI (devuelve cookie de sesión)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { username: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: ok }, '401': { description: credenciales inválidas }, '429': { description: demasiados intentos } }
  /api/auth/logout:
    post: { tags: [Auth], summary: Cierra la sesión, security: [], responses: { '200': { description: ok } } }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Usuario autenticado
      description: >
        `usuario.email` (2.2.1) es el email con el que Arcanum presenta a la persona en la suite: el
        de su ficha en Usuarios o, si entró por Lockatus y la ficha no lo tiene, el email verificado
        de Lockatus. `null` si no hay ninguno.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  usuario:
                    type: object
                    properties:
                      username: { type: string }
                      role: { type: string, enum: [superadmin, admin, operador, lectura] }
                      cuitAllow: { type: array, nullable: true, items: { type: string } }
                      origen: { type: string, nullable: true, description: "local, oidc (Lockatus) o suite (entró con un pase)" }
                      debeCambiar: { type: boolean }
                      via: { type: string, nullable: true }
                      email: { type: string, nullable: true, example: diego@estudio.com }
                  funciones: { type: object }
  /api/auth/config:
    get: { tags: [Auth], summary: Indica si OIDC está habilitado, security: [], responses: { '200': { description: ok } } }
  /api/auth/oidc/login:
    get: { tags: [Auth], summary: Inicia el login OIDC (redirect), security: [], responses: { '302': { description: redirect al issuer } } }
  /api/auth/oidc/callback:
    get: { tags: [Auth], summary: Callback OIDC (verifica id_token), security: [], responses: { '302': { description: redirect a / } } }

  /mcp:
    post:
      tags: [MCP]
      summary: Servidor MCP de solo consulta (JSON-RPC 2.0, Streamable HTTP, sin estado)
      description: >
        Herramientas padron, comprobante, ultimo_comprobante, puntos_de_venta y estado_arca.
        Ninguna emite ni modifica nada. Exige clave (Bearer o X-API-Key); no acepta la cookie del panel.
      security: [ { BearerAuth: [] }, { ApiKeyAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, example: { jsonrpc: "2.0", id: 1, method: tools/list } } } } }
      responses: { '200': { description: respuesta JSON-RPC }, '202': { description: notificación aceptada (sin cuerpo) }, '401': { description: falta la clave o es inválida }, '405': { description: solo POST } }

  /api/claves:
    get: { tags: [Claves], summary: Lista las claves de API (rol admin+), responses: { '200': { description: ok } } }
    post:
      tags: [Claves]
      summary: Crea una clave de API. La clave en claro se devuelve una sola vez.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nombre, rol], properties: { nombre: { type: string, example: SecretarIA }, rol: { type: string, enum: [lectura, operador, admin] }, cuits: { type: array, items: { type: string } }, venceDias: { type: integer, minimum: 1, maximum: 3650 }, limitePorMinuto: { type: integer, minimum: 1 }, suite: { type: boolean, description: "Puede abrir sesiones de la suite (POST /api/suite/pase)" }, suiteRolTope: { type: string, enum: [lectura, operador, admin, superadmin], default: operador, description: "admin y superadmin solo los pone un superadmin; con cuits, hasta operador. Un valor que no se entiende es un 400" } } } } } }
      responses: { '200': { description: clave creada }, '400': { description: datos inválidos }, '403': { description: rol insuficiente } }
  /api/claves/{id}/rotar:
    post:
      tags: [Claves]
      summary: Rota una clave. Crea una nueva con los mismos permisos; la anterior vence en graciaDias (7 por defecto).
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { graciaDias: { type: integer, minimum: 0, maximum: 90 } } } } } }
      responses: { '200': { description: clave nueva (en claro, una sola vez) y vencimiento de la anterior }, '404': { description: no existe, vencida o dada de baja } }
  /api/claves/{id}/uso:
    get:
      tags: [Claves]
      summary: Uso de una clave (totales, por operación, por día y últimos pedidos)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: dias, in: query, required: false, schema: { type: integer, default: 30, maximum: 365 } }
      responses: { '200': { description: ok } }
  /api/claves/{id}:
    delete:
      tags: [Claves]
      summary: Da de baja una clave (deja de funcionar al instante)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: ok }, '404': { description: no existe o ya dada de baja } }
  /api/claves/{id}/suite:
    patch:
      tags: [Claves, Suite]
      summary: Prende o apaga "puede abrir sesiones de la suite" y fija el rol tope (admin+; tope admin o superadmin, solo superadmin)
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [suite], properties: { suite: { type: boolean }, suiteRolTope: { type: string, enum: [lectura, operador, admin, superadmin] } } } } } }
      responses: { '200': { description: la clave }, '400': { description: tope invalido (o admin/superadmin con CUITs) }, '403': { description: rol insuficiente }, '404': { description: no existe, vencida o dada de baja } }

  /api/suite/pase:
    post:
      tags: [Suite]
      summary: Pase para entrar a Arcanum desde otra app de la suite (Factorum). Solo con una clave habilitada para la suite (nunca con la cookie de sesión).
      description: >
        Contrato en docs/suite-pase.md. Si la persona ya existe en Arcanum (por email, sin distinguir mayúsculas)
        manda su rol y sus CUITs de Arcanum; si no, se crea (origen factorum) con el rol traducido
        (superadmin, admin, usuario -> operador, lectura). En los dos casos el rol queda topeado por la clave y
        los CUITs se intersecan con los de la clave. El pase sirve una vez y vence a los 60 s.
      security: [ { ApiKeyAuth: [] }, { BearerAuth: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [app, email, rol], properties: { app: { type: string, enum: [factorum] }, email: { type: string }, nombre: { type: string }, rol: { type: string, enum: [superadmin, admin, usuario, lectura] }, cuits: { type: array, nullable: true, items: { type: string } } } } } } }
      responses:
        '200': { description: '{ ok, url: "https://<publica>/suite/entrar?pase=<token>", vence }' }
        '401': { description: sin clave o clave inválida }
        '403': { description: 'clave sin el flag ("Esta clave no está habilitada para abrir sesiones de la suite"), persona desactivada, alta automática apagada, sin rol válido o sin CUITs en común' }
        '409': { description: '"Falta la URL pública de Arcanum"' }
  /suite/entrar:
    get:
      tags: [Suite]
      summary: Canjea un pase y abre la misma sesión revocable que el login (302 a /). Inválido o vencido, 302 a /?suite=pase-vencido.
      security: []
      parameters: [ { name: pase, in: query, required: true, schema: { type: string } } ]
      responses: { '302': { description: redirige a / (con la cookie de sesión) o al login } }
  /api/suite/apps:
    get:
      tags: [Suite]
      summary: Apps de la suite conectadas (Factorum) y si respondieron a su healthz en los últimos 60 s. Sesión, cualquier rol.
      responses: { '200': { description: '{ ok, apps: [ { app, nombre, disponible } ] }' } }
  /api/suite/abrir/{app}:
    post:
      tags: [Suite]
      summary: Pide a la otra app un pase para la persona de la sesión y devuelve la URL para entrar. Sesión del panel, cualquier rol (también lectura); pasa por el control CSRF como el resto del panel.
      parameters: [ { name: app, in: path, required: true, schema: { type: string, enum: [factorum] } } ]
      responses: { '200': { description: '{ ok, url }' }, '403': { description: con clave de API, usuario desactivado o la otra app lo rechazó }, '409': { description: Factorum sin conectar o el usuario no tiene email }, '502': { description: Factorum no responde o rechazó el token de Arcanum } }
  /api/suite/config:
    get: { tags: [Suite], summary: URL pública de Arcanum y alta automática (superadmin), responses: { '200': { description: ok } } }
    put:
      tags: [Suite]
      summary: Cambia la URL pública de Arcanum y el alta automática (superadmin). Pisa a ARCANUM_PUBLIC_URL.
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { urlPublica: { type: string }, crearUsuarios: { type: boolean } } } } } }
      responses: { '200': { description: ok } }
  /api/suite/auditoria:
    get:
      tags: [Suite]
      summary: Pases emitidos, usados y rechazados, y pedidos a la otra app (admin+). Nunca el token.
      parameters: [ { name: limite, in: query, required: false, schema: { type: integer, default: 50, maximum: 500 } } ]
      responses: { '200': { description: ok } }

  /api/config:
    get: { tags: [Config], summary: Entorno activo y versión, responses: { '200': { description: ok } } }
  /api/novedades:
    get:
      tags: [Config]
      summary: Qué cambió en cada versión (del CHANGELOG)
      description: Sin parámetros, las notas de la versión que corre. Con `desde`, las de las versiones posteriores a esa y hasta la actual (la UI lo usa para avisar después de un deploy). Con `todas=1`, el historial.
      parameters:
        - { name: desde, in: query, required: false, schema: { type: string, example: 0.10.2 } }
        - { name: todas, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: '{ ok, version, versiones: [{ version, fecha, secciones: [{ titulo, items: [string] }] }] }'
  /api/config/entorno:
    post:
      tags: [Config]
      summary: Cambia el entorno (homo/prod). Rol admin+. Persistido.
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { entorno: { type: string, enum: [homo, prod] } } } } } }
      responses: { '200': { description: ok }, '403': { description: rol insuficiente } }

  /api/tenants:
    get: { tags: [Clientes], summary: Lista de CUITs con metadata del certificado, responses: { '200': { description: ok } } }
    post:
      tags: [Clientes]
      summary: Alta de cliente — genera clave y CSR (rol operador+)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { cuit: { type: string }, nombre: { type: string } } } } } }
      responses: { '200': { description: devuelve el CSR } }
  /api/tenants/{cuit}/csr:
    get:
      tags: [Clientes]
      summary: Descarga el CSR generado
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: PEM del CSR } }
  /api/tenants/{cuit}/certificate:
    post:
      tags: [Clientes]
      summary: Carga el .crt que devolvió ARCA (valida que case con la clave)
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { certPem: { type: string } } } } } }
      responses: { '200': { description: ok }, '422': { description: el cert no corresponde a la clave } }
  /api/tenants/{cuit}/importar:
    post:
      tags: [Clientes]
      summary: Importa un par clave+certificado existente
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { nombre: { type: string }, keyPem: { type: string }, certPem: { type: string } } } } } }
      responses: { '200': { description: ok } }
  /api/tenants/{cuit}/emisor:
    get:
      tags: [Clientes]
      summary: Datos fiscales del emisor para el PDF y cuáles faltan
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: "emisor { razonSocial, nombreFantasia, domicilio, condicionIva (RI|MONOTRIBUTO|EXENTO), iibb, inicioActividades, mipyme }, faltan [{ campo, etiqueta, desdeArca }]" } }
    put:
      tags: [Clientes]
      summary: Guarda los datos fiscales del emisor (rol operador+)
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { razonSocial: { type: string }, nombreFantasia: { type: string }, domicilio: { type: string }, condicionIva: { type: string, enum: [RI, MONOTRIBUTO, EXENTO] }, iibb: { type: string }, inicioActividades: { type: string, format: date }, mipyme: { type: boolean } } } } } }
      responses: { '200': { description: ok } }
  /api/tenants/{cuit}/emisor/completar:
    post:
      tags: [Clientes]
      summary: Completa desde el padrón de ARCA razón social, domicilio y condición frente al IVA que estén vacíos (no pisa lo cargado). Ingresos Brutos e inicio de actividades no los da ARCA.
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: "emisor, completados [campo], faltan [...], error (si el padrón no respondió)" } }
  /api/tenants/{cuit}:
    delete:
      tags: [Clientes]
      summary: Elimina un cliente (rol operador+)
      parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }

  /api/services:
    get: { tags: [Servicios], summary: Catálogo de servicios de ARCA, responses: { '200': { description: ok } } }
    post: { tags: [Servicios], summary: Agrega un servicio al catálogo (rol admin+), responses: { '200': { description: ok } } }
  /api/services/{id}:
    get:
      tags: [Servicios]
      summary: Detalle de un servicio
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }
    put:
      tags: [Servicios]
      summary: Edita un servicio (rol admin+)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }
    delete:
      tags: [Servicios]
      summary: Borra / restaura un servicio (rol admin+)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }
  /api/services/{id}/operaciones:
    get:
      tags: [Servicios]
      summary: Introspección del WSDL — lista operaciones y campos
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: ok } }
  /api/services/{id}/verificar:
    get:
      tags: [Servicios]
      summary: Verifica si el certificado del CUIT está asociado a este servicio
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cuit, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: "{ asociado: bool, motivo? }" } }
  /api/services/{id}/reset:
    post: { tags: [Servicios], summary: Restaura un builtin al default (admin+), parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: ok } } }
  /api/services/{id}/enabled:
    post: { tags: [Servicios], summary: Habilita/deshabilita un servicio (admin+), parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: ok } } }

  /api/ws/{servicio}/{operacion}:
    post:
      tags: [Servicios]
      summary: Passthrough genérico — invoca cualquier operación de cualquier servicio
      parameters:
        - { name: servicio, in: path, required: true, schema: { type: string } }
        - { name: operacion, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { cuit: { type: string }, params: { type: object } } } } } }
      responses: { '200': { description: respuesta de ARCA parseada } }

  /api/wsfev1/status:
    get: { tags: [WSFEv1], summary: Estado de WSFEv1 (FEDummy), responses: { '200': { description: ok } } }
  /api/wsfev1/parametros/{nombre}:
    get:
      tags: [WSFEv1]
      summary: Tablas de parámetros (catálogos)
      parameters:
        - { name: nombre, in: path, required: true, schema: { type: string, enum: [tiposComprobante, tiposDocumento, tiposConcepto, alicuotasIva, monedas, tiposTributo, puntosVenta] } }
        - { name: cuit, in: query, required: true, schema: { type: string } }
      responses: { '200': { description: ok } }
  /api/wsfev1/ultimo-autorizado:
    get:
      tags: [WSFEv1]
      summary: Último número autorizado
      parameters:
        - { name: cuit, in: query, required: true, schema: { type: string } }
        - { name: puntoVenta, in: query, required: true, schema: { type: integer } }
        - { name: tipoComprobante, in: query, required: true, schema: { type: integer } }
      responses: { '200': { description: ok } }
  /api/wsfev1/consultar:
    get:
      tags: [WSFEv1]
      summary: Consulta / reimprime un comprobante
      parameters:
        - { name: cuit, in: query, required: true, schema: { type: string } }
        - { name: puntoVenta, in: query, required: true, schema: { type: integer } }
        - { name: tipoComprobante, in: query, required: true, schema: { type: integer } }
        - { name: numero, in: query, required: true, schema: { type: integer } }
      responses: { '200': { description: ok } }
  /api/wsfev1/comprobantes/vista-previa:
    post:
      tags: [WSFEv1]
      summary: Vista previa de un comprobante (NO emite ni reserva número)
      description: >
        Mismo cuerpo que la emisión. Valida importes, IVA, tipo, receptor (con su padrón si es CUIT), condición de IVA,
        fecha y RG 5866, sugiere la letra y devuelve el número que le tocaría y el cuerpo listo para emitir.
        Permitido también a las claves de rol lectura.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Comprobante' } } } }
      responses: { '200': { description: "vistaPrevia: { valido, problemas, advertencias, numeroPropuesto, cuerpoParaEmitir, ... }" } }
  /api/wsfev1/comprobantes:
    # contingencia: true (o header X-Arcanum-Contingencia: 1) => si ARCA no responde, 202 { encolado, cola }
    post:
      tags: [WSFEv1]
      summary: Emitir comprobante y obtener CAE
      description: Requiere rol operador o superior (una clave de rol lectura recibe 403).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Comprobante' } } } }
      responses: { '200': { description: aprobado }, '403': { description: solo lectura o rol insuficiente }, '422': { description: rechazado } }
  /api/wsfev1/lote:
    post:
      tags: [WSFEv1]
      summary: Emisión por lote (JSON {comprobantes:[...]} o CSV)
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, properties: { comprobantes: { type: array, items: { $ref: '#/components/schemas/Comprobante' } } } } }
          text/csv: { schema: { type: string } }
      responses: { '200': { description: "{ total, aprobados, rechazados, resultados[] }" } }

  /api/wsfex/status:
