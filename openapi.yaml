    put: { tags: [Mis Comprobantes], summary: Reemplaza la receta (superadmin), requestBody: { content: { application/json: { schema: { type: object, required: [url, pasos], properties: { url: { type: string }, pasos: { type: array, items: { type: object } } } } } } }, responses: { '200': { description: ok }, '400': { description: receta invalida } } }
