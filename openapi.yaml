        - { name: cuit, in: query, required: true, schema: { type: string, description: CUIT representante (cert cargado) } }
        - { name: fresco, in: query, required: false, schema: { type: string, enum: ['1'] }, description: "1 = ignorar el cache de una hora y consultar a ARCA" }
