  /api/wsmtxca/status:
    get: { tags: [WSMTXCA], summary: Estado (dummy), responses: { '200': { description: ok } } }
  /api/wsmtxca/ultimo-autorizado:
    get:
      tags: [WSMTXCA]
      summary: Último Nro autorizado (por pto de venta y tipo)
      parameters:
        - { name: cuit, in: query, required: true, schema: { type: string } }
        - { name: puntoVenta, in: query, required: true, schema: { type: integer } }
