    post: { tags: [Contingencia], summary: Pide o recupera el CAEA de la quincena en curso y la proxima, parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: "quincenas: [{ periodo, orden, estado: obtenido|ya_estaba|todavia_no }]" } } }
  /api/caea/{cuit}/informar:
    post: { tags: [Contingencia], summary: "Informa a ARCA lo emitido con CAEA y los CAEA vencidos sin movimiento", parameters: [ { name: cuit, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: "informe: { informados, errores }, sinMovimiento" } } }

  /api/wsfev1/sincronizar:
    post:
      tags: [Contingencia]
      summary: Trae de ARCA los comprobantes emitidos por fuera de Arcanum (huecos incluidos) y avisa diferencias
      requestBody: { content: { application/json: { schema: { type: object, required: [cuit], properties: { cuit: { type: string }, dias: { type: integer, default: 90 } } } } } }
      responses: { '200': { description: "sincronizacion: { traidos, porPuntoVenta, diferencias, pendiente }" } }

  /api/wsaa/{cuit}/{service}:
    get:
      tags: [Servicios]
      summary: Inspecciona el Ticket de Acceso (diagnostico)
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string, example: wsfe } }
      responses: { '200': { description: ok } }
    delete:
      tags: [Servicios]
      summary: Invalida el Ticket de Acceso cacheado
      parameters:
        - { name: cuit, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: ok } }
