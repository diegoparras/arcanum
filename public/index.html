<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcanum — Gateway ARCA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2327408b'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M12 56 L12 26 A20 20 0 0 1 52 26 L52 56 L43 56 L43 26 A11 11 0 0 0 21 26 L21 56 Z'/%3E%3Crect x='21' y='41' width='22' height='6' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<script>(function(){try{var t=localStorage.arcanumTheme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<!-- Fuentes vendorizadas (sin CDN, por CSP y privacidad) -->
<style>
  @font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;
    src:url("./vendor/fonts/inter-var-latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;
    src:url("./vendor/fonts/inter-var-latin-ext.woff2") format("woff2");
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;font-display:swap;
    src:url("./vendor/fonts/jetbrains-mono-latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2074,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD;}
</style>
<!-- Sistema de diseño Escriba (canonico) — PRIMERO; lo propio de Arcanum va despues -->
<link rel="stylesheet" href="./escriba-ui.css">
<style>
  /* ===== Acento Arcanum (lo unico que cambia por app) ===== */
  :root{ --accent:#27408b; --accent-2:#1d3168; --on-accent:#fff; --ring:0 0 0 3px rgba(39,64,139,.20);
    --field-rest:#eef0f3; --field-bg:#e9f1fd; --field-border:#bcd3f2; }
  :root[data-theme="dark"]{ --accent:#6b8bd6; --accent-2:#27408b; --ring:0 0 0 3px rgba(107,139,214,.26);
    --field-rest:rgba(255,255,255,.05); --field-bg:rgba(107,139,214,.15); --field-border:rgba(107,139,214,.34); }
  /* Campos en gris muy claro por defecto; al enfocar pasan a celeste con borde azul. */
  input,textarea,select{ background-color:var(--field-rest); }
  input:focus,textarea:focus,select:focus{ background-color:var(--field-bg); border-color:var(--field-border); }
  /* Lista de checkboxes (reemplaza al multi-select nativo). */
  .chklist{ background-color:var(--field-rest); border:1px solid var(--line); border-radius:10px; padding:6px; max-height:150px; overflow:auto; display:flex; flex-direction:column; gap:2px; }
  .chk{ display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:14px; }
  .chk:hover{ background:rgba(39,64,139,.07); }
  .chk input{ width:16px; height:16px; margin:0; padding:0; accent-color:var(--accent); background:none; border:none; cursor:pointer; }
  /* Alias heredados del CSS propio de Arcanum, mapeados a tokens canonicos */
  :root{ --ink:var(--text); --line:var(--border); --chip:var(--card); --radius:14px;
    --header-bg:var(--panel); --accent-ink:var(--accent); --accent-contrast:var(--on-accent);
    --bad:var(--err); --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif; }
  /* El h2 de Arcanum es un encabezado de seccion (mayusculas); el del login-card es el titulo. */
  .login-card h2{ text-transform:none; letter-spacing:-.01em; color:var(--text); }

  html,body{transition:background-color .2s ease,color .2s ease}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  a{color:var(--accent-ink)}
  header{position:sticky;top:0;background:var(--header-bg);border-bottom:1px solid var(--line);z-index:10}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  .bar{display:flex;align-items:center;gap:16px;padding:13px 0}
  .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--mono)}
  .bar h1{font-size:16px;margin:0;font-weight:650}
  nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
  nav button{background:none;border:none;color:var(--muted);padding:7px 11px;border-radius:8px;cursor:pointer;font-size:14px}
  nav button.active{background:var(--chip);color:var(--ink);font-weight:560}
  nav button:hover{background:var(--accent-2);color:var(--on-accent)}
  nav button.active:hover{background:var(--accent-2);color:var(--on-accent)}
  .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .env{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--accent-ink)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
  button.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent)}
  button{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:9px;cursor:pointer}
  button:hover{box-shadow:var(--shadow);background:var(--chip);border-color:var(--line);color:var(--ink)}
  button.ghost{border:none;color:var(--accent-ink);padding:6px 9px;display:inline-flex;align-items:center;gap:5px}
  button.ghost svg,nav button svg{width:16px;height:16px}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;transition:color .15s,box-shadow .15s}
  .iconbtn:hover{color:var(--ink);box-shadow:var(--shadow)}
  .iconbtn svg{display:block;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .menu{position:absolute;right:0;top:42px;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:30}
  .menu.open{display:block}
  .menu-sec{padding:6px 0;border-bottom:1px solid var(--line)} .menu-sec:last-child{border-bottom:none}
  .menu-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:4px 12px}
  .menu-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 12px;font-size:14px}
  .menu-row select{width:auto;padding:5px 8px}
  .menu-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;padding:8px 12px;border-radius:8px;color:var(--ink);font-size:14px;cursor:pointer;text-align:left}
  .menu-item:hover{background:var(--chip)} .menu-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .pwwrap{position:relative} .pwwrap input{padding-right:38px}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;color:var(--muted);cursor:pointer;background:none;border:none}
  .eye:hover{color:var(--ink)} .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  main{padding:24px 0 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .stat .val{font-size:26px;font-weight:680;margin-top:6px;font-family:var(--mono)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.idle{background:#cabfa9}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:30px 0 12px}
  h3{font-size:15px;margin:16px 0 10px;text-transform:capitalize}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:560;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td.mono,.mono{font-family:var(--mono)}
  input,select,textarea{font-family:var(--sans);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background-color:var(--field-rest);width:100%}
  textarea{font-family:var(--mono);font-size:12px;min-height:120px}
  label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--accent-ink)}
  .tag.rich,.tag.ok{background:var(--chip);color:var(--ok)} .tag.no{background:var(--chip);color:var(--bad)} .tag.warn{background:var(--chip);color:var(--warn)}
  .svc{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;background:var(--panel)}
  .svc .top{display:flex;align-items:center;gap:10px}
  .pasos{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:none}
  .pasos.open{display:block}.pasos ol{margin:0;padding-left:20px}.pasos li{margin:5px 0}
  .rel{font-family:var(--mono);background:var(--chip);padding:2px 6px;border-radius:6px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:8px}
  .bars .b{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
  .muted{color:var(--muted)} .hint{color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0c0e13;color:#f3f5f9;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;box-shadow:var(--shadow)}
  .toast.show{opacity:1}.toast.bad{background:var(--bad)}
  .hidden{display:none}
  pre{background:#1c1a17;color:#f0ebe1;padding:12px;border-radius:10px;overflow:auto;font-family:var(--mono);font-size:11.5px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:20;padding:20px}
  .modal.open{display:grid}.modal .card{position:relative;max-width:620px;width:100%;max-height:85vh;overflow:auto}
  /* Responsive: el menú nunca se sale de pantalla; en angosto la nav pasa a una
     tira scrolleable abajo (topbar = logo + kebab), sin desbordar. */
  .menu{max-width:calc(100vw - 24px)}
  @media(max-width:760px){
    .wrap{padding:0 14px}
    .bar{flex-wrap:wrap;gap:10px 12px}
    nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;gap:2px;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav button{white-space:nowrap;flex:0 0 auto}
  }
</style>
</head>
<body>

<div id="loginView" class="login-overlay hidden">
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M12 56 L12 26 A20 20 0 0 1 52 26 L52 56 L43 56 L43 26 A11 11 0 0 0 21 26 L21 56 Z"/><rect x="21" y="41" width="22" height="6" rx="1" fill="#fff"/></svg></div>
    <h2>Arcanum</h2>
    <p class="login-sub">Gateway ARCA — Escriba Suite</p>
    <input id="lu" autocomplete="username" placeholder="Usuario">
    <div class="pwwrap"><input id="lp" type="password" autocomplete="current-password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()"><button class="eye" type="button" tabindex="-1" aria-label="Mostrar u ocultar contraseña" onclick="togglePw('lp',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="primary" style="width:100%" onclick="doLogin()">Entrar</button>
    <div id="oidcBtn"></div>
  </div>
</div>

<div id="appView" class="hidden">
<header><div class="wrap bar">
  <div class="logo"><svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M12 56 L12 26 A20 20 0 0 1 52 26 L52 56 L43 56 L43 26 A11 11 0 0 0 21 26 L21 56 Z"/><rect x="21" y="41" width="22" height="6" rx="1" fill="#fff"/></svg></div><h1>Arcanum</h1>
  <nav id="nav"></nav>
  <div class="right" style="position:relative">
    <button class="iconbtn" id="menuBtn" onclick="toggleMenu()" aria-label="Menú"><svg viewBox="0 0 20 20" aria-hidden="true" style="fill:currentColor;stroke:none"><circle cx="10" cy="4" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="10" cy="16" r="1.7"/></svg></button>
    <div class="menu" id="appmenu"></div>
  </div>
</div></header>
<main class="wrap"><div id="view"></div></main>
</div>

<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=(s,e=document)=>e.querySelector(s);
let ME=null, ENV='—';
async function api(path,opts={}){
  const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});
  const ct=r.headers.get('content-type')||'';
  const j=ct.includes('json')?await r.json().catch(()=>({})):{};
  if(r.status===401){showLogin();throw new Error('401');}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');setTimeout(()=>t.className='toast',2600);}
function modal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('open');}
function closeModal(){$('#modal').classList.remove('open');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

function showLogin(){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');
  fetch('/api/auth/config').then(r=>r.json()).then(c=>{
    $('#oidcBtn').innerHTML=c.oidc?'<a class="login-sso" href="/api/auth/oidc/login">Entrar con Lockatus</a>':'';
    // Federado (ssoOnly): se entra SOLO por Lockatus → ocultamos el login local.
    const card=$('#loginView .login-card'), sso=!!c.ssoOnly;
    $('#lu').classList.toggle('hidden',sso);
    $('#lp').closest('.pwwrap').classList.toggle('hidden',sso);
    card.querySelector('button.primary').classList.toggle('hidden',sso);
    card.querySelector('.login-sub').textContent=sso?'Acceso unificado de la Suite Escriba':'Gateway ARCA — Escriba Suite';
  }).catch(()=>{});}
async function doLogin(){
  try{ await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});
    await boot(); }catch(e){ toast('Usuario o contraseña inválidos',true); }
}
async function logout(){ await fetch('/api/auth/logout',{method:'POST',credentials:'include'}); showLogin(); }

const VIEWS=[['panel','Panel'],['clientes','Clientes'],['servicios','Servicios'],['emitir','Emitir'],['facturador','Facturador'],['comprobantes','Comprobantes'],['mis','Mis Comprobantes'],['generador','Generador'],['webhooks','Webhooks'],['usuarios','Usuarios']];
function renderNav(cur){
  $('#nav').innerHTML=VIEWS.filter(v=>v[0]!=='usuarios'||['superadmin','admin'].includes(ME.role))
    .map(v=>`<button class="${v[0]===cur?'active':''}" onclick="go('${v[0]}')">${v[1]}</button>`).join('');
}
function go(v){if(typeof mcPararTimers==='function')mcPararTimers();renderNav(v);location.hash=v;const el=$('#view');if(el)el.innerHTML='<p class="hint">Cargando…</p>';({panel:vPanel,clientes:vClientes,servicios:vServicios,emitir:vEmitir,facturador:vFacturador,comprobantes:vComprobantes,mis:vMis,generador:vGenerador,webhooks:vWebhooks,usuarios:vUsuarios}[v]||vPanel)();}

async function boot(){
  try{ const me=await api('/api/auth/me'); ME=me.usuario; }catch(e){ showLogin(); return; }
  try{ const h=await fetch('/api/health').then(r=>r.json()); ENV=h.env; }catch{}
  $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');
  go((location.hash||'#panel').slice(1));
}

/* ---------- PANEL ---------- */
async function vPanel(){
  const v=$('#view');v.innerHTML='<p class="hint">Cargando métricas…</p>';
  const {metricas:m}=await api('/api/metrics');
  const max=Math.max(1,...m.emisiones.serie.map(s=>s.n));
  const bars=m.emisiones.serie.map(s=>`<div class="b" title="${s.dia}: ${s.n}" style="height:${Math.round(s.n/max*100)}%"></div>`).join('')||'<span class="hint">sin emisiones aún</span>';
  const arca=m.arca.map(a=>`<tr><td>${a.servicio}</td><td><span class="dot ${a.ok?'ok':'bad'}"></span>${a.ok?'OK':'caído'}</td><td class="mono">${a.uptime24h??'—'}%</td><td class="mono">${a.latencia??'—'} ms</td></tr>`).join('')||'<tr><td colspan="4" class="hint">El monitor corre cada 5 min; esperá el primer chequeo.</td></tr>';
  v.innerHTML=`
   <div class="grid">
     <div class="card stat"><div class="label">Emisiones hoy</div><div class="val">${m.emisiones.hoy}</div></div>
     <div class="card stat"><div class="label">Monto hoy</div><div class="val" style="font-size:20px">$${m.emisiones.montoHoy.toLocaleString('es-AR')}</div></div>
     <div class="card stat"><div class="label">Tokens vigentes</div><div class="val">${m.tokensVigentes}</div></div>
     <div class="card stat"><div class="label">Certs por vencer</div><div class="val">${m.certificados.porVencer}</div></div>
     <div class="card stat"><div class="label">Peticiones 24h</div><div class="val">${m.peticiones24h.total}</div><div class="hint">${m.peticiones24h.errores} errores · ${m.peticiones24h.latenciaMedia}ms</div></div>
   </div>
   <h2>Emisiones (14 días)</h2><div class="card"><div class="bars">${bars}</div></div>
   <h2>Estado de ARCA</h2><div class="card"><table><thead><tr><th>Servicio</th><th>Estado</th><th>Uptime 24h</th><th>Latencia</th></tr></thead><tbody>${arca}</tbody></table></div>`;
}

/* ---------- CLIENTES ---------- */
async function vClientes(){
  const v=$('#view');
  const {tenants}=await api('/api/tenants');
  const rows=tenants.map(t=>{
    const cert=t.tieneCertificado?`<span class="tag ok">vigente${t.diasParaVencer!=null?' ('+t.diasParaVencer+'d)':''}</span>`:(t.tieneClave?'<span class="tag warn">falta certificado</span>':'<span class="tag no">sin clave</span>');
    return `<tr><td class="mono">${t.cuit}</td><td>${t.nombre||''}</td><td>${cert}</td>
      <td class="row">
       ${t.tieneClave?`<button class="ghost" onclick="verCsr('${t.cuit}')">CSR</button>`:''}
       <button class="ghost" onclick="pegarCert('${t.cuit}')">Pegar .crt</button>
       <button class="ghost" onclick="editarEmisor('${t.cuit}')">Datos fiscales</button>
      </td></tr>`;}).join('')||'<tr><td colspan="4" class="hint">No hay clientes. Creá el primero.</td></tr>';
  v.innerHTML=`<div class="row"><h2 style="margin:0">Clientes (${ENV})</h2>
    <button style="margin-left:auto" onclick="importarCert()">Importar certificado</button>
    <button class="primary" onclick="nuevoCliente()">Nuevo cliente</button></div>
    <div class="card" style="margin-top:12px"><table><thead><tr><th>CUIT</th><th>Nombre</th><th>Certificado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin-top:10px">Flujo: <strong>Nuevo cliente</strong> genera el CSR → lo subís a ARCA → descargás el .crt → <strong>Pegar .crt</strong>.</p>`;
}
function nuevoCliente(){modal(`<h3>Nuevo cliente</h3><label>CUIT</label><input id="ncuit" class="mono" placeholder="20111111112">
  <label>Nombre / Razón social</label><input id="nnombre">
  <div class="row" style="margin-top:16px"><button class="primary" onclick="crearCliente()">Generar CSR</button><button onclick="closeModal()">Cancelar</button></div>`);}
async function crearCliente(){
  try{ const r=await api('/api/tenants',{method:'POST',body:JSON.stringify({cuit:$('#ncuit').value,nombre:$('#nnombre').value})});
    modal(`<h3>CSR generado para ${r.cuit}</h3><p class="hint">Subí este CSR a ARCA (WSASS en homologación, o el portal de Certificados en producción), descargá el certificado y luego usá "Pegar .crt".</p>
      <pre>${r.csr.replace(/</g,'&lt;')}</pre>

const ALIC={5:21,4:10.5,6:5,3:27,9:0};
function recalc(){const neto=parseFloat($('#e_neto').value||0);const p=ALIC[$('#e_alic').value]||0;const iva=+(neto*p/100).toFixed(2);
  $('#e_iva').value=iva.toFixed(2);$('#e_total').value=(neto+iva).toFixed(2);}
function cuerpoEmision(){
  const neto=parseFloat($('#e_neto').value||0),iva=parseFloat($('#e_iva').value||0),tipo=+$('#e_tipo').value,alic=+$('#e_alic').value;
  const tipoC=[11,13].includes(tipo);
  const body={cuit:$('#e_cuit').value,puntoVenta:+$('#e_pv').value,tipoComprobante:tipo,concepto:+$('#e_concepto').value,
    tipoDocReceptor:+$('#e_doctipo').value,nroDocReceptor:$('#e_docnro').value,condicionIvaReceptor:+$('#e_condiva').value,
    importeNeto:tipoC?0:neto,importeIva:tipoC?0:iva,importeTotal:tipoC?neto+iva:neto+iva,
    alicuotasIva:tipoC?[]:[{id:alic,baseImponible:neto,importe:iva}],
    pdf:{modelo:$('#e_pdfmodelo').value,nombreArchivo:$('#e_pdfnombre').value.trim()||undefined}};
  if(tipoC){body.importeNeto=+(neto+iva).toFixed(2);body.importeIva=0;body.importeTotal=+(neto+iva).toFixed(2);}
  // Clave de idempotencia por formulario: un doble clic o un reintento no saca dos CAE.
  if(!window._idemEmitir)window._idemEmitir='ui-'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  body.idempotencyKey=window._idemEmitir;
  return body;
}
function nombrePdfAyuda(){const v=$('#e_pdfnombre').value.trim();
  $('#e_pdfayuda').textContent=v?'Ejemplo: '+v.replace(/\{receptor\}/g,'CLIENTE SA').replace(/\{numero\}/g,'00000195').replace(/\{pv\}/g,'00001').replace(/\{letra\}/g,'C').replace(/\{tipo\}/g,'011').replace(/\{fecha\}/g,'2026-11-20').replace(/\{cuit\}/g,$('#e_cuit').value||'20111111112').replace(/\{total\}/g,'1000.00')+(/\.pdf$/i.test(v)?'':'.pdf'):'Vacío = el nombre de ARCA. Podés usar {receptor}, {numero}, {pv}, {letra}, {tipo}, {fecha}, {cuit} y {total}.';}

  try{const {vistaPrevia:p}=await api('/api/wsfev1/comprobantes/vista-previa',{method:'POST',body:JSON.stringify(cuerpoEmision())});
    const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join('');
    const rec=p.receptor&&p.receptor.padron?`<tr><th>Receptor</th><td>${esc(p.receptor.padron.nombre||'')} <span class="hint">${esc(p.receptor.padron.condicionIVA||'')}</span></td></tr>`:'';

      <table style="margin-top:10px">${p.comprobante?`<tr><th>Comprobante</th><td class="mono">${esc(p.comprobante)}</td></tr>`:''}
      <tr><th>Fecha</th><td class="mono">${esc(p.fecha||'')}</td></tr><tr><th>Total</th><td class="mono">$${Number(p.importes?p.importes.total:0).toFixed(2)}</td></tr>${rec}
      ${p.letraSugerida?`<tr><th>Letra sugerida</th><td>${esc(p.letraSugerida)}</td></tr>`:''}</table>
      ${p.problemas.length?`<h4>Problemas</h4><ul>${li(p.problemas)}</ul>`:''}

async function mcCredencial(admin){

    const estado=c.rechazada?`<span class="tag no">ARCA RECHAZÓ LA CLAVE</span> <span class="hint">${esc(c.rechazoMotivo||'')}. No se reintenta para no bloquear la cuenta: cargá la clave de nuevo.</span>`:c.cargada?`<span class="tag ok">CLAVE CARGADA</span> <span class="hint">${c.actualizada?'el '+new Date(c.actualizada).toLocaleString('es-AR'):''}${c.actualizadaPor?' por '+esc(c.actualizadaPor):''}</span>`:'<span class="tag warn">SIN CLAVE</span>';
    $('#mc_cred').innerHTML=`${estado}
      ${admin?`<div class="f2"><div><label>CUIT con el que se entra a ARCA</label><input id="mc_login" class="mono" value="${esc(c.cuitLogin||MC.cuit)}"></div>
      <div><label>Clave fiscal ${c.cargada?'(dejala vacía para no cambiarla)':''}</label>
      <div class="pwwrap"><input id="mc_clave" type="password" autocomplete="new-password" placeholder="${c.cargada?'Sin cambios':'Clave fiscal'}"><button class="eye" type="button" tabindex="-1" aria-label="Mostrar u ocultar la clave" onclick="togglePw('mc_clave',this)">${I_EYE}</button></div></div></div>
      <label class="chk" style="margin-top:10px"><input type="checkbox" id="mc_sync" ${c.sincronizar?'checked':''}> Sincronizar todos los días (mes anterior y mes en curso)</label>

  }catch(e){$('#mc_cred').innerHTML=`<span class="tag no">ERROR</span> ${esc(e.message)}`;}
}
async function mcGuardarClave(){
  const body={cuitLogin:$('#mc_login').value.replace(/\D/g,''),sincronizar:$('#mc_sync').checked};
  const clave=$('#mc_clave').value; if(clave)body.clave=clave;
  try{await api(`/api/mis-comprobantes/${MC.cuit}/credencial`,{method:'PUT',body:JSON.stringify(body)});$('#mc_clave').value='';toast('Credencial guardada');mcCredencial(true);}
  catch(e){toast(e.message,true);}
}
async function mcBorrarClave(){
  if(!confirm('¿Borrar la clave fiscal de este CUIT? La sincronización diaria deja de andar.'))return;
  try{await api(`/api/mis-comprobantes/${MC.cuit}/credencial`,{method:'DELETE'});toast('Clave borrada');mcCredencial(true);}catch(e){toast(e.message,true);}
}
async function mcSincronizar(){
  try{const {corrida}=await api(`/api/mis-comprobantes/${MC.cuit}/sincronizar`,{method:'POST',body:JSON.stringify({tipo:$('#mc_tipo').value,desde:$('#mc_desde').value,hasta:$('#mc_hasta').value})});
    toast('Sincronización iniciada');mcSeguir(corrida.id);mcCorridas(false);}
  catch(e){toast(e.message,true);}
}
async function mcCorridas(retomar){
  try{const {corridas}=await api(`/api/mis-comprobantes/${MC.cuit}/corridas`);
    $('#mc_corridas').innerHTML=corridas.length?`<table><tr><th>#</th><th>Qué</th><th>Rango</th><th>Estado</th><th>Cantidad</th><th>Inicio</th><th>Detalle</th></tr>${corridas.map(c=>`<tr>
      <td class="mono">${c.id}</td><td>${esc(c.tipo)}</td><td class="mono">${String(c.desde).slice(0,10)} a ${String(c.hasta).slice(0,10)}</td>
      <td><span class="tag ${c.estado==='terminado'?'ok':c.estado==='error'?'no':'warn'}">${esc(MC_ESTADO[c.estado]||c.estado)}</span></td>
      <td class="mono">${c.cantidad}</td><td class="hint">${new Date(c.iniciada_at).toLocaleString('es-AR')}</td>
      <td class="hint">${esc(c.error||'')}${MC_VIVOS.includes(c.estado)?` <button class="ghost" onclick="mcSeguir(${c.id})">Ver en vivo</button>`:''}</td></tr>`).join('')}</table>`:'<p class="hint">Todavía no se sincronizó este CUIT.</p>';
    const viva=corridas.find(c=>MC_VIVOS.includes(c.estado));
    if(retomar&&viva)mcSeguir(viva.id);
  }catch(e){$('#mc_corridas').innerHTML=`<p class="hint">${esc(e.message)}</p>`;}
}
function mcSeguir(id){
  mcPararTimers();MC.corrida=id;MC.seq=0;$('#mc_vivo').classList.remove('hidden');
  const paso=async()=>{
    if(!$('#mc_vivo')){mcPararTimers();return;}
    try{const {corrida:c}=await api(`/api/mis-comprobantes/corridas/${id}`);
      const t=$('#mc_vivo_estado');t.textContent=MC_ESTADO[c.estado]||c.estado;t.className='tag '+(c.estado==='terminado'?'ok':c.estado==='error'?'no':'warn');
      const humano=c.estado==='humano'||c.estado==='esperando_humano';
      $('#mc_tomar').classList.toggle('hidden',humano||!MC_VIVOS.includes(c.estado));
      $('#mc_devolver').classList.toggle('hidden',!humano);
      $('#mc_vivo_motivo').textContent=c.estado==='esperando_humano'?'ARCA pide a una persona (captcha o segundo factor). Resolvelo en la pantalla y después tocá "Devolver a la receta".':c.estado==='error'?(c.error||''):c.estado==='terminado'?`Listo: ${c.cantidad} comprobantes.`:'';
      if(!MC_VIVOS.includes(c.estado)){mcPararTimers();mcCorridas(false);mcCargarTabla();mcMonotributo();}
    }catch{}
  };
  const foto=async()=>{
    if(!$('#mc_img'))return;
    try{const r=await fetch(`/api/mis-comprobantes/corridas/${id}/frame?desde=${MC.seq}`,{credentials:'include'});
      if(r.status===200){const b=await r.blob();MC.seq=+(r.headers.get('x-agent-seq')||MC.seq);if(MC.url)URL.revokeObjectURL(MC.url);MC.url=URL.createObjectURL(b);$('#mc_img').src=MC.url;}
    }catch{}
  };
  paso();foto();MC.timer=setInterval(paso,2000);MC.frameTimer=setInterval(foto,500);
  const pan=$('#mc_pantalla');
  pan.onclick=e=>{const r=$('#mc_img').getBoundingClientRect();mcEvento({tipo:'click',x:Math.round((e.clientX-r.left)*1280/r.width),y:Math.round((e.clientY-r.top)*800/r.height)});pan.focus();};
  pan.onwheel=e=>{e.preventDefault();mcEvento({tipo:'scroll',dy:Math.round(e.deltaY)});};
  pan.onkeydown=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;e.preventDefault();
    if(e.key.length===1)mcEvento({tipo:'texto',texto:e.key});else if(['Enter','Tab','Backspace','Delete','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(e.key))mcEvento({tipo:'tecla',tecla:e.key});};
}
async function mcEvento(cmd){
  if(!MC.corrida||$('#mc_devolver').classList.contains('hidden'))return;
  try{await api(`/api/mis-comprobantes/corridas/${MC.corrida}/evento`,{method:'POST',body:JSON.stringify(cmd)});}catch{}
}
async function mcControl(accion){
  try{await api(`/api/mis-comprobantes/corridas/${MC.corrida}/${accion}`,{method:'POST'});toast(accion==='devolver'?'Control devuelto':'Tenés el control');}catch(e){toast(e.message,true);}
}
function mcFiltros(){const q=new URLSearchParams();const t=$('#mc_ftipo').value,d=$('#mc_fdesde').value,h=$('#mc_fhasta').value;if(t)q.set('tipo',t);if(d)q.set('desde',d);if(h)q.set('hasta',h);return q.toString();}
const NOMBRE_TIPO={1:'Factura A',2:'ND A',3:'NC A',6:'Factura B',7:'ND B',8:'NC B',11:'Factura C',12:'ND C',13:'NC C',51:'Factura M',201:'FCE A',206:'FCE B',211:'FCE C'};
async function mcCargarTabla(){
  try{const {comprobantes:l}=await api(`/api/mis-comprobantes/${MC.cuit}?${mcFiltros()}`);
    const pesos=n=>Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const cons=c=>!c?'<span class="hint">sin constatar</span>':c.apoc&&c.apoc.esApocrifo?'<span class="tag no">APÓCRIFO</span>':c.valido?'<span class="tag ok">OK</span>':'<span class="tag no">NO CONSTA</span>';
    $('#mc_tabla').innerHTML=l.length?`<table><tr><th>Fecha</th><th>Tipo</th><th>Comprobante</th><th>Contraparte</th><th>Total</th><th>CAE</th><th>Constatación</th></tr>${l.map(f=>`<tr>
      <td class="mono">${String(f.fecha).slice(0,10)}</td><td>${f.tipo==='recibido'?'Recibido':'Emitido'} · ${esc(NOMBRE_TIPO[f.cbte_tipo]||f.cbte_tipo)}</td>
      <td class="mono">${String(f.punto_venta).padStart(4,'0')}-${String(f.numero_desde).padStart(8,'0')}</td>
      <td>${esc(f.contraparte||'')} <span class="hint mono">${esc(f.doc_nro||'')}</span></td><td class="mono">$${pesos(f.total)}</td>
      <td class="mono hint">${esc(f.cae||'')}</td><td>${f.tipo==='recibido'?cons(f.constatacion):''}</td></tr>`).join('')}</table>`:'<p class="hint">No hay comprobantes bajados con estos filtros.</p>';
  }catch(e){$('#mc_tabla').innerHTML=`<p class="hint">${esc(e.message)}</p>`;}
}
async function mcExportar(){
  try{const r=await fetch(`/api/mis-comprobantes/${MC.cuit}/export.csv?${mcFiltros()}`,{credentials:'include'});
    if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.blob();const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=`mis-comprobantes-${MC.cuit}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
  catch(e){toast(e.message,true);}
}
async function mcConstatar(){
  $('#mc_const').innerHTML='<p class="hint">Constatando con ARCA (WSCDC y apócrifos)…</p>';
  try{const {constatacion:c}=await api(`/api/mis-comprobantes/${MC.cuit}/constatar`,{method:'POST',body:'{}'});
    $('#mc_const').innerHTML=`<p><span class="tag ok">${c.validos} OK</span> <span class="tag no">${c.invalidos} no constan</span> <span class="tag warn">${c.conError||0} con error</span>
      ${c.emisoresApocrifos?`<span class="tag no">${c.emisoresApocrifos} emisores apócrifos</span>`:''} <span class="hint">${c.pendientes||0} pendientes</span></p>`;
    mcCargarTabla();}
  catch(e){$('#mc_const').innerHTML=`<p class="hint">${esc(e.message)}</p>`;}
}
async function mcMonotributo(){
  try{const {monotributo:m}=await api(`/api/monotributo/${MC.cuit}`);
    if(!m.aplica){$('#mc_mono').innerHTML=`<p class="hint">${esc(m.motivo||'No aplica')}</p>`;return;}
    const pesos=n=>'$'+Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:0});
    const pct=m.usado!=null?Math.min(m.usado*100,100):0;
    const color=m.alerta==='100'?'var(--bad)':m.alerta==='80'?'var(--warn)':'var(--ok)';
    $('#mc_mono').innerHTML=`<div class="row"><span class="stat"><span class="label">Facturado 12 meses</span><div class="val">${pesos(m.ingresos.total)}</div></span>
      <span class="stat"><span class="label">Categoría</span><div class="val">${esc(m.categoria||'—')}</div></span>
      <span class="stat"><span class="label">Tope</span><div class="val">${m.tope?pesos(m.tope):'—'}</div></span>
      <span class="stat"><span class="label">Sugerida</span><div class="val">${esc(m.categoriaSugerida||'RG')}</div></span></div>
      ${m.tope?`<div style="height:10px;border-radius:6px;background:var(--chip);margin-top:12px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${color}"></div></div>
      <p class="hint">${(m.usado*100).toFixed(1)}% del tope · ventana ${esc(m.ingresos.desde)} a ${esc(m.ingresos.hasta)}</p>`:`<p class="hint">${esc(m.advertenciaPadron||'No se pudo leer la categoría del padrón.')}</p>`}
      <p class="hint">Topes cargados: vigencia ${esc(m.vigenciaTopes||'?')}. Verificá los topes vigentes en arca.gob.ar.${m.excedeMaxima?' Supera la categoría máxima: corresponde evaluar el Régimen General.':''}</p>`;
  }catch(e){$('#mc_mono').innerHTML=`<p class="hint">${esc(e.message)}</p>`;}
}

   <div class="card" style="margin-top:14px;max-width:560px"><h3 style="margin-top:0">Nuevo webhook</h3>
   <label>URL (n8n, etc.)</label><input id="w_url" class="mono" placeholder="https://...">
   <label>Eventos</label><div class="chklist" id="w_ev">${eventos.map(e=>`<label class="chk"><input type="checkbox" value="${e}"> ${e}</label>`).join('')}</div>

async function addWebhook(){const ev=[...document.querySelectorAll('#w_ev input:checked')].map(o=>o.value);
  if(!ev.length){toast('Elegí al menos un evento',true);return;}
  try{await api('/api/webhooks',{method:'POST',body:JSON.stringify({url:$('#w_url').value,eventos:ev,secret:$('#w_secret').value||null})});toast('Webhook creado');vWebhooks();}catch(e){toast(e.message,true);}}
async function probarWebhook(id){

async function verLote(id){
  const v=$('#view');const {lote}=await api('/api/lotes/'+id);const r=lote.resumen;
  const rows=lote.items.map(it=>{const a=it.aging||{};const pend=!['emitido','recibido','rechazado'].includes(it.estado);
    return `<tr><td>${it.nombre||''}</td><td class="mono">${it.cuit||it.doc_nro||''}</td>

async function cargarClaves(){
  const box=$('#clavesBox');if(!box)return;
  try{
    const {claves}=await api('/api/claves');
    const f=d=>d?new Date(d).toLocaleString('es-AR'):'nunca';
    const fd=d=>d?new Date(d).toLocaleDateString('es-AR'):'';
    const est=c=>c.estado==='activa'?(c.vence&&new Date(c.vence)-Date.now()<7*864e5?`<span class="tag warn">vence ${fd(c.vence)}</span>`:`<span class="tag ok">activa</span>`)
      :c.estado==='vencida'?`<span class="tag no">vencida</span>`:`<span class="tag no">de baja</span>`;
    const rows=claves.map(c=>{const n=esc(c.nombre).replace(/'/g,'');const act=c.estado==='activa';
      return `<tr${act?'':' style="opacity:.55"'}><td>${esc(c.nombre)}${c.rotadaDe?' <span class="hint">(rotada)</span>':''}</td><td><code>${esc(c.prefijo||'')}</code></td><td><span class="tag">${esc(c.rol)}</span></td>
      <td class="hint">${c.cuits&&c.cuits.length?c.cuits.map(esc).join(', '):'todos'}</td>
      <td>${est(c)}${act&&c.vence&&new Date(c.vence)-Date.now()>=7*864e5?`<div class="hint">vence ${fd(c.vence)}</div>`:''}</td>
      <td class="hint">${f(c.ultimoUso)}<div>${c.usos30d||0} pedidos en 30 días${c.limitePorMinuto?` · tope ${c.limitePorMinuto}/min`:''}</div></td>
      <td style="white-space:nowrap"><button class="ghost" onclick="usoClave(${Number(c.id)})">Uso</button>
      ${act?`<button class="ghost" onclick="rotarClave(${Number(c.id)},'${n}')">Rotar</button> <button class="ghost" onclick="bajaClave(${Number(c.id)},'${n}')">Dar de baja</button>`:''}</td></tr>`;}).join('');
    box.innerHTML=`<div class="card">${claves.length?`<table><thead><tr><th>Nombre</th><th>Prefijo</th><th>Rol</th><th>CUITs</th><th>Estado</th><th>Uso</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="hint" style="margin:0">Todavía no hay claves.</p>'}</div>
     <div class="card" style="margin-top:14px;max-width:520px"><h3 style="margin-top:0">Nueva clave</h3>
      <label>Nombre</label><input id="k_nom" placeholder="SecretarIA">
      <label>Rol</label><select id="k_rol"><option value="lectura">lectura (solo consulta)</option><option value="operador">operador (puede emitir)</option>${ME.role==='superadmin'?'<option value="admin">admin</option>':''}</select>

      <div class="f2"><div><label>Vence en (días, opcional)</label><input id="k_vence" class="mono" inputmode="numeric" placeholder="Sin vencimiento"></div>
      <div><label>Límite por minuto (opcional)</label><input id="k_lim" class="mono" inputmode="numeric" placeholder="Por defecto 120"></div></div>
      <button class="primary" style="margin-top:14px" onclick="crearClave()">Crear clave</button></div>`;
  }catch(e){box.innerHTML=`<p class="hint">${esc(e.message)}</p>`;}
}
function mostrarClaveNueva(clave,extra){
  window._claveNueva=clave.clave;
  modal(`<h3 style="margin-top:0">${extra?'Clave rotada':'Clave creada'}</h3>
    <p class="hint">Clave <b>${esc(clave.nombre)}</b> (${esc(clave.rol)}). Copiala ahora: no se vuelve a mostrar. Arcanum solo guarda su huella (hash).${extra||''}</p>
    <pre style="white-space:pre-wrap;word-break:break-all;overflow:hidden">${esc(clave.clave)}</pre>
    <div class="row"><button onclick="navigator.clipboard.writeText(window._claveNueva);toast('Clave copiada')">Copiar</button>
    <button class="primary" onclick="window._claveNueva=null;closeModal();cargarClaves()">Listo, ya la guardé</button></div>`);
}
async function crearClave(){
  const cuits=$('#k_cuits').value.split(',').map(s=>s.replace(/\D/g,'')).filter(Boolean);
  const body={nombre:$('#k_nom').value.trim(),rol:$('#k_rol').value,cuits};
  if($('#k_vence').value.trim())body.venceDias=$('#k_vence').value.trim();
  if($('#k_lim').value.trim())body.limitePorMinuto=$('#k_lim').value.trim();
  try{const {clave}=await api('/api/claves',{method:'POST',body:JSON.stringify(body)});mostrarClaveNueva(clave);}catch(e){toast(e.message,true);}
}
async function rotarClave(id,nombre){
  const g=prompt(`Rotar la clave "${nombre}": se crea una nueva con los mismos permisos. ¿Cuántos días sigue funcionando la anterior? (0 a 90)`,'7');
  if(g===null)return;
  try{const {clave}=await api(`/api/claves/${id}/rotar`,{method:'POST',body:JSON.stringify({graciaDias:g})});
    mostrarClaveNueva(clave,` La anterior deja de funcionar el ${new Date(clave.anterior.vence).toLocaleString('es-AR')}: reemplazala antes en la integración.`);}catch(e){toast(e.message,true);}
}
async function usoClave(id){
  try{const {uso:u}=await api(`/api/claves/${id}/uso?dias=30`);
    // Eje de 30 dias completo (los dias sin pedidos quedan en cero).
    const porDia={};u.porDia.forEach(d=>{porDia[String(d.dia).slice(0,10)]=d;});
    const dias=[...Array(u.dias)].map((_,i)=>{const t=new Date(Date.now()-(u.dias-1-i)*864e5).toISOString().slice(0,10);return porDia[t]||{dia:t,n:0,errores:0};});
    const max=Math.max(1,...dias.map(d=>d.n));
    const barras=`<div style="display:flex;align-items:flex-end;gap:2px;height:60px;margin:10px 0 2px;border-bottom:1px solid var(--line,#ddd)">${dias.map(d=>`<div title="${d.dia.split('-').reverse().join('/')}: ${d.n} pedidos, ${d.errores} con error" style="flex:1;height:${d.n?Math.max(3,Math.round(d.n/max*58)):0}px;background:var(--accent);border-radius:2px 2px 0 0;opacity:${d.errores&&d.errores===d.n?'.55':'1'}"></div>`).join('')}</div><p class="hint" style="margin:0">Pedidos por día, últimos ${u.dias} días</p>`;
    const ops=u.porOperacion.map(o=>`<tr><td class="mono">${esc(o.operacion||'')}</td><td>${o.n}</td><td>${o.errores}</td><td style="white-space:nowrap">${o.latenciaMedia} ms</td></tr>`).join('')||'<tr><td colspan="4" class="hint">Sin pedidos.</td></tr>';
    const ult=u.ultimos.map(r=>`<tr><td class="hint" style="white-space:nowrap">${new Date(r.ts).toLocaleString('es-AR')}</td><td class="mono">${esc(r.operacion||(r.metodo+' '+r.ruta))}</td><td><span class="tag ${r.status<400?'ok':'no'}">${r.status}</span></td><td style="white-space:nowrap">${r.ms} ms</td></tr>`).join('')||'<tr><td colspan="4" class="hint">Sin pedidos.</td></tr>';
    modal(`<h3 style="margin-top:0">Uso de la clave</h3><p class="hint" style="margin-top:-6px"><b>${esc(u.clave.nombre)}</b> · <code>${esc(u.clave.prefijo||'')}</code> · ${esc(u.clave.rol)}</p>
      <div class="row" style="gap:18px;flex-wrap:wrap"><div><b>${u.total}</b> <span class="hint">pedidos</span></div><div><b>${u.errores}</b> <span class="hint">con error</span></div>
      <div><b>${u.denegados}</b> <span class="hint">sin permiso</span></div><div><b>${u.limitados}</b> <span class="hint">por límite</span></div>
      <div><b>${u.cuitsDistintos}</b> <span class="hint">CUITs</span></div><div><b>${u.latenciaMedia} ms</b> <span class="hint">promedio</span></div></div>
      ${barras}
      <h4>Por operación</h4><div style="max-height:180px;overflow:auto"><table><thead><tr><th>Operación</th><th>Pedidos</th><th>Errores</th><th>Latencia</th></tr></thead><tbody>${ops}</tbody></table></div>
      <h4>Últimos pedidos</h4><div style="max-height:200px;overflow:auto"><table><tbody>${ult}</tbody></table></div>
      <div class="row" style="margin-top:12px"><button class="primary" onclick="closeModal()">Cerrar</button></div>`);
  }catch(e){toast(e.message,true);}
}

   <p class="hint">Elegí el endpoint, completá los datos y copiá el nodo de n8n listo para pegar, o el snippet en tu lenguaje.</p>
   <div class="card" style="max-width:780px">
     <div class="f2"><div><label>Base URL <span class="hint">(para n8n en Docker: http://arcanum:8094)</span></label><input id="g_base" value="${location.origin}"></div>
     <div><label>API key (X-API-Key)</label><input id="g_key" value="TU_API_KEY" class="mono"></div></div>
     <label>Endpoint</label><select id="g_preset">${opts}</select>
     <div class="f2"><div><label>Método</label><select id="g_method"><option>GET</option><option>POST</option></select></div>
     <div><label>Ruta</label><input id="g_path" class="mono"></div></div>
     <label>Body (JSON) <span class="hint">— sólo para POST</span></label><textarea id="g_body" class="mono"></textarea>
   </div>
   <div class="card" style="max-width:780px;margin-top:14px">
     <strong>Explorar operaciones de un servicio</strong>
     <p class="hint">Lee el WSDL en vivo y te lista las operaciones y sus campos. Tocá "Usar" para cargarla en el generador.</p>
     <div class="row"><select id="g_svc" style="max-width:360px">${svcOpts}</select><button onclick="cargarOps()">Ver operaciones</button></div>
     <div id="g_ops" style="margin-top:10px"></div>
   </div>
   <div id="g_out" style="margin-top:16px"></div>`;
  $('#g_preset').onchange=applyPreset;
  ['g_base','g_key','g_method','g_path','g_body'].forEach(id=>$('#'+id).oninput=genAll);
  applyPreset();
}
async function cargarOps(){
  const id=$('#g_svc').value; $('#g_ops').innerHTML='<span class="hint">Leyendo WSDL…</span>';
  try{ const r=await api('/api/services/'+id+'/operaciones'); window._OPS={id,ops:r.operaciones};
    $('#g_ops').innerHTML=r.operaciones.map((o,i)=>`<div class="row" style="border-top:1px solid var(--line);padding:7px 0"><div><span class="mono">${o.nombre}</span>${o.parametros.length?' <span class="hint">('+o.parametros.map(p=>p.nombre).join(', ')+')</span>':''}</div><button class="ghost" style="margin-left:auto" onclick="usarOp(${i})">Usar</button></div>`).join('')||'<span class="hint">Sin operaciones legibles en el WSDL.</span>';
  }catch(e){ $('#g_ops').innerHTML='<span class="hint">'+e.message+'</span>'; }
}
function usarOp(i){
  const {id,ops}=window._OPS, o=ops[i], params={};
  o.parametros.forEach(p=>params[p.nombre]='');
  $('#g_preset').value='Genérico (cualquier servicio)';
  $('#g_method').value='POST'; $('#g_path').value='/api/ws/'+id+'/'+o.nombre;
  $('#g_body').value=JSON.stringify({cuit:'20111111112',params},null,2);
  genAll(); toast('Operación cargada: '+o.nombre);
}
function applyPreset(){
  const val=$('#g_preset').value; let p;
  if(val.indexOf('s:')===0){
    const id=val.slice(2); const svc=(window._SVCS||[]).find(s=>s.id===id);
    const op=(svc&&svc.dummyOp)||'OPERACION';
    p={m:'POST',p:'/api/ws/'+id+'/'+op,b:{cuit:'20111111112',params:{}}};
  } else { p=RICH_PRESETS[val.indexOf('r:')===0?val.slice(2):val]; }
  if(!p)return;
  $('#g_method').value=p.m;$('#g_path').value=p.p;$('#g_body').value=p.b?JSON.stringify(p.b,null,2):'';genAll();
}
function genAll(){
  const base=$('#g_base').value.replace(/\/$/,''),key=$('#g_key').value,m=$('#g_method').value,url=base+$('#g_path').value;
  let body=null;const raw=$('#g_body').value.trim();
  if(m==='POST'&&raw){try{body=JSON.parse(raw);}catch{body='__invalid__';}}
  const inv=body==='__invalid__';
  const blocks=[['n8n — copiá y pegá en el canvas',inv?'(JSON del body inválido)':genN8n(m,url,key,body)],
    ['cURL',inv?'(JSON del body inválido)':genCurl(m,url,key,body)],
    ['JavaScript (fetch)',inv?'(JSON del body inválido)':genJS(m,url,key,body)],
    ['Python (requests)',inv?'(JSON del body inválido)':genPy(m,url,key,body)]];
  $('#g_out').innerHTML=blocks.map((b,i)=>`<div class="card" style="margin-bottom:12px"><div class="row"><strong>${b[0]}</strong><button class="ghost" style="margin-left:auto" onclick="copyBlock(${i})">Copiar</button></div><pre id="gb${i}">${esc(b[1])}</pre></div>`).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function copyBlock(i){navigator.clipboard.writeText($('#gb'+i).textContent);toast('Copiado');}
function genCurl(m,url,key,body){let s=`curl -X ${m} "${url}" \\\n  -H "X-API-Key: ${key}"`;if(body){s+=` \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(body)}'`;}return s;}
function genJS(m,url,key,body){return `const res = await fetch(${JSON.stringify(url)}, {\n  method: ${JSON.stringify(m)},\n  headers: {\n    "X-API-Key": ${JSON.stringify(key)}${body?',\n    "Content-Type": "application/json"':''}\n  }${body?`,\n  body: JSON.stringify(${JSON.stringify(body,null,2)})`:''}\n});\nconst data = await res.json();\nconsole.log(data);`;}
function genPy(m,url,key,body){return `import requests\n\nr = requests.${m.toLowerCase()}(\n    ${JSON.stringify(url)},\n    headers={"X-API-Key": ${JSON.stringify(key)}}${body?`,\n    json=${pyLit(body,1)}`:''},\n)\nprint(r.json())`;}
function pyLit(v,ind){const pad='    '.repeat(ind),pad0='    '.repeat(ind-1);
  if(v===null)return 'None';if(v===true)return 'True';if(v===false)return 'False';
  if(typeof v==='number')return String(v);if(typeof v==='string')return JSON.stringify(v);
  if(Array.isArray(v)){return v.length?'[\n'+v.map(x=>pad+pyLit(x,ind+1)).join(',\n')+'\n'+pad0+']':'[]';}
  const ks=Object.keys(v);return ks.length?'{\n'+ks.map(k=>pad+JSON.stringify(k)+': '+pyLit(v[k],ind+1)).join(',\n')+'\n'+pad0+'}':'{}';}
function genN8n(m,url,key,body){
  const hasB=m==='POST'&&body;
  const node={parameters:{method:m,url:url,sendHeaders:true,headerParameters:{parameters:[{name:'X-API-Key',value:key}]},...(hasB?{sendBody:true,specifyBody:'json',jsonBody:JSON.stringify(body,null,2)}:{}),options:{}},
    id:'arcanum-http-1',name:'Arcanum',type:'n8n-nodes-base.httpRequest',typeVersion:4.2,position:[680,300]};
  return JSON.stringify({nodes:[node],connections:{}},null,2);
}

/* ---------- TEMA (claro/oscuro persistido) ---------- */
const I_SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const I_MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function setThemeIcon(){const dark=document.documentElement.getAttribute('data-theme')==='dark';const b=$('#themeBtn');if(b)b.innerHTML=dark?I_SUN:I_MOON;}
function toggleTheme(){const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.arcanumTheme=next;}catch(e){}setThemeIcon();}

/* ---------- Ojito mostrar/ocultar contraseña ---------- */
const I_EYE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const I_EYEOFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3 3.9M6.3 6.3A18 18 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/><path d="M3 3l18 18"/></svg>';
function pwField(id,ph,extra){return `<div class="pwwrap"><input id="${id}" type="password" ${extra||''} ${ph?'placeholder="'+ph+'"':''}><button class="eye" type="button" tabindex="-1" aria-label="Mostrar u ocultar" onclick="togglePw('${id}',this)">${I_EYE}</button></div>`;}
function togglePw(id,btn){const el=$('#'+id);const show=el.type==='password';el.type=show?'text':'password';btn.innerHTML=show?I_EYEOFF:I_EYE;}

/* ---------- MENÚ (kebab): tema + entorno + Acerca de (modal) + salir ---------- */
const I_LOGOUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>';
const I_INFO='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
const I_GEAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>';
function toggleMenu(){const m=$('#appmenu');const open=m.classList.toggle('open');if(open)renderMenu();}
async function renderMenu(){
  let cfg={entorno:ENV||'?',version:'?'};
  try{ cfg=await api('/api/config'); }catch{}
  const admin=['superadmin','admin'].includes(ME.role);
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  $('#appmenu').innerHTML=`
   <div class="menu-user">${ME.username} · ${ME.role}</div>
   <div class="menu-sep"></div>
   <button class="menu-item" onclick="toggleTheme();renderMenu()">${dark?I_SUN:I_MOON}<span>${dark?'Tema claro':'Tema oscuro'}</span></button>
   ${admin?`<div class="menu-sec"><div class="menu-h">Entorno ARCA</div>
     <div class="menu-row"><span>Operar contra</span>
       <select id="m_env" onchange="cambiarEntorno(this.value)">
         <option value="homo"${cfg.entorno==='homo'?' selected':''}>Homologación</option>
         <option value="prod"${cfg.entorno==='prod'?' selected':''}>Producción</option>
       </select></div>
     <div class="hint" style="padding:2px 12px 6px">Cambia los endpoints de ARCA para toda la instancia.</div></div>`:''}
   ${ME.role==='superadmin'?`<button class="menu-item" onclick="ajustesMc()">${I_GEAR}<span>Fisherboy y Mis Comprobantes</span></button>`:''}
   <button class="menu-item" onclick="acercaDe()">${I_INFO}<span>Acerca de Arcanum</span></button>
   <div class="menu-sep"></div>
   <button class="menu-item" onclick="logout()">${I_LOGOUT}<span>Cerrar sesión</span></button>`;
}
async function acercaDe(){
  $('#appmenu').classList.remove('open');
  let cfg={entorno:ENV||'?',version:'?'};
  try{ cfg=await api('/api/config'); }catch{}
  const env=String(cfg.entorno).toUpperCase();
  modal(`<button class="modal-x" type="button" aria-label="Cerrar" onclick="closeModal()">&times;</button>
   <h3 class="modal-tit">Arcanum</h3>
   <p class="modal-cuerpo">Gateway REST self-hosted para los Web Services de ARCA (ex-AFIP). Firma WSAA 100% local.</p>
   <dl class="about-rows">
     <dt>Versión</dt><dd>v${cfg.version}</dd>
     <dt>Usuario</dt><dd>${ME.username} (${ME.role})</dd>
     <dt>Entorno</dt><dd><span class="tag ${cfg.entorno==='prod'?'warn':''}">${env}</span></dd>
     <dt>Rol en la suite</dt><dd>Gateway</dd>
   </dl>
   <p class="about-foot">Diego Parras · Ecosistema Escriba</p>`);
}
async function cambiarEntorno(v){
  if(!confirm('¿Cambiar el entorno de ARCA a '+v.toUpperCase()+'? Afecta a toda la instancia.')){renderMenu();return;}
  try{ await api('/api/config/entorno',{method:'POST',body:JSON.stringify({entorno:v})}); toast('Entorno: '+v.toUpperCase()); location.reload(); }
  catch(e){ toast(e.message,true); renderMenu(); }
}
document.addEventListener('click',e=>{const m=$('#appmenu'),b=$('#menuBtn');if(m&&m.classList.contains('open')&&!m.contains(e.target)&&b&&!b.contains(e.target))m.classList.remove('open');});

setThemeIcon();
boot();
</script>
