/* Tabla de comprobantes: se ordena por cualquier columna (clic en el titulo: ascendente, otro clic:
   descendente) y el motivo de ARCA de los "NO CONSTA" se muestra u oculta. Ambas cosas se recuerdan
   en este navegador. */
const MC_COMO={CUIL:'CUIL',DNI:'DNI',consumidor_final:'nombre como consumidor final'};
const mcObs=c=>((c&&c.observaciones)||[]).map(o=>o.message||o.Msg||'').filter(Boolean).join(' | ');
// Para ordenar la constatacion: primero lo que hay que mirar.
const mcRangoCons=f=>{if(f.tipo!=='recibido')return 4;const c=f.constatacion;if(!c)return 2;if(c.apoc&&c.apoc.esApocrifo)return 0;return c.valido?3:1;};
const MC_COLS=[
  ['fecha','Fecha',f=>String(f.fecha).slice(0,10)],
  ['tipo','Tipo',f=>`${f.tipo} ${String(f.cbte_tipo).padStart(3,'0')}`],
  ['cbte','Comprobante',f=>Number(f.punto_venta)*1e9+Number(f.numero_desde)],
  ['contraparte','Contraparte',f=>String(f.contraparte||f.doc_nro||'').toLowerCase()],
  ['total','Total',f=>Number(f.total||0)],
  ['cae','CAE',f=>String(f.cae||'')],
  ['constatacion','Constatación',mcRangoCons],
];
function mcPrefs(){if(!MC.prefs){let p={};try{p=JSON.parse(localStorage.getItem('arcanum.mcTabla')||'{}');}catch{}MC.prefs={orden:p.orden||'fecha',dir:p.dir===1?1:-1,motivos:p.motivos!==false};}return MC.prefs;}
function mcGuardarPrefs(){try{localStorage.setItem('arcanum.mcTabla',JSON.stringify(MC.prefs));}catch{}}
function mcOrdenar(col){const p=mcPrefs();if(p.orden===col)p.dir=-p.dir;else{p.orden=col;p.dir=1;}mcGuardarPrefs();mcPintarTabla();}
function mcMotivos(ver){mcPrefs().motivos=!!ver;mcGuardarPrefs();mcPintarTabla();}
function mcPintarTabla(){
  const box=$('#mc_tabla');if(!box)return;const l=MC.filas||[];
  if(!l.length){box.innerHTML='<p class="hint">No hay comprobantes bajados con estos filtros.</p>';return;}
  const p=mcPrefs();
  const pesos=n=>Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const cons=c=>!c?'<span class="hint">sin constatar</span>':c.apoc&&c.apoc.esApocrifo?'<span class="tag no">APÓCRIFO</span>'
    :c.valido?`<span class="tag ok">OK</span>${c.receptor?` <span class="hint">(a tu ${MC_COMO[c.receptor.como]||esc(c.receptor.como)})</span>`:''}`
    :`<span class="tag no" title="${esc(mcObs(c)||'ARCA no dio el motivo')}">NO CONSTA</span>${p.motivos&&mcObs(c)?`<div class="hint" style="font-size:11.5px;max-width:260px">${esc(mcObs(c))}</div>`:''}`;
  const col=MC_COLS.find(c=>c[0]===p.orden)||MC_COLS[0];
  const filas=l.map((f,i)=>[col[2](f),i,f]).sort((x,y)=>{const a=x[0],b=y[0];
    const d=typeof a==='number'&&typeof b==='number'?a-b:String(a).localeCompare(String(b),'es',{numeric:true});
    return d?d*p.dir:x[1]-y[1];}).map(x=>x[2]);
  const flecha=d=>`<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px"><path d="${d>0?'M6 15l6-6 6 6':'M6 9l6 6 6-6'}"/></svg>`;
  const th=([k,t])=>`<th aria-sort="${p.orden===k?(p.dir>0?'ascending':'descending'):'none'}"><button type="button" class="linkbtn" style="text-decoration:none;color:inherit;font:inherit;font-weight:inherit;display:inline-flex;align-items:center;gap:4px" onclick="mcOrdenar('${k}')" title="Ordenar por ${t.toLowerCase()}">${t}${p.orden===k?flecha(p.dir):''}</button></th>`;
  const hayMotivos=l.some(f=>f.tipo==='recibido'&&f.constatacion&&f.constatacion.valido===false&&mcObs(f.constatacion));
  box.innerHTML=`${hayMotivos?`<label class="chk" style="margin:0 0 8px"><input type="checkbox" ${p.motivos?'checked':''} onchange="mcMotivos(this.checked)"> Mostrar el motivo de ARCA en los que no constan</label>`:''}
    <table><tr>${MC_COLS.map(th).join('')}</tr>${filas.map(f=>`<tr>
    <td class="mono">${String(f.fecha).slice(0,10)}</td><td>${f.tipo==='recibido'?'Recibido':'Emitido'} · ${esc(NOMBRE_TIPO[f.cbte_tipo]||f.cbte_tipo)}</td>
    <td class="mono">${String(f.punto_venta).padStart(4,'0')}-${String(f.numero_desde).padStart(8,'0')}</td>
    <td>${esc(f.contraparte||'')} <span class="hint mono">${esc(f.doc_nro||'')}</span></td><td class="mono">$${pesos(f.total)}</td>
    <td class="mono hint">${esc(f.cae||'')}</td><td>${f.tipo==='recibido'?cons(f.constatacion):''}</td></tr>`).join('')}</table>`;
}
async function mcExportar(){
  try{const r=await fetch(`/api/mis-comprobantes/${MC.cuit}/export.csv?${mcFiltros()}`,{credentials:'include'});
    if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.blob();const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=`mis-comprobantes-${MC.cuit}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
  catch(e){toast(e.message,true);}
}
/* Constatar recibidos: corre en segundo plano en el servidor (uno por comprobante contra ARCA,
   puede llevar minutos). Acá se muestra el progreso y se refresca el listado a medida que avanza. */
async function mcConstatar(){
  const q=new URLSearchParams(mcFiltros()),filtros={};
  for(const k of ['desde','hasta','clase','cbte','contraparte','q'])if(q.get(k))filtros[k]=q.get(k);
  const b=$('#mc_constBtn');if(b)b.disabled=true;
  $('#mc_const').innerHTML='<p class="hint">Buscando los recibidos sin constatar…</p>';
  try{const {constatacion:c}=await api(`/api/mis-comprobantes/${MC.cuit}/constatar`,{method:'POST',body:JSON.stringify({filtros})});
    mcConstPintar(c);if(c.estado==='corriendo')mcConstSeguir();else{if(b)b.disabled=false;}}
  catch(e){if(/Ya se están constatando/.test(e.message)){mcConstSeguir();return;}
    if(b)b.disabled=false;$('#mc_const').innerHTML=`<p class="hint">${esc(e.message)}</p>`;}
}
function mcConstPintar(c){
  const box=$('#mc_const');if(!box||!c)return;
  const tags=`<span class="tag ok">${c.validos} OK</span> <span class="tag no">${c.invalidos} no ${c.invalidos===1?'consta':'constan'}</span> <span class="tag warn">${c.conError} con error de ARCA</span>${c.emisoresApocrifos?` <span class="tag no">${c.emisoresApocrifos} ${c.emisoresApocrifos===1?'emisor apócrifo':'emisores apócrifos'}</span>`:''}`;
  if(c.estado==='corriendo'){
    const pct=c.total?Math.round(c.hechos/c.total*100):0;
    box.innerHTML=`<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><strong style="font-size:13.5px">Constatando con ARCA: ${c.hechos} de ${c.total}</strong><span class="hint">${pct}%</span></div>
      <div style="height:8px;border-radius:5px;background:var(--card);margin-top:6px;overflow:hidden" role="progressbar" aria-valuemin="0" aria-valuemax="${c.total}" aria-valuenow="${c.hechos}"><div style="height:100%;width:${pct}%;background:var(--accent);transition:width .4s"></div></div>
      <p style="margin:8px 0 0">${tags}</p>
      ${c.deteniendo?`<p class="hint" style="margin:6px 0 0">Deteniendo: termina el comprobante en curso y para.</p>`
        :c.actual?`<p class="hint" style="margin:6px 0 0">Ahora: ${esc(c.actual.comprobante)} de ${esc(c.actual.contraparte)}. Podés seguir usando Arcanum; esto sigue solo y guarda cada resultado apenas lo tiene.</p>`:''}
      <p style="margin:8px 0 0"><button class="ghost" onclick="mcConstDetener()" ${c.deteniendo?'disabled':''}>Detener</button> <span class="hint">Lo constatado queda guardado; después la seguís con Constatar recibidos.</span></p></div>`;
    return;}
  if(c.estado==='detenido'){box.innerHTML=`<p style="margin-top:10px"><strong style="font-size:13.5px">Detenida: ${c.hechos} de ${c.total} constatados.</strong> ${tags} <span class="hint">Lo que falta quedó pendiente: tocá Constatar recibidos para seguir desde ahí.</span></p>`;return;}
  if(c.estado==='error'){box.innerHTML=`<p style="margin-top:10px"><span class="tag no">SE CORTÓ</span> <span class="hint">${esc(c.error||'')}. Lo constatado hasta ahí quedó guardado: volvé a tocar el botón para seguir.</span></p>`;return;}
  if(!c.total){box.innerHTML=`<p class="hint" style="margin-top:10px">No hay recibidos sin constatar con estos filtros.${c.pendientes?` Quedan ${c.pendientes} pendientes fuera de los filtros.`:''}</p>`;return;}
  box.innerHTML=`<p style="margin-top:10px"><strong style="font-size:13.5px">Listo: ${c.total} constatados.</strong> ${tags} <span class="hint">${c.pendientes!=null?`· ${c.pendientes} pendientes en total${c.conError?' (los que dieron error se reintentan la próxima vez)':''}`:''}</span></p>`;
}
async function mcConstDetener(){
  try{const {constatacion:c}=await api(`/api/mis-comprobantes/${MC.cuit}/constatar/detener`,{method:'POST',body:'{}'});mcConstPintar(c);}
  catch(e){toast(e.message,true);}
}
function mcConstSeguir(){
  clearInterval(MC.constTimer);let vistos=-1;
  const b=$('#mc_constBtn');if(b)b.disabled=true;
  const paso=async()=>{
    if(!$('#mc_const')){clearInterval(MC.constTimer);return;}
    try{const {constatacion:c}=await api(`/api/mis-comprobantes/${MC.cuit}/constatar`);
      if(!c){clearInterval(MC.constTimer);if(b)b.disabled=false;return;}
      mcConstPintar(c);
      if(c.estado!=='corriendo'){clearInterval(MC.constTimer);MC.constTimer=null;const bb=$('#mc_constBtn');if(bb)bb.disabled=false;mcCargarTabla();return;}
      if(vistos<0||c.hechos-vistos>=10){vistos=c.hechos;mcCargarTabla();}
    }catch{}
  };
  paso();MC.constTimer=setInterval(paso,1500);
}
/* Al abrir la pantalla: si hay una constatación corriendo (o recién terminada), mostrarla. */
async function mcConstRetomar(){
  if(!/^\d{11}$/.test(MC.cuit)||!$('#mc_const'))return;
  try{const {constatacion:c}=await api(`/api/mis-comprobantes/${MC.cuit}/constatar`);
    if(!c)return;
    if(c.estado==='corriendo'){mcConstSeguir();return;}
    if(c.terminada&&Date.now()-new Date(c.terminada)<15*60000)mcConstPintar(c);
  }catch{}
}
/* Topes de Monotributo: tabla A a K, plantilla CSV para descargar e importar. Cambiarlos es de superadmin. */
const MC_LETRAS=['A','B','C','D','E','F','G','H','I','J','K'];
async function mcTopes(){
  const su=ME.role==='superadmin';
  let c;try{({categorias:c}=await api('/api/monotributo/categorias'));}catch(e){toast(e.message,true);return;}
  const fmt=n=>n==null?'':Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const filas=MC_LETRAS.map(l=>`<tr><td class="mono" style="width:90px">${l}</td><td>${su?`<input class="mono mct-tope" data-l="${l}" value="${fmt(c.topes&&c.topes[l])}" inputmode="decimal" aria-label="Tope de la categoría ${l}" style="text-align:right">`:`<span class="mono">$ ${fmt(c.topes&&c.topes[l])}</span>`}</td></tr>`).join('');
  modal(`<button class="modal-x" type="button" aria-label="Cerrar" onclick="closeModal()">&times;</button><h3 style="text-transform:none">Topes de Monotributo</h3>
    <p class="hint">Ingresos brutos anuales máximos por categoría. Arcanum los usa para el semáforo de Monotributo. ARCA los actualiza dos veces por año (febrero y agosto): copiá los vigentes de arca.gob.ar.</p>
    <div class="f2"><div><label>Vigencia</label><input id="mct_vig" value="${escA(c.vigencia||'')}" placeholder="2026-08" ${su?'':'disabled'}></div>
    <div><label>Fuente</label><input id="mct_fuente" value="${escA(c.fuente||'')}" placeholder="arca.gob.ar, tabla vigente desde 08/2026" ${su?'':'disabled'}></div></div>
    <table style="margin-top:12px"><tr><th>Categoría</th><th>Tope anual</th></tr>${filas}</table>
    <p class="hint" id="mct_msg" style="margin:10px 0 0"></p>
    <div class="row" style="margin-top:12px"><button type="button" onclick="mcTopesPlantilla()">Descargar plantilla</button>
      ${su?`<label class="ghost" style="margin:0;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:14px;color:var(--ink)">Importar CSV<input type="file" accept=".csv,text/csv,text/plain" style="display:none" onchange="mcTopesImportar(this)"></label>
      <button type="button" class="primary" style="margin-left:auto" onclick="mcTopesGuardar()">Guardar topes</button>`:'<span class="hint" style="margin-left:auto">Solo un superadmin puede cambiarlos.</span>'}</div>
    <p class="hint" style="margin:10px 0 0">La plantilla trae los topes cargados: editala en Excel (una fila por categoría, con coma decimal) e importala. Antes de guardar se revisa que estén las 11 categorías y que cada tope sea mayor que el anterior.</p>`);
}
async function mcTopesPlantilla(){
  try{const r=await fetch('/api/monotributo/categorias/plantilla.csv',{credentials:'include'});if(!r.ok)throw new Error('HTTP '+r.status);
    const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='topes-monotributo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
  catch(e){toast(e.message,true);}
}
function mcTopesImportar(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const vistos=[];
    for(const linea of String(rd.result).replace(/^﻿/,'').split(/\r?\n/)){
      const sep=linea.includes(';')?';':linea.includes('\t')?'\t':',';const [cat,...resto]=linea.split(sep);
      const l=String(cat||'').replace(/["']/g,'').trim().toUpperCase();const el=document.querySelector(`.mct-tope[data-l="${l}"]`);
      if(el){el.value=resto.join(sep===','?'.':sep).replace(/["']/g,'').trim();vistos.push(l);}}
    $('#mct_msg').textContent=vistos.length?`Se cargaron ${vistos.length} categorías desde ${f.name}. Revisalas y tocá «Guardar topes».`:`${f.name} no tiene filas con una categoría (A a K) y su tope.`;
    inp.value='';};
  rd.readAsText(f);
}
async function mcTopesGuardar(){
  const csv='categoria;tope\n'+MC_LETRAS.map(l=>`${l};${(document.querySelector(`.mct-tope[data-l="${l}"]`)||{}).value||''}`).join('\n');
  try{await api('/api/monotributo/categorias',{method:'PUT',body:JSON.stringify({csv,vigencia:$('#mct_vig').value.trim(),fuente:$('#mct_fuente').value.trim()})});
    closeModal();toast('Topes guardados');if($('#mc_mono'))mcMonotributo();}
  catch(e){$('#mct_msg').textContent=e.message;$('#mct_msg').style.color='var(--bad)';}
}

      ${m.tope?`<div style="height:10px;border-radius:6px;background:var(--chip);margin-top:12px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${color}"></div></div>
      <p class="hint">${(m.usado*100).toFixed(1)}% del tope · ventana ${esc(m.ingresos.desde)} a ${esc(m.ingresos.hasta)}</p>`:`<p class="hint">${esc(m.advertenciaPadron||'No se pudo leer la categoría del padrón.')}</p>`}
      <div class="row" style="justify-content:space-between;margin-top:6px"><p class="hint" style="margin:0">Topes cargados: vigencia ${esc(m.vigenciaTopes||'?')}. Verificá los topes vigentes en arca.gob.ar.${m.excedeMaxima?' Supera la categoría máxima: corresponde evaluar el Régimen General.':''}</p>
      <button class="ghost" onclick="mcTopes()">Ver y cargar topes</button></div>`;
  }catch(e){$('#mc_mono').innerHTML=`<p class="hint">${esc(e.message)}</p>`;}

/* Backups y master key (superadmin) */

  modal(`<button class="modal-x" onclick="closeModal()" aria-label="Cerrar">&times;</button><h3 style="text-transform:none">Backups y master key</h3>
   <div class="card" style="margin:10px 0">${mk.respaldadaAt?`<span class="tag ok">MASTER KEY RESGUARDADA</span> <span class="hint">confirmado el ${new Date(mk.respaldadaAt).toLocaleString('es-AR')}</span>`:'<span class="tag no">FALTA CONFIRMAR EL RESGUARDO</span>'}
    <p class="hint" style="margin-top:8px">Sin la master key (ARCANUM_MASTER_KEY) no se pueden abrir ni los certificados ni los backups. Guardala fuera de este servidor. Huella de la clave actual: <span class="mono">${esc(mk.huella||'?')}</span>. Para comprobar tu copia: <span class="mono">echo -n CLAVE | xxd -r -p | sha256sum | cut -c1-8</span> tiene que dar lo mismo.</p>

   <div class="row"><button class="primary" onclick="crearBackup()">Crear backup ahora</button><span class="hint">Diario a las 3 (hora argentina). Se guardan los últimos 14 en /data/backups, cifrados.</span></div>
   <div id="bk_lista" style="margin-top:10px">${d.backups.length?`<table><tr><th>Archivo</th><th>Tamaño</th><th></th></tr>${d.backups.map(b=>`<tr><td class="mono">${esc(b.nombre)}</td><td class="mono">${kb(b.bytes)}</td><td><button class="ghost" onclick="bajarBackup(${jsA(b.nombre)})">Descargar</button></td></tr>`).join('')}</table>`:'<p class="hint">Todavía no hay backups.</p>'}</div>

async function avisoMasterKey(){

}

function faVeredictoHtml(r){
  const [cls,tit,def]=FA_VEREDICTO[r.veredicto]||['idle',String(r.veredicto||'?').toUpperCase(),''];
  const cbtes=(r.resultado&&r.resultado.comprobantes)||[];

    return `<table style="margin-top:8px">
      <tr><th>Comprobante</th><td class="mono">${NOMBRE_TIPO[c.tipo]?esc(NOMBRE_TIPO[c.tipo]):esc(('Tipo '+(c.tipo||'?'))+(c.letra?' '+c.letra:''))} ${String(Number(c.punto_venta)||0).padStart(4,'0')}-${String(Number(c.numero)||0).padStart(8,'0')}</td></tr>
      <tr><th>Fecha</th><td class="mono">${esc(c.fecha||'')}</td></tr>
      <tr><th>Emisor</th><td>${esc(c.razon_social_emisor||'')} <span class="mono hint">${esc(c.cuit_emisor||'')}</span></td></tr>

      <tr><th>CAE</th><td class="mono">${esc(c.cae||'')}${c.vto_cae?` <span class="hint">vence ${esc(c.vto_cae)}</span>`:''}</td></tr></table>
      ${faHallazgosHtml(hs)}`;}).join('');

    <p style="margin:8px 0 0">${esc(r.mensaje||def)}</p>${filas||'<p class="hint">No se encontró ningún comprobante en el archivo.</p>'}</div>`;

function faHallazgosHtml(hs){
  if(!hs||!hs.length)return '<p class="hint" style="margin:8px 0 0">Sin hallazgos: los controles cierran.</p>';
  const nv={error:'no',aviso:'warn',info:''};

async function faVerificar(){

  const box=$('#fa_ver');box.innerHTML='<p class="hint">Leyendo la factura y constatando con ARCA… puede tardar un minuto.</p>';
  try{const body={nombre:f.name,contenido_base64:await faArchivoB64(f)};
    const c=$('#fa_vcons').value;if(c)body.cuit_consultante=c;
    if($('#fa_via').checked)body.ia=true;
    const r=await api('/api/factorum/verificar',{method:'POST',body:JSON.stringify(body)});

async function faSubirLote(){
  const fs=[...$('#fa_lfiles').files];
  if(!fs.length){toast('Elegí uno o más archivos',true);return;}
  const total=fs.reduce((a,f)=>a+f.size,0);
  if(fs.some(f=>f.size>FA_MAX_ARCHIVO)){toast('Hay un archivo de más de 20 MB',true);return;}
  if(total>FA_MAX_LOTE){toast('El lote supera 60 MB: partilo en varios',true);return;}
  $('#fa_lest').textContent='Subiendo…';
  try{const archivos=[];for(const f of fs)archivos.push({nombre:f.name,contenido_base64:await faArchivoB64(f)});
    const body={archivos,ia:$('#fa_lia').checked,constatar:$('#fa_lcons').checked};
    const c=$('#fa_lcli').value;if(c)body.cliente_cuit=c;
    const n=$('#fa_lnom').value.trim();if(n)body.nombre=n;
    const r=await api('/api/factorum/lotes',{method:'POST',body:JSON.stringify(body)});
    $('#fa_lest').textContent='';$('#fa_lfiles').value='';toast(`Lote ${r.lote&&r.lote.id?'#'+r.lote.id+' ':''}en proceso`);faLotes();
  }catch(e){$('#fa_lest').textContent='';toast(e.message,true);}

function faVerLote(id){$('#fa_flote').value=id;$('#fa_fest').value='';faCargar();$('#fa_tabla').scrollIntoView({behavior:'smooth',block:'start'});}
function faFiltros(){const q=new URLSearchParams();

async function faRevisar(id){

async function faGuardar(id,aprobar){
  const campos={};
  for(const [n] of FA_CAMPOS){const el=$('#fa_c_'+n);if(el&&el.value!==el.dataset.orig){const val=el.value.trim();campos[n]=FA_ENTEROS.includes(n)&&/^\d+$/.test(val)?Number(val):val;}}
  if(!aprobar&&!Object.keys(campos).length){toast('No cambiaste nada');return;}
  try{await api('/api/factorum/comprobantes/'+id,{method:'PATCH',body:JSON.stringify({campos,aprobar})});
    toast(aprobar?'Comprobante aprobado':'Cambios guardados');closeModal();faCargar();}
  catch(e){toast(e.message,true);}
}

const COLA_ESTADO={pendiente:['warn','En espera'],procesando:['warn','Emitiendo'],emitido:['ok','Emitido'],rechazado:['no','Rechazado'],requiere_humano:['no','Necesita tu decisión'],cancelado:['','Cancelado']};
async function vContingencia(){

  v.innerHTML=`<h2>Contingencia</h2>

   <div class="card"><div class="row"><select id="cl_estado" style="width:auto" onchange="clCargar()"><option value="">Todos</option><option value="pendiente">En espera</option><option value="requiere_humano">Necesitan tu decisión</option><option value="emitido">Emitidos</option><option value="rechazado">Rechazados</option><option value="cancelado">Cancelados</option></select>

async function clCargar(){
  try{const est=$('#cl_estado').value;const {cola}=await api('/api/cola'+(est?'?estado='+est:''));
    $('#cl_tabla').innerHTML=cola.length?`<table><tr><th>#</th><th>CUIT</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Intentos</th><th>Próximo intento</th><th>Detalle</th><th></th></tr>${cola.map(x=>{const e=COLA_ESTADO[x.estado]||['',x.estado];

      const det=x.estado==='emitido'&&x.resultado?`CAE ${esc(x.resultado.cae||'')}${x.modo==='CAEA'?' (CAEA)':''}${x.resultado.adoptado?' · recuperado de ARCA':''}`:esc(x.ultimo_error||'');

  }catch(e){$('#cl_tabla').innerHTML=`<p class="hint">${esc(e.message)}</p>`;}
}
async function clAccion(id,a){
  if(a==='cancelar'&&!await confirmar({titulo:'Cancelar este comprobante',texto:'Sale de la cola de contingencia y no se va a emitir.',si:'Cancelar comprobante',no:'Volver',tono:'peligro'}))return;
  if(a==='hoy'&&!await confirmar({titulo:'Emitir con la fecha de hoy',texto:'ARCA ya no acepta la fecha original de este comprobante. Si seguís, se emite con la fecha de hoy.',si:'Emitir hoy',tono:'aviso'}))return;
  try{const r=await api(`/api/cola/${id}/${a==='cancelar'?'cancelar':'reintentar'}`,{method:'POST',body:JSON.stringify(a==='hoy'?{fechaHoy:true}:{})});
    toast(r.item.estado==='emitido'?'Emitido':r.item.estado==='cancelado'?'Cancelado':'Sigue en la cola: '+(r.item.ultimo_error||r.item.estado));clCargar();}
  catch(e){toast(e.message,true);}
}

/* CAEA por CUIT (dentro de Contingencia) */
async function caeaCargar(cuitElegido){
  const box=$('#cl_caea');if(!box)return;
  let tenants=[];try{({tenants}=await api('/api/tenants'));}catch{}
  const conCert=tenants.filter(t=>t.tieneCertificado);
  const cuit=cuitElegido||(window._caeaCuit)||(conCert[0]&&conCert[0].cuit)||'';window._caeaCuit=cuit;
  const admin=['superadmin','admin'].includes(ME.role),opera=admin||ME.role==='operador';
  let st={config:null,caeas:[],pendientes:0};
  if(cuit){try{st=(await api('/api/caea/'+cuit)).caea;}catch{}}
  const c=st.config||{activo:false,punto_venta:'',minutos_espera:30};
  const fmt=s=>s?`${String(s).slice(6,8)}/${String(s).slice(4,6)}/${String(s).slice(0,4)}`:'';
  box.innerHTML=`<h2>CAEA</h2>
   <div class="card"><p class="hint">Opcional por CUIT. Si está prendido, Arcanum pide el CAEA de cada quincena y, cuando ARCA no responde por más de los minutos indicados, emite con CAEA en el punto de venta CAEA. Pedir un CAEA obliga a informar todo lo emitido con él (o "sin movimiento") antes de la fecha tope: Arcanum lo hace solo cuando ARCA vuelve y avisa si algo queda pendiente.</p>
   <div class="row"><select id="caea_cuit" style="width:auto" onchange="caeaCargar(this.value)">${conCert.map(t=>`<option value="${esc(t.cuit)}"${t.cuit===cuit?' selected':''}>${esc(t.cuit)} ${esc(t.nombre||'')}</option>`).join('')||'<option value="">Sin clientes con certificado</option>'}</select>
   <span class="tag ${c.activo?'ok':''}">${c.activo?'CAEA PRENDIDO':'CAEA APAGADO'}</span>
   ${st.pendientes?`<span class="tag warn">${st.pendientes} sin informar</span>`:''}</div>
   ${admin&&cuit?`<div class="f3"><div><label class="chk" style="margin-top:28px"><input type="checkbox" id="caea_activo"${c.activo?' checked':''}> Usar CAEA en contingencia</label></div>
     <div><label>Punto de venta CAEA</label><input id="caea_pv" class="mono" value="${esc(c.punto_venta||'')}" placeholder="De tipo CAEA en ARCA"></div>
     <div><label>Minutos de espera antes de usarlo</label><input id="caea_min" class="mono" value="${esc(c.minutos_espera||30)}"></div></div>
     <div class="row" style="margin-top:10px"><button class="primary" onclick="caeaGuardar()">Guardar</button></div>`:''}
   ${opera&&cuit&&(c.activo||st.pendientes||(st.caeas&&st.caeas.length))?`<div class="row" style="margin-top:10px">${c.activo?`<button onclick="caeaAccion('solicitar')">Pedir CAEA ahora</button>`:''}<button onclick="caeaAccion('informar')">Informar ahora</button></div>`:''}
   ${st.caeas&&st.caeas.length?`<table style="margin-top:12px"><tr><th>Período</th><th>Quincena</th><th>CAEA</th><th>Vigencia</th><th>Informar hasta</th></tr>${st.caeas.map(x=>`<tr><td class="mono">${x.periodo}</td><td>${x.orden===1?'1 al 15':'16 a fin'}</td><td class="mono">${esc(x.caea)}</td><td class="mono">${fmt(x.vig_desde)} a ${fmt(x.vig_hasta)}</td><td class="mono">${fmt(x.tope_inf)}</td></tr>`).join('')}</table>`:''}
   </div>`;
}
async function caeaGuardar(){
  const b={activo:$('#caea_activo').checked,puntoVenta:$('#caea_pv').value.trim()||null,minutosEspera:$('#caea_min').value.trim()};
  try{const r=await api(`/api/caea/${window._caeaCuit}/config`,{method:'PUT',body:JSON.stringify(b)});toast(r.advertencia||'Configuración de CAEA guardada');caeaCargar(window._caeaCuit);}catch(e){toast(e.message,true);}
}
async function caeaAccion(a){
  try{const r=await api(`/api/caea/${window._caeaCuit}/${a}`,{method:'POST',body:'{}'});
    toast(a==='solicitar'?(r.quincenas||[]).map(q=>`${q.periodo}-${q.orden}: ${q.estado.replace('_',' ')}`).join(' · '):`Informados: ${r.informe.informados}, errores: ${r.informe.errores}`);caeaCargar(window._caeaCuit);}
  catch(e){toast(e.message,true);}
}

     <div class="card" style="margin-top:14px;max-width:520px"><h3 style="margin-top:0">Nueva clave</h3>

async function crearClave(){
  const cuits=$('#k_cuits').value.split(',').map(s=>s.replace(/\D/g,'')).filter(Boolean);
  const body={nombre:$('#k_nom').value.trim(),rol:$('#k_rol').value,cuits};
  if($('#k_vence').value.trim())body.venceDias=$('#k_vence').value.trim();
  if($('#k_lim').value.trim())body.limitePorMinuto=$('#k_lim').value.trim();
  body.suite=$('#k_suite').checked;if(body.suite)body.suiteRolTope=$('#k_tope').value;
  try{const {clave}=await api('/api/claves',{method:'POST',body:JSON.stringify(body)});mostrarClaveNueva(clave);}catch(e){toast(e.message,true);}
}
// Suite Escriba: "puede abrir sesiones de la suite" y el rol tope de esas sesiones. admin y
// superadmin solo los pone un superadmin; con CUITs permitidos, el tope llega hasta operador.
function suiteCampos(p,on,tope){
  const sup=ME.role==='superadmin';
  const op=(r,t)=>`<option value="${r}"${tope===r?' selected':''}>${t}</option>`;
  return `<label class="chk" style="margin-top:10px"><input type="checkbox" id="${p}_suite" ${on?'checked':''} onchange="$('#${p}_topebox').classList.toggle('hidden',!this.checked)"> Puede abrir sesiones de la suite</label>
    <div id="${p}_topebox" class="${on?'':'hidden'}"><label>Rol tope de esas sesiones</label><select id="${p}_tope">${op('lectura','lectura')}${op('operador','operador (por defecto)')}${sup||tope==='admin'?op('admin','admin'):''}${sup||tope==='superadmin'?op('superadmin','superadmin'):''}</select>
    <p class="hint" style="margin-top:4px">Para que Factorum (u otra app de la suite) abra Arcanum sin volver a loguearse. Quien ya tiene usuario entra con su rol de Arcanum; nadie entra por encima de este tope.${sup?'':' admin y superadmin los pone un superadmin.'}</p></div>`;
}
function suiteClave(id){

    <p class="hint" style="margin-top:-6px"><code>${esc(c.prefijo||'')}</code> · rol ${esc(c.rol)}${c.cuits&&c.cuits.length?` · CUITs ${c.cuits.map(esc).join(', ')}`:''}</p>

async function rotarClave(id,nombre){
  const g=prompt(`Rotar la clave "${nombre}": se crea una nueva con los mismos permisos. ¿Cuántos días sigue funcionando la anterior? (0 a 90)`,'7');

async function usoClave(id){
  try{const {uso:u}=await api(`/api/claves/${id}/uso?dias=30`);
    // Eje de 30 dias completo (los dias sin pedidos quedan en cero).
    const porDia={};u.porDia.forEach(d=>{porDia[String(d.dia).slice(0,10)]=d;});
    const dias=[...Array(u.dias)].map((_,i)=>{const t=new Date(Date.now()-(u.dias-1-i)*864e5).toISOString().slice(0,10);return porDia[t]||{dia:t,n:0,errores:0};});
    const max=Math.max(1,...dias.map(d=>d.n));
    const barras=`<div style="display:flex;align-items:flex-end;gap:2px;height:60px;margin:10px 0 2px;border-bottom:1px solid var(--line,#ddd)">${dias.map(d=>`<div title="${d.dia.split('-').reverse().join('/')}: ${d.n} pedidos, ${d.errores} con error" style="flex:1;height:${d.n?Math.max(3,Math.round(d.n/max*58)):0}px;background:var(--accent);border-radius:2px 2px 0 0;opacity:${d.errores&&d.errores===d.n?'.55':'1'}"></div>`).join('')}</div><p class="hint" style="margin:0">Pedidos por día, últimos ${u.dias} días</p>`;
    const ops=u.porOperacion.map(o=>`<tr><td class="mono">${esc(o.operacion||'')}</td><td>${o.n}</td><td>${o.errores}</td><td style="white-space:nowrap">${o.latenciaMedia} ms</td></tr>`).join('')||'<tr><td colspan="4" class="hint">Sin pedidos.</td></tr>';
    const ult=u.ultimos.map(r=>`<tr><td class="hint" style="white-space:nowrap">${new Date(r.ts).toLocaleString('es-AR')}</td><td class="mono">${esc(r.operacion||(r.metodo+' '+r.ruta))}</td><td><span class="tag ${r.status<400?'ok':'no'}">${r.status}</span></td><td style="white-space:nowrap">${r.ms} ms</td></tr>`).join('')||'<tr><td colspan="4" class="hint">Sin pedidos.</td></tr>';
    modal(`<h3 style="margin-top:0">Uso de la clave</h3><p class="hint" style="margin-top:-6px"><b>${esc(u.clave.nombre)}</b> · <code>${esc(u.clave.prefijo||'')}</code> · ${esc(u.clave.rol)}</p>
      <div class="row" style="gap:18px;flex-wrap:wrap"><div><b>${u.total}</b> <span class="hint">pedidos</span></div><div><b>${u.errores}</b> <span class="hint">con error</span></div>
      <div><b>${u.denegados}</b> <span class="hint">sin permiso</span></div><div><b>${u.limitados}</b> <span class="hint">por límite</span></div>
      <div><b>${u.cuitsDistintos}</b> <span class="hint">CUITs</span></div><div><b>${u.latenciaMedia} ms</b> <span class="hint">promedio</span></div></div>
      ${barras}
      <h4>Por operación</h4><div style="max-height:180px;overflow:auto"><table><thead><tr><th>Operación</th><th>Pedidos</th><th>Errores</th><th>Latencia</th></tr></thead><tbody>${ops}</tbody></table></div>
      <h4>Últimos pedidos</h4><div style="max-height:200px;overflow:auto"><table><tbody>${ult}</tbody></table></div>
      <div class="row" style="margin-top:12px"><button class="primary" onclick="closeModal()">Cerrar</button></div>`);
  }catch(e){toast(e.message,true);}
}

function genAll(){
  const base=$('#g_base').value.replace(/\/$/,''),key=$('#g_key').value,m=$('#g_method').value,url=base+$('#g_path').value;
  let body=null;const raw=$('#g_body').value.trim();
  if(m==='POST'&&raw){try{body=JSON.parse(raw);}catch{body='__invalid__';}}
  const inv=body==='__invalid__';
  const blocks=[['n8n — copiá y pegá en el canvas',inv?'(JSON del body inválido)':genN8n(m,url,key,body)],
    ['cURL',inv?'(JSON del body inválido)':genCurl(m,url,key,body)],
    ['JavaScript (fetch)',inv?'(JSON del body inválido)':genJS(m,url,key,body)],
    ['Python (requests)',inv?'(JSON del body inválido)':genPy(m,url,key,body)]];
  $('#g_out').innerHTML=blocks.map((b,i)=>`<div class="card" style="margin-bottom:12px"><div class="row"><strong>${b[0]}</strong><button class="ghost" style="margin-left:auto" onclick="copyBlock(${i})">Copiar</button></div><pre id="gb${i}">${esc(b[1])}</pre></div>`).join('');
}
// Escape HTML completo (texto y valores de atributo). Todo dato que venga de la API pasa por aca.
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
// Argumento de texto para un manejador inline (onclick="f(${jsA(x)})"): literal JS escapado para el atributo.
function jsA(v){return esc(JSON.stringify(String(v==null?'':v)));}
function copyBlock(i){navigator.clipboard.writeText($('#gb'+i).textContent);toast('Copiado');}
function genCurl(m,url,key,body){let s=`curl -X ${m} "${url}" \\\n  -H "X-API-Key: ${key}"`;if(body){s+=` \\\n  -H "Content-Type: application/json" \\\n  -d '${JSON.stringify(body)}'`;}return s;}
function genJS(m,url,key,body){return `const res = await fetch(${JSON.stringify(url)}, {\n  method: ${JSON.stringify(m)},\n  headers: {\n    "X-API-Key": ${JSON.stringify(key)}${body?',\n    "Content-Type": "application/json"':''}\n  }${body?`,\n  body: JSON.stringify(${JSON.stringify(body,null,2)})`:''}\n});\nconst data = await res.json();\nconsole.log(data);`;}
function genPy(m,url,key,body){return `import requests\n\nr = requests.${m.toLowerCase()}(\n    ${JSON.stringify(url)},\n    headers={"X-API-Key": ${JSON.stringify(key)}}${body?`,\n    json=${pyLit(body,1)}`:''},\n)\nprint(r.json())`;}
function pyLit(v,ind){const pad='    '.repeat(ind),pad0='    '.repeat(ind-1);
  if(v===null)return 'None';if(v===true)return 'True';if(v===false)return 'False';
  if(typeof v==='number')return String(v);if(typeof v==='string')return JSON.stringify(v);
  if(Array.isArray(v)){return v.length?'[\n'+v.map(x=>pad+pyLit(x,ind+1)).join(',\n')+'\n'+pad0+']':'[]';}
  const ks=Object.keys(v);return ks.length?'{\n'+ks.map(k=>pad+JSON.stringify(k)+': '+pyLit(v[k],ind+1)).join(',\n')+'\n'+pad0+'}':'{}';}
function genN8n(m,url,key,body){
  const hasB=m==='POST'&&body;
  const node={parameters:{method:m,url:url,sendHeaders:true,headerParameters:{parameters:[{name:'X-API-Key',value:key}]},...(hasB?{sendBody:true,specifyBody:'json',jsonBody:JSON.stringify(body,null,2)}:{}),options:{}},
    id:'arcanum-http-1',name:'Arcanum',type:'n8n-nodes-base.httpRequest',typeVersion:4.2,position:[680,300]};
  return JSON.stringify({nodes:[node],connections:{}},null,2);
}

async function suiteCargar(){
  try{SUITE.apps=(await api('/api/suite/apps')).apps||[];}catch{SUITE.apps=[];}

  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  $('#appmenu').innerHTML=`
   <div class="menu-user">${esc(ME.username)} · ${esc(ME.role)}</div>
   <div class="menu-sep"></div>
   <button class="menu-item" onclick="toggleTheme();renderMenu()">${dark?I_SUN:I_MOON}<span>${dark?'Tema claro':'Tema oscuro'}</span></button>
   ${admin?`<div class="menu-sec"><div class="menu-h">Entorno ARCA</div>
     <div class="menu-row"><span>Operar contra</span>
       <select id="m_env" onchange="cambiarEntorno(this.value)">
         <option value="homo"${cfg.entorno==='homo'?' selected':''}>Homologación</option>
         <option value="prod"${cfg.entorno==='prod'?' selected':''}>Producción</option>
       </select></div>
     <div class="hint" style="padding:2px 12px 6px">Cambia los endpoints de ARCA para toda la instancia.</div></div>`:''}
   ${ME.role==='superadmin'?`<button class="menu-item" onclick="ajustesMc()">${I_GEAR}<span>Fisherboy y Mis Comprobantes</span></button><button class="menu-item" onclick="ajustesFactorum()">${I_GEAR}<span>Factorum (facturas recibidas)</span></button><button class="menu-item" onclick="ajustesSuite()">${I_GEAR}<span>Suite Escriba (pase entre apps)</span></button><button class="menu-item" onclick="verBackups()">${I_GEAR}<span>Backups y master key</span></button>`:''}
   ${ME.origen==='local'?`<button class="menu-item" onclick="cambiarClave(false)">${I_GEAR}<span>Cambiar contraseña</span></button>`:''}
   <button class="menu-item" onclick="novedadesTodas()">${I_NEWS}<span>Novedades</span></button>
   <button class="menu-item" onclick="acercaDe()">${I_INFO}<span>Acerca de Arcanum</span></button>
   <div class="menu-sep"></div>
   <button class="menu-item" onclick="logout()">${I_LOGOUT}<span>Cerrar sesión</span></button>`;
}
async function acercaDe(){
  $('#appmenu').classList.remove('open');
  let cfg={entorno:ENV||'?',version:'?'};
  try{ cfg=await api('/api/config'); }catch{}
  const env=String(cfg.entorno).toUpperCase();
  modal(`<button class="modal-x" type="button" aria-label="Cerrar" onclick="closeModal()">&times;</button>
   <h3 class="modal-tit">Arcanum</h3>
   <p class="modal-cuerpo">Gateway REST self-hosted para los Web Services de ARCA (ex-AFIP). Firma WSAA 100% local.</p>
   <dl class="about-rows">
     <dt>Versión</dt><dd>v${esc(cfg.version)} · <button class="linkbtn" type="button" onclick="novedadesTodas()">Qué cambió</button></dd>
     <dt>Usuario</dt><dd>${esc(ME.username)} (${esc(ME.role)})</dd>
     <dt>Entorno</dt><dd><span class="tag ${cfg.entorno==='prod'?'warn':''}">${env}</span></dd>
     <dt>Rol en la suite</dt><dd>Gateway</dd>
   </dl>
   <p class="about-foot">Diego Parras · Ecosistema Escriba</p>`);
}
async function cambiarEntorno(v){
  if(!await confirmar({titulo:'Cambiar el entorno de ARCA a '+v.toUpperCase(),texto:v==='prod'?'Afecta a toda la instancia: desde ahora se emiten comprobantes reales.':'Afecta a toda la instancia: desde ahora todo va al entorno de homologación.',si:'Cambiar a '+v.toUpperCase(),tono:'aviso'})){renderMenu();return;}
  try{ await api('/api/config/entorno',{method:'POST',body:JSON.stringify({entorno:v})}); toast('Entorno: '+v.toUpperCase()); location.reload(); }
  catch(e){ toast(e.message,true); renderMenu(); }
}
document.addEventListener('click',e=>{const m=$('#appmenu'),b=$('#menuBtn');if(m&&m.classList.contains('open')&&!m.contains(e.target)&&b&&!b.contains(e.target))m.classList.remove('open');});

setThemeIcon();
boot();
</script>
</body>
</html>
