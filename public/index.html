<script>(function(){try{var t=localStorage.arcanumTheme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);if(localStorage.getItem('arcanum.nav')==='min')document.documentElement.setAttribute('data-nav','min');}catch(e){}})();</script>
<!-- Fuentes vendorizadas (sin CDN, por CSP y privacidad) -->
<style>
  @font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;
    src:url("./vendor/fonts/inter-var-latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;
    src:url("./vendor/fonts/inter-var-latin-ext.woff2") format("woff2");
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;font-display:swap;

    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2074,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD;}

<!-- Sistema de diseño Escriba (canonico) — PRIMERO; lo propio de Arcanum va despues -->
<link rel="stylesheet" href="./escriba-ui.css">
<style>
  /* ===== Acento Arcanum (lo unico que cambia por app) ===== */
  :root{ --accent:#27408b; --accent-2:#1d3168; --on-accent:#fff; --ring:0 0 0 3px rgba(39,64,139,.20);
    --field-rest:#eef0f3; --field-bg:#e9f1fd; --field-border:#bcd3f2; }
  :root[data-theme="dark"]{ --accent:#6b8bd6; --accent-2:#27408b; --ring:0 0 0 3px rgba(107,139,214,.26);
    --field-rest:rgba(255,255,255,.05); --field-bg:rgba(107,139,214,.15); --field-border:rgba(107,139,214,.34); }
  /* Campos en gris muy claro por defecto; al enfocar pasan a celeste con borde azul. */
  input,textarea,select{ background-color:var(--field-rest); }
  input:focus,textarea:focus,select:focus{ background-color:var(--field-bg); border-color:var(--field-border); }
  /* Lista de checkboxes (reemplaza al multi-select nativo). */
  .chklist{ background-color:var(--field-rest); border:1px solid var(--line); border-radius:10px; padding:6px; max-height:150px; overflow:auto; display:flex; flex-direction:column; gap:2px; }
  .chk{ display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:14px; }
  .chk:hover{ background:rgba(39,64,139,.07); }
  .chk input{ width:16px; height:16px; margin:0; padding:0; accent-color:var(--accent); background:none; border:none; cursor:pointer; }
  /* Alias heredados del CSS propio de Arcanum, mapeados a tokens canonicos */
  :root{ --ink:var(--text); --line:var(--border); --chip:var(--card); --radius:14px;
    --header-bg:var(--panel); --accent-ink:var(--accent); --accent-contrast:var(--on-accent);
    --bad:var(--err); --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif; }
  /* El h2 de Arcanum es un encabezado de seccion (mayusculas); el del login-card es el titulo. */
  .login-card h2{ text-transform:none; letter-spacing:-.01em; color:var(--text); }

  html,body{transition:background-color .2s ease,color .2s ease}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  a{color:var(--accent-ink)}
  /* Sin linea inferior: header y panel lateral son una sola superficie (ver .esc-shell). */
  header{position:sticky;top:0;background:var(--header-bg);z-index:10}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  .bar{display:flex;align-items:center;gap:16px;padding:13px 0}
  .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--mono)}
  .bar h1{font-size:16px;margin:0;font-weight:650}
  /* Navegacion lateral: componente .sidenav del CSS canonico (escriba-ui.css). Aca solo el topbar. */
  /* Header con aire: 18px arriba y abajo. --top-h es su alto (34 del boton + 36), del que
     dependen el panel lateral pegajoso y la esquina curva; si cambia uno, cambia el otro. */
  :root{--top-h:70px}
  .bar.topbar{padding:18px 26px;gap:18px}
  .topbar .crumb{margin-left:-4px}
  .navbtn{margin-left:-4px}
  .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .env{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--accent-ink)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
  button.primary:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent)}
  button{font-family:var(--sans);font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:9px;cursor:pointer}
  button:hover{box-shadow:var(--shadow);background:var(--chip);border-color:var(--line);color:var(--ink)}
  button.ghost{border:none;color:var(--accent-ink);padding:6px 9px;display:inline-flex;align-items:center;gap:5px}
  button.ghost svg,nav button svg{width:16px;height:16px}
  /* Botones de icono del header (rayitas y kebab): planos, sin recuadro. */
  .mc-avance{margin:10px 0 0;font-size:13px;color:var(--text)}
  /* Analisis de Mis Comprobantes: emitidos con el acento, recibidos con una segunda serie. */
  :root{--serie2:#b45309} :root[data-theme="dark"]{--serie2:#e0a34a}
  .mca-filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .mca-filtros select,.mca-filtros input{width:auto}
  .mca-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .mca-seg button{border:0;border-radius:0;padding:7px 12px}
  .mca-seg button.on{background:var(--accent);color:var(--on-accent)}
  .mca-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .mca-chip{font-size:12px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--field-bg);border:1px solid var(--field-border);display:inline-flex;align-items:center;gap:2px}
  .mca-chip button{border:0;background:none;padding:0 6px;font-size:15px;line-height:1;color:var(--muted);cursor:pointer}
  .mca-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
  .mca-kpi{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
  .mca-kpi:hover{border-color:var(--accent)}
  .mca-kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .mca-kpi .val{font-size:20px;font-weight:650;font-family:var(--mono);margin-top:4px}
  .mca-kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .mca-meses{display:flex;align-items:flex-end;gap:6px;height:170px;border-bottom:1px solid var(--line);margin-top:10px}
  .mca-mes{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;background:none;border:0;padding:0;cursor:pointer;border-radius:6px 6px 0 0}
  .mca-mes:hover{background:var(--card)}
  .mca-mes i{display:block;width:40%;max-width:18px;border-radius:4px 4px 0 0}
  .mca-e{background:var(--accent)} .mca-r{background:var(--serie2)}
  .mca-ejes{display:flex;gap:6px;margin-top:6px} .mca-ejes span{flex:1;text-align:center;font-size:11px;color:var(--muted);font-family:var(--mono)}
  .mca-ley{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)} .mca-ley i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .mca-top button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;width:100%;background:none;border:0;padding:6px 6px;text-align:left;cursor:pointer;border-radius:8px;font:inherit;color:inherit}
  .mca-top button:hover{background:var(--card)}
  .mca-top .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .mca-top .m{font-family:var(--mono);font-size:12.5px}
  .mca-top .b{grid-column:1/-1;height:6px;border-radius:3px;background:var(--card)} .mca-top .b i{display:block;height:100%;border-radius:3px}
  .mca-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
  .mca-2 > .card{min-width:0}
  tr.mca-click{cursor:pointer} tr.mca-click:hover td{background:var(--card)}
  tr.mca-grupo td{font-weight:600;background:var(--card)}
  .mca-tog{background:none;border:0;padding:0 6px 0 0;cursor:pointer;color:var(--muted);font:inherit}
  .mca-tog svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
  /* Analisis: cada tarjeta con titulo se pliega tocando el titulo (se recuerda en el navegador). */
  .mca-pleg{cursor:pointer;user-select:none}
  .card.plegada > :not(.mca-cab){display:none !important}
  .card.plegada .mca-cab{margin:0 !important}
  .card.plegada[data-pleg-ext]{display:none !important}
  .card.plegada{align-self:start}
  .mca-link{background:none;border:0;padding:0;cursor:pointer;color:var(--accent-ink);font:inherit;font-weight:600}
  @media(max-width:760px){.mca-2{grid-template-columns:minmax(0,1fr)} .mca-meses{gap:2px}}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;transition:color .15s,background-color .15s}
  .iconbtn:hover{color:var(--ink);background:var(--card);border-color:transparent;box-shadow:none}
  .iconbtn:focus-visible{outline:none;box-shadow:var(--ring)}
  .iconbtn svg{display:block;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .menu{position:absolute;right:0;top:42px;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:30}
  .menu.open{display:block}
  .menu-sec{padding:6px 0;border-bottom:1px solid var(--line)} .menu-sec:last-child{border-bottom:none}
  .menu-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:4px 12px}
  .menu-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 12px;font-size:14px}
  .menu-row select{width:auto;padding:5px 8px}
  .menu-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;padding:8px 12px;border-radius:8px;color:var(--ink);font-size:14px;cursor:pointer;text-align:left}
  .menu-item:hover{background:var(--chip)} .menu-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* Selector de la suite Escriba (grilla): las otras apps conectadas, a un clic y sin loguearse. */
  .suite-wrap{position:relative;display:inline-flex}
  .suite-wrap .menu{top:42px;width:260px}
  .menu-item[disabled]{opacity:.55;cursor:default} .menu-item[disabled]:hover{background:none}
  .suite-app{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:#0f766e;color:#fff;font-size:12px;font-weight:700;flex:0 0 auto}
  .menu-item .suite-txt{display:flex;flex-direction:column;line-height:1.25}
  .menu-item .suite-txt small{color:var(--muted);font-size:12px}
  .login-msg{margin:0;padding:9px 11px;border-radius:9px;font-size:13px;line-height:1.4;text-align:left;background:rgba(220,38,38,.08);color:var(--err,#b91c1c);border:1px solid rgba(220,38,38,.25)}
  .pwwrap{position:relative} .pwwrap input{padding-right:38px}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;color:var(--muted);cursor:pointer;background:none;border:none}
  .eye:hover{color:var(--ink)} .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* main tambien es .wrap: el padding va con los dos selectores, si no .wrap (padding:0 20px)
     lo pisa y el contenido queda pegado al header. */
  main.wrap{padding:28px 20px 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .stat .val{font-size:26px;font-weight:680;margin-top:6px;font-family:var(--mono)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.idle{background:#cabfa9}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:30px 0 12px}
  h3{font-size:15px;margin:16px 0 10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .acciones{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
  .nw,.tag{white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:560;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td.mono,.mono{font-family:var(--mono)}
  input,select,textarea{font-family:var(--sans);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background-color:var(--field-rest);width:100%}
  /* La flecha del desplegable (escriba-ui.css) va a 11px del borde: el texto no puede llegar hasta ahi. */
  select{padding-right:32px}
  textarea{font-family:var(--mono);font-size:12px;min-height:120px}
  label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--accent-ink)}
  .tag.rich,.tag.ok{background:var(--chip);color:var(--ok)} .tag.no{background:var(--chip);color:var(--bad)} .tag.warn{background:var(--chip);color:var(--warn)}
  .svc{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;background:var(--panel)}
  .svc .top{display:flex;align-items:center;gap:10px}
  .pasos{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:none}
  .pasos.open{display:block}.pasos ol{margin:0;padding-left:20px}.pasos li{margin:5px 0}
  .rel{font-family:var(--mono);background:var(--chip);padding:2px 6px;border-radius:6px}
  .bars{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:8px;border-bottom:1px solid var(--line)}
  .bars .b{flex:1;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85}
  .bars-eje{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .muted{color:var(--muted)} .hint{color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0c0e13;color:#f3f5f9;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;box-shadow:var(--shadow)}
  .toast.show{opacity:1}.toast.bad{background:var(--bad)}
  .hidden{display:none}
  pre{background:#1c1a17;color:#f0ebe1;padding:12px;border-radius:10px;overflow:auto;font-family:var(--mono);font-size:11.5px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:20;padding:20px}
  .modal.open{display:grid}.modal .card{position:relative;max-width:620px;width:100%;max-height:85vh;overflow:auto}
  /* Confirmacion: modal-card del canonico, apilada arriba de .modal. Tono por data-tono. */
  .conf-back{z-index:140}.conf-back[hidden]{display:none}
  .conf-card{width:min(420px,94vw);padding:24px 24px 20px}
  .conf-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;
    background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent-ink)}
  .conf-ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .conf-card[data-tono="peligro"] .conf-ico{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err)}
  .conf-card[data-tono="aviso"] .conf-ico{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .conf-card .modal-tit{text-transform:none;letter-spacing:-.01em;color:var(--ink);padding-right:0}
  .conf-card .modal-cuerpo{color:var(--muted)}
  .conf-card .modal-acciones{margin-top:22px}
  .conf-card[data-tono="peligro"] #conf_si{background:var(--err);border-color:var(--err);color:#fff}
  .conf-card[data-tono="peligro"] #conf_si:hover{filter:brightness(.92)}
  @media (max-width:480px){.conf-card .modal-acciones{flex-direction:column-reverse}.conf-card .modal-acciones button{width:100%}}
  .nov-ver{margin:14px 0 4px;display:flex;align-items:baseline;gap:10px}
  .nov-ver b{font-family:var(--mono);font-size:14px}.nov-ver span{color:var(--muted);font-size:12.5px}
  .nov-sec{margin:8px 0 2px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .nov-list{margin:2px 0 6px;padding-left:18px;font-size:13.5px;line-height:1.5}
  .nov-list li{margin:3px 0}.nov-list code{font-family:var(--mono);font-size:12px}
  /* Facturas recibidas (Factorum): veredicto con borde de color y barra de progreso del lote. */
  .fa-ver{border-left:4px solid var(--muted)} .fa-ver.ok{border-left-color:var(--ok)} .fa-ver.no{border-left-color:var(--bad)} .fa-ver.warn{border-left-color:var(--warn)}
  .fa-ver .tag{font-size:12px;padding:3px 9px}
  .fa-prog{height:6px;border-radius:999px;background:var(--chip);overflow:hidden;margin-bottom:4px}
  .fa-prog div{height:100%;background:var(--accent)}
  .linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
  /* Responsive: el menú nunca se sale de pantalla; en angosto la navegacion es un cajon
     que se abre encima del contenido (topbar = rayitas + logo + kebab). */
  .menu{max-width:calc(100vw - 24px)}
  @media(max-width:760px){
    .wrap{padding:0 14px}
    main.wrap{padding:18px 14px 60px}
    :root{--top-h:62px}
    .bar.topbar{padding:14px 14px;gap:12px}
  }
</style>
</head>
<body>

<div id="loginView" class="login-overlay hidden">
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M12 56 L12 26 A20 20 0 0 1 52 26 L52 56 L43 56 L43 26 A11 11 0 0 0 21 26 L21 56 Z"/><rect x="21" y="41" width="22" height="6" rx="1" fill="#fff"/></svg></div>
    <h2>Arcanum</h2>
    <p class="login-sub">Gateway ARCA — Escriba Suite</p>
    <p class="login-msg hidden" id="loginMsg" role="alert"></p>
    <input id="lu" autocomplete="username" placeholder="Usuario">
    <div class="pwwrap"><input id="lp" type="password" autocomplete="current-password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()"><button class="eye" type="button" tabindex="-1" aria-label="Mostrar u ocultar contraseña" onclick="togglePw('lp',this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>

</div>

  <div class="logo"><svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M12 56 L12 26 A20 20 0 0 1 52 26 L52 56 L43 56 L43 26 A11 11 0 0 0 21 26 L21 56 Z"/><rect x="21" y="41" width="22" height="6" rx="1" fill="#fff"/></svg></div><h1>Arcanum</h1>

      <button class="iconbtn" id="suiteBtn" type="button" onclick="toggleSuite()" aria-label="Apps de la suite Escriba" title="Apps de la suite Escriba" aria-haspopup="true" aria-expanded="false" aria-controls="suitemenu"><svg viewBox="0 0 24 24" aria-hidden="true" style="fill:currentColor;stroke:none"><rect x="3.5" y="3.5" width="4.4" height="4.4" rx="1.2"/><rect x="9.8" y="3.5" width="4.4" height="4.4" rx="1.2"/><rect x="16.1" y="3.5" width="4.4" height="4.4" rx="1.2"/><rect x="3.5" y="9.8" width="4.4" height="4.4" rx="1.2"/><rect x="9.8" y="9.8" width="4.4" height="4.4" rx="1.2"/><rect x="16.1" y="9.8" width="4.4" height="4.4" rx="1.2"/><rect x="3.5" y="16.1" width="4.4" height="4.4" rx="1.2"/><rect x="9.8" y="16.1" width="4.4" height="4.4" rx="1.2"/><rect x="16.1" y="16.1" width="4.4" height="4.4" rx="1.2"/></svg></button>

<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<!-- Confirmacion propia (reemplaza a confirm() del navegador): se apila sobre cualquier modal abierto. -->
<div class="modal-back conf-back" id="conf" hidden>
  <div class="modal-card conf-card" role="alertdialog" aria-modal="true" aria-labelledby="conf_t" aria-describedby="conf_c">
    <div class="conf-ico" id="conf_ico" aria-hidden="true"></div>
    <h3 class="modal-tit" id="conf_t"></h3>
    <div class="modal-cuerpo" id="conf_c"></div>
    <div class="modal-acciones"><button type="button" id="conf_no">Cancelar</button><button type="button" class="primary" id="conf_si">Aceptar</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=(s,e=document)=>e.querySelector(s);
let ME=null, ENV='—', FUNC={};
async function api(path,opts={}){
  const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});
  const ct=r.headers.get('content-type')||'';
  const j=ct.includes('json')?await r.json().catch(()=>({})):{};
  if(r.status===401){showLogin();throw new Error('401');}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');setTimeout(()=>t.className='toast',2600);}
function modal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('open');}
function closeModal(){if($('#modal').dataset.fijo)return;$('#modal').classList.remove('open');}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
/* confirmar({titulo, texto, si, no, tono}) -> Promise<boolean>. tono: 'info' | 'aviso' | 'peligro'.
   Esc, clic afuera o Cancelar = false. En 'peligro' el foco arranca en Cancelar. texto se escapa. */
const CONF_ICO={
  info:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  aviso:'<svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>',
  peligro:'<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>'};
function confirmar({titulo,texto='',si='Aceptar',no='Cancelar',tono='info'}={}){
  return new Promise(resolve=>{
    const back=$('#conf'),card=back.firstElementChild,bSi=$('#conf_si'),bNo=$('#conf_no'),previo=document.activeElement;
    card.dataset.tono=tono;$('#conf_ico').innerHTML=CONF_ICO[tono]||CONF_ICO.info;
    $('#conf_t').textContent=titulo;$('#conf_c').innerHTML=String(texto).split('\n').map(p=>`<p>${esc(p)}</p>`).join('');
    bSi.textContent=si;bNo.textContent=no;back.hidden=false;
    const fin=v=>{back.hidden=true;removeEventListener('keydown',tecla,true);bSi.onclick=bNo.onclick=back.onclick=null;if(previo&&previo.focus)previo.focus();resolve(v);};
    function tecla(e){
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();fin(false);}
      else if(e.key==='Tab'){e.preventDefault();(document.activeElement===bSi?bNo:bSi).focus();}
    }
    addEventListener('keydown',tecla,true);
    bSi.onclick=()=>fin(true);bNo.onclick=()=>fin(false);back.onclick=e=>{if(e.target===back)fin(false);};
    (tono==='peligro'?bNo:bSi).focus();
  });
}

// Pase de la suite que no sirvio (GET /suite/entrar redirige a /?suite=pase-vencido): se toma el
// aviso y se limpia la direccion para que no quede al recargar.
let SUITE_AVISO=null;
(function(){try{const p=new URLSearchParams(location.search);if(p.get('suite')==='pase-vencido'){SUITE_AVISO='El pase para entrar venció o ya se usó. Volvé a tocar el botón en la otra app.';history.replaceState(null,'','/'+location.hash);}}catch(e){}})();
function showLogin(){$('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden');
  const lm=$('#loginMsg');if(lm){lm.textContent=SUITE_AVISO||'';lm.classList.toggle('hidden',!SUITE_AVISO);}
  fetch('/api/auth/config').then(r=>r.json()).then(c=>{
    $('#oidcBtn').innerHTML=c.oidc?'<a class="login-sso" href="/api/auth/oidc/login">Entrar con Lockatus</a>':'';
    // Federado (ssoOnly): se entra SOLO por Lockatus → ocultamos el login local.
    const card=$('#loginView .login-card'), sso=!!c.ssoOnly;
    $('#lu').classList.toggle('hidden',sso);
    $('#lp').closest('.pwwrap').classList.toggle('hidden',sso);
    card.querySelector('button.primary').classList.toggle('hidden',sso);
    card.querySelector('.login-sub').textContent=sso?'Acceso unificado de la Suite Escriba':'Gateway ARCA — Escriba Suite';
  }).catch(()=>{});}
async function doLogin(){
  try{ await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});
    SUITE_AVISO=null; await boot(); }catch(e){ toast(e.message==='401'?'Usuario o contraseña inválidos':e.message,true); }
}
async function logout(){ await fetch('/api/auth/logout',{method:'POST',credentials:'include'}); delete $('#modal').dataset.fijo; closeModal(); showLogin(); }

/* ---------- NAVEGACION: panel lateral agrupado, se achica a iconos ---------- */
const NI=d=>`<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const NAV_ICON={
  panel:NI('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
  emitir:NI('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>'),
  facturador:NI('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>'),
  comprobantes:NI('<path d="M15 3H9a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7z"/><path d="M15 3v4h4"/><path d="M5 7v12a2 2 0 0 0 2 2h8"/>'),
  contingencia:NI('<path d="M12 4 3 20h18z"/><path d="M12 10v4M12 17h.01"/>'),
  clientes:NI('<circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6 6 0 0 1 3 5.5"/>'),
  mis:NI('<path d="M7 18a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 9.5a4 4 0 0 1 0 8.5"/><path d="M12 11v9M9 17l3 3 3-3"/>'),
  analisis:NI('<path d="M4 20h16"/><rect x="5" y="12" width="3.2" height="6" rx="1"/><rect x="10.4" y="6" width="3.2" height="12" rx="1"/><rect x="15.8" y="9" width="3.2" height="9" rx="1"/>'),
  recibidas:NI('<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="m9.5 14 2 2 3.5-4"/>'),
  servicios:NI('<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/>'),
  generador:NI('<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>'),
  webhooks:NI('<path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/>'),
  usuarios:NI('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
};
const NAV=[
  [null,[['panel','Panel']]],
  ['Facturar',[['emitir','Emitir'],['facturador','Facturador'],['comprobantes','Comprobantes'],['contingencia','Contingencia']]],
  ['ARCA',[['clientes','Clientes'],['mis','Mis Comprobantes'],['analisis','Análisis'],['recibidas','Facturas recibidas'],['servicios','Servicios'],['generador','Generador']]],
  ['Administración',[['webhooks','Webhooks'],['usuarios','Usuarios']]],
];
const VIEWS=NAV.flatMap(g=>g[1]);
// Secciones que dependen de algo opcional: Mis Comprobantes necesita Fisherboy configurado, y
// Análisis aparece cuando hay comprobantes bajados.
function disponible(v){if(v==='mis')return !!FUNC.misComprobantes;if(v==='analisis')return !!FUNC.analisis;return true;}
function renderNav(cur){
  const admin=['superadmin','admin'].includes(ME.role);
  $('#nav').innerHTML=NAV.map(([grupo,items])=>{
    // "Facturas recibidas" solo si Factorum responde (ver faChequearSalud).
    const vis=items.filter(v=>disponible(v[0])&&(v[0]!=='usuarios'||admin)&&(v[0]!=='recibidas'||(FA.salud&&FA.salud.ok)||cur==='recibidas'));
    if(!vis.length)return '';
    return (grupo?`<div class="nav-g">${grupo}</div>`:'')+vis.map(v=>`<button type="button" class="nav-it${v[0]===cur?' active':''}" onclick="go('${v[0]}')" title="${v[1]}" aria-label="${v[1]}"${v[0]===cur?' aria-current="page"':''}>${NAV_ICON[v[0]]}<span>${v[1]}</span></button>`).join('');
  }).join('');
  const actual=VIEWS.find(v=>v[0]===cur);
  $('#crumb').textContent=actual?'/ '+actual[1]:'';
}
const navMovil=()=>matchMedia('(max-width:760px)').matches;
function syncNavBtn(){
  const abierto=navMovil()?document.documentElement.getAttribute('data-nav-movil')==='abierto':document.documentElement.getAttribute('data-nav')!=='min';
  $('#navBtn').setAttribute('aria-expanded',String(abierto));
}
function toggleNav(){
  const h=document.documentElement;
  if(navMovil()){
    if(h.getAttribute('data-nav-movil')==='abierto')h.removeAttribute('data-nav-movil');else h.setAttribute('data-nav-movil','abierto');
  }else{
    const min=h.getAttribute('data-nav')!=='min';
    if(min)h.setAttribute('data-nav','min');else h.removeAttribute('data-nav');
    try{localStorage.setItem('arcanum.nav',min?'min':'full');}catch(e){}
  }
  syncNavBtn();
}
function cerrarNavMovil(){document.documentElement.removeAttribute('data-nav-movil');syncNavBtn();}
function medirTopbar(){const h=document.querySelector('#appView header');if(h&&h.offsetHeight)document.documentElement.style.setProperty('--top-h',h.offsetHeight+'px');}
addEventListener('resize',()=>{medirTopbar();if(!navMovil())cerrarNavMovil();else syncNavBtn();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.documentElement.getAttribute('data-nav-movil')==='abierto')cerrarNavMovil();});
let VISTA='panel';
function go(v){if(!disponible(v))v='panel';if(navMovil())cerrarNavMovil();if(typeof mcPararTimers==='function')mcPararTimers();if(typeof faPararTimers==='function')faPararTimers();VISTA=v;renderNav(v);location.hash=v;const el=$('#view');if(el)el.innerHTML='<p class="hint">Cargando…</p>';({panel:vPanel,clientes:vClientes,servicios:vServicios,emitir:vEmitir,facturador:vFacturador,comprobantes:vComprobantes,mis:vMis,analisis:vAnalisis,recibidas:vRecibidas,contingencia:vContingencia,generador:vGenerador,webhooks:vWebhooks,usuarios:vUsuarios}[v]||vPanel)();if(v==='panel'||!['clientes','servicios','emitir','facturador','comprobantes','mis','analisis','recibidas','contingencia','generador','webhooks','usuarios'].includes(v))setTimeout(()=>{if(typeof avisoMasterKey==='function')avisoMasterKey();},600);}

async function boot(){
  try{ const me=await api('/api/auth/me'); ME=me.usuario; FUNC=me.funciones||{}; }catch(e){ showLogin(); return; }
  if(ME.debeCambiar){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');cambiarClave(true);return;}
  try{ const c=await api('/api/config'); ENV=c.entorno; }catch{}
  $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');
  medirTopbar();syncNavBtn();
  go((location.hash||'#panel').slice(1));
  faChequearSalud();
  suiteCargar();
  if(SUITE_AVISO){toast(SUITE_AVISO,true);SUITE_AVISO=null;}
  setTimeout(avisarNovedades,400);
}

/* ---------- NOVEDADES: que cambio en cada version (sale del CHANGELOG) ---------- */
const NOV_KEY='arcanum.versionVista';
function novMd(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function novHtml(versiones){
  return versiones.map(v=>`<div class="nov-ver"><b>v${novMd(v.version)}</b>${v.fecha?`<span>${novMd(v.fecha)}</span>`:''}</div>`+
    v.secciones.map(s=>`<div class="nov-sec">${novMd(s.titulo)}</div><ul class="nov-list">${s.items.map(i=>`<li>${novMd(i)}</li>`).join('')}</ul>`).join('')).join('');
}
function verNovedades(r,bajada){
  modal(`<button class="modal-x" type="button" aria-label="Cerrar" onclick="closeModal()">&times;</button>
   <h3 class="modal-tit">Novedades</h3>
   <p class="modal-cuerpo">${bajada}</p>
   ${r.versiones.length?novHtml(r.versiones):'<p class="hint">No hay notas para esta versión.</p>'}
   <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="primary" type="button" onclick="closeModal()">Entendido</button></div>`);
}
async function avisarNovedades(){
  let vista=null;try{vista=localStorage.getItem(NOV_KEY);}catch{}
  let r;try{r=await api('/api/novedades'+(vista?'?desde='+encodeURIComponent(vista):''));}catch{return;}
  try{localStorage.setItem(NOV_KEY,r.version);}catch{}
  if(vista===r.version||!r.versiones.length)return;
  if($('#modal').classList.contains('open'))return;
  verNovedades(r,`Arcanum se actualizó a la <b>v${novMd(r.version)}</b>. Esto cambió desde la última versión que viste:`);
}
async function novedadesTodas(){
  $('#appmenu').classList.remove('open');
  try{const r=await api('/api/novedades?todas=1');verNovedades({...r,versiones:r.versiones.slice(0,15)},`Versión instalada: <b>v${novMd(r.version)}</b>. Últimas versiones, de la más nueva a la más vieja:`);}
  catch(e){toast(e.message,true);}
}

/* ---------- PANEL ---------- */
async function vPanel(){
  const v=$('#view');v.innerHTML='<p class="hint">Cargando métricas…</p>';
  const {metricas:m}=await api('/api/metrics');
  // Una barra por dia (el server manda los 14, con 0 los dias sin emisiones). Un dia en 0 no
  // dibuja barra: queda la linea de base, asi un unico dia con datos no llena todo el grafico.
  const serie=m.emisiones.serie||[];
  const max=Math.max(1,...serie.map(s=>s.n));
  const ddmm=d=>String(d).slice(0,10).split('-').reverse().slice(0,2).join('/');
  const bars=serie.map(s=>`<div class="b" title="${ddmm(s.dia)}: ${s.n} ${s.n===1?'emisión':'emisiones'}" style="height:${s.n?Math.max(4,Math.round(s.n/max*100)):0}%"></div>`).join('');
  const sinEmisiones=!serie.some(s=>s.n);
  const grafico=serie.length?`<div class="bars">${bars}</div><div class="bars-eje"><span>${ddmm(serie[0].dia)}</span><span>${sinEmisiones?'Sin emisiones en estos 14 días':`Máximo: ${max} por día`}</span><span>${ddmm(serie[serie.length-1].dia)}</span></div>`:'<span class="hint">Sin datos de emisiones.</span>';
  const arca=m.arca.map(a=>`<tr><td>${esc(a.servicio)}</td><td><span class="dot ${a.ok?'ok':'bad'}"></span>${a.ok?'OK':'caído'}</td><td class="mono">${a.uptime24h??'—'}%</td><td class="mono">${a.latencia??'—'} ms</td></tr>`).join('')||'<tr><td colspan="4" class="hint">El monitor corre cada 5 min; esperá el primer chequeo.</td></tr>';
  v.innerHTML=`
   <div class="grid">
     <div class="card stat"><div class="label">Emisiones hoy</div><div class="val">${m.emisiones.hoy}</div></div>
     <div class="card stat"><div class="label">Monto hoy</div><div class="val" style="font-size:20px">$${m.emisiones.montoHoy.toLocaleString('es-AR')}</div></div>
     <div class="card stat"><div class="label">Tokens vigentes</div><div class="val">${m.tokensVigentes}</div></div>
     <div class="card stat"><div class="label">Certs por vencer</div><div class="val">${m.certificados.porVencer}</div></div>
     <div class="card stat"><div class="label">Peticiones 24h</div><div class="val">${m.peticiones24h.total}</div><div class="hint">${m.peticiones24h.errores} errores · ${m.peticiones24h.latenciaMedia}ms</div></div>
   </div>
   <h2>Emisiones (14 días)</h2><div class="card">${grafico}</div>
   <h2>Estado de ARCA</h2><div class="card"><table><thead><tr><th>Servicio</th><th>Estado</th><th>Uptime 24h</th><th>Latencia</th></tr></thead><tbody>${arca}</tbody></table></div>`;
}

/* ---------- CLIENTES ---------- */
async function vClientes(){
  const v=$('#view');
  const {tenants}=await api('/api/tenants');
  const rows=tenants.map(t=>{
    const cert=t.tieneCertificado?`<span class="tag ok">vigente${t.diasParaVencer!=null?' ('+t.diasParaVencer+'d)':''}</span>`:(t.tieneClave?'<span class="tag warn">falta certificado</span>':'<span class="tag no">sin clave</span>');
    return `<tr><td class="mono">${esc(t.cuit)}</td><td>${esc(t.nombre||'')}</td><td>${cert}</td>
      <td><div class="acciones">
       ${t.tieneClave?`<button class="ghost" onclick="verCsr(${jsA(t.cuit)})">CSR</button>`:''}
       <button class="ghost" onclick="pegarCert(${jsA(t.cuit)})">Pegar .crt</button>
       <button class="ghost" onclick="editarEmisor(${jsA(t.cuit)})">Datos fiscales</button>
      </div></td></tr>`;}).join('')||'<tr><td colspan="4" class="hint">No hay clientes. Creá el primero.</td></tr>';
  v.innerHTML=`<div class="row"><h2 style="margin:0">Clientes (${ENV})</h2>
    <button style="margin-left:auto" onclick="importarCert()">Importar certificado</button>
    <button class="primary" onclick="nuevoCliente()">Nuevo cliente</button></div>
    <div class="card" style="margin-top:12px"><table><thead><tr><th>CUIT</th><th>Nombre</th><th>Certificado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin-top:10px">Flujo: <strong>Nuevo cliente</strong> genera el CSR → lo subís a ARCA → descargás el .crt → <strong>Pegar .crt</strong>.</p>`;
}

async function traerEmisorDeArca(cuit){
  try{ const r=await api('/api/tenants/'+cuit+'/emisor/completar',{method:'POST',body:'{}'});
    if(r.error){ toast('ARCA no respondió: '+r.error,true); return; }
    const e=r.emisor||{};const set=(id,v)=>{const el=$(id);if(el&&!el.value&&v)el.value=v;};
    set('#em_rs',e.razonSocial);set('#em_dom',e.domicilio);if(!$('#em_civa').value&&e.condicionIva)$('#em_civa').value=e.condicionIva;
    $('#em_aviso').innerHTML=r.faltan&&r.faltan.length?`<p class="hint"><span class="tag warn">FALTAN</span> ${esc(r.faltan.map(f=>f.etiqueta).join(', '))}</p>`:'';
    toast(r.completados.length?'Completado desde ARCA: '+r.completados.length+' dato(s)':'No había nada para traer de ARCA');
  }catch(e){ toast(e.message,true); }
}
async function guardarEmisor(cuit){

async function vServicios(){
  const v=$('#view');const {servicios,categorias}=await api('/api/services');
  let tenants=[];try{tenants=(await api('/api/tenants')).tenants;}catch{}
  const admin=ME.role==='superadmin'; // el catalogo lo edita solo el superadmin (A-08)
  const cuitOpts=tenants.map(t=>`<option value="${esc(t.cuit)}">${esc(t.cuit)}${t.nombre?' — '+esc(t.nombre):''}</option>`).join('');
  let html=`<div class="row"><h2 style="margin:0">Servicios de ARCA (${servicios.length})</h2>
    <a href="https://www.afip.gob.ar/ws/documentacion/catalogo.asp" target="_blank" rel="noopener" style="margin-left:auto"><button class="ghost"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>Catálogo oficial de ARCA</button></a>
    ${admin?'<button class="primary" onclick="editarServicio()">Agregar servicio</button>':''}</div>
    <p class="hint">El catálogo se guarda en la base y ${admin?'lo podés editar acá':'lo edita un superadmin'}. Tocá "Cómo activar" para la guía, o "Verificar" para chequear si tu certificado quedó asociado.</p>
    ${cuitOpts?`<div class="row" style="margin:6px 0 4px"><span class="hint">Verificar con el CUIT:</span><select id="verif_cuit" style="max-width:280px">${cuitOpts}</select></div>`:'<p class="hint">Cargá un cliente para poder verificar la asociación.</p>'}`;
  const orden=['facturacion','consultas','agro','aduana','otros'];
  for(const cat of Object.keys(categorias).sort((a,b)=>orden.indexOf(a)-orden.indexOf(b))){
    html+=`<h3>${esc(catNombre(cat))}</h3>`;
    for(const id of categorias[cat]){const s=servicios.find(x=>x.id===id);if(!s)continue;
      const tag=s.rich?'<span class="tag rich">rico</span>':'<span class="tag">genérico</span>';
      const off=s.enabled===false?'<span class="tag no">deshabilitado</span>':'';
      const pasos=(s.activacion&&s.activacion.pasos||[]).map(p=>'<li>'+p+'</li>').join('');
      const rel=s.activacion&&s.activacion.relacionNombre?`<p class="hint">Servicio a asociar: <span class="rel">${esc(s.activacion.relacionNombre)}</span></p>`:'';
      html+=`<div class="svc"><div class="top">
        <div><div><strong>${esc(s.nombre)}</strong> ${tag} ${off}</div><div class="hint">${esc(s.descripcion||'')}</div></div>
        <div class="row" style="margin-left:auto">
          <button class="ghost" onclick="verificarServicio(${jsA(s.id)},this)">Verificar</button>
          <button class="ghost" onclick="this.closest('.svc').querySelector('.pasos').classList.toggle('open')">Cómo activar</button>
          ${admin?`<button class="ghost" onclick="editarServicio(${esc(JSON.stringify(s))})">Editar</button>`:''}
        </div></div>
        <div class="verif" style="font-size:13px;margin-top:6px"></div>
        <div class="pasos">${rel}<ol>${pasos}</ol>
          <p class="hint"><a target="_blank" href="https://serviciosweb.afip.gob.ar/clavefiscal/adminrel/main.aspx">Abrir Administrador de Relaciones</a>
          ${s.activacion&&/^https:\/\//i.test(s.activacion.docs||'')?` · <a target="_blank" rel="noopener" href="${esc(s.activacion.docs)}">documentación</a>`:''}</p></div></div>`;}
  }
  v.innerHTML=html;
}
async function verificarServicio(id,btn){
  const sel=$('#verif_cuit');const cuit=sel&&sel.value;
  if(!cuit){toast('Cargá un cliente primero',true);return;}
  const box=btn.closest('.svc').querySelector('.verif');
  box.innerHTML='<span class="hint">Verificando contra ARCA…</span>';
  try{ const r=await api('/api/services/'+id+'/verificar?cuit='+cuit);
    if(r.asociado) box.innerHTML=`<span class="tag ok">asociado</span> <span class="hint">CUIT ${cuit} · token vence ${(r.expira||'').slice(0,10)}</span>`;
    else box.innerHTML=`<span class="tag no">no asociado</span> <span class="hint">${esc((r.motivo||'').slice(0,180))}</span>`;
  }catch(e){box.innerHTML=`<span class="tag no">error</span> <span class="hint">${esc(e.message)}</span>`;}
}

const ALIC={5:21,4:10.5,6:5,3:27,9:0};
function recalc(){const neto=parseFloat($('#e_neto').value||0);const p=ALIC[$('#e_alic').value]||0;const iva=+(neto*p/100).toFixed(2);
  $('#e_iva').value=iva.toFixed(2);$('#e_total').value=(neto+iva).toFixed(2);}
function cuerpoEmision(){
  const neto=parseFloat($('#e_neto').value||0),iva=parseFloat($('#e_iva').value||0),tipo=+$('#e_tipo').value,alic=+$('#e_alic').value;
  const tipoC=[11,13].includes(tipo);
  const body={cuit:$('#e_cuit').value,puntoVenta:+$('#e_pv').value,tipoComprobante:tipo,concepto:+$('#e_concepto').value,
    tipoDocReceptor:+$('#e_doctipo').value,nroDocReceptor:$('#e_docnro').value,condicionIvaReceptor:+$('#e_condiva').value,
    importeNeto:tipoC?0:neto,importeIva:tipoC?0:iva,importeTotal:tipoC?neto+iva:neto+iva,
    alicuotasIva:tipoC?[]:[{id:alic,baseImponible:neto,importe:iva}],
    receptorNombre:$('#e_recnom').value.trim()||undefined,receptorDomicilio:$('#e_recdom').value.trim()||undefined,
    pdf:{modelo:$('#e_pdfmodelo').value,nombreArchivo:$('#e_pdfnombre').value.trim()||undefined},
    contingencia:$('#e_contingencia').checked};
  if(tipoC){body.importeNeto=+(neto+iva).toFixed(2);body.importeIva=0;body.importeTotal=+(neto+iva).toFixed(2);}
  // Clave de idempotencia por formulario: un doble clic o un reintento no saca dos CAE.
  if(!window._idemEmitir)window._idemEmitir='ui-'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  body.idempotencyKey=window._idemEmitir;
  return body;
}
function nombrePdfAyuda(){const v=$('#e_pdfnombre').value.trim();
  $('#e_pdfayuda').textContent=v?'Ejemplo: '+v.replace(/\{receptor\}/g,'CLIENTE SA').replace(/\{numero\}/g,'00000195').replace(/\{pv\}/g,'00001').replace(/\{letra\}/g,'C').replace(/\{tipo\}/g,'011').replace(/\{fecha\}/g,'2026-11-20').replace(/\{cuit\}/g,$('#e_cuit').value||'20111111112').replace(/\{total\}/g,'1000.00')+(/\.pdf$/i.test(v)?'':'.pdf'):'Vacío = el nombre de ARCA. Podés usar {receptor}, {numero}, {pv}, {letra}, {tipo}, {fecha}, {cuit} y {total}.';}
async function previsualizar(){
  $('#e_result').innerHTML='<p class="hint">Revisando con ARCA…</p>';
  try{const {vistaPrevia:p}=await api('/api/wsfev1/comprobantes/vista-previa',{method:'POST',body:JSON.stringify(cuerpoEmision())});
    const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join('');
    const pp=p.receptor&&p.receptor.padron;
    if(pp){ if(!$('#e_recnom').value&&pp.nombre&&pp.nombre!=='N/A')$('#e_recnom').value=pp.nombre; if(!$('#e_recdom').value&&pp.domicilio)$('#e_recdom').value=pp.domicilio; }
    const rec=p.receptor&&p.receptor.padron?`<tr><th>Receptor</th><td>${esc(p.receptor.padron.nombre||'')} <span class="hint">${esc(p.receptor.padron.condicionIVA||'')}</span></td></tr>`:'';
    $('#e_result').innerHTML=`<div class="card"><span class="tag ${p.valido?'ok':'no'}">${p.valido?'LISTO PARA EMITIR':'CON PROBLEMAS'}</span> <span class="hint">No se emitió nada.</span>
      <table style="margin-top:10px">${p.comprobante?`<tr><th>Comprobante</th><td class="mono">${esc(p.comprobante)}</td></tr>`:''}
      <tr><th>Fecha</th><td class="mono">${esc(p.fecha||'')}</td></tr><tr><th>Total</th><td class="mono">${mcaPlata(p.importes?p.importes.total:0)}</td></tr>${rec}
      ${p.letraSugerida?`<tr><th>Letra sugerida</th><td>${esc(p.letraSugerida)}</td></tr>`:''}</table>
      ${p.problemas.length?`<h4>Problemas</h4><ul>${li(p.problemas)}</ul>`:''}
      ${p.advertencias.length?`<h4>Advertencias</h4><ul class="hint">${li(p.advertencias)}</ul>`:''}
      ${p.numeroPropuesto?`<p class="hint">${esc(p.numeroNota)}</p>`:''}</div>`;
  }catch(e){$('#e_result').innerHTML=`<div class="card"><span class="tag no">ERROR</span><p>${esc(e.message)}</p></div>`;}
}
async function emitir(){
  const body=cuerpoEmision();
  $('#e_result').innerHTML='<p class="hint">Emitiendo…</p>';
  try{ const r=await api('/api/wsfev1/comprobantes',{method:'POST',body:JSON.stringify(body)});
    if(r.encolado){window._idemEmitir=null;
      $('#e_result').innerHTML=`<div class="card"><span class="tag warn">EN COLA</span> <span class="hint">${esc(r.mensaje||'')}</span>
        <p class="hint">Item ${esc(r.cola.id)}. Seguilo en la pestaña Contingencia.</p><button onclick="go('contingencia')">Ver la cola</button></div>`;
      toast('ARCA no responde: quedó en la cola');return;}
    const c=r.comprobante;
    window._idemEmitir=null; // el proximo comprobante lleva clave nueva
    $('#e_result').innerHTML=`<div class="card"><span class="tag ok">APROBADO</span>
      <table style="margin-top:10px"><tr><th>CAE</th><td class="mono">${esc(c.cae)}</td></tr>
      <tr><th>Vto CAE</th><td class="mono">${c.caeVencimiento}</td></tr>
      <tr><th>Comprobante</th><td class="mono">${Number(c.puntoVenta)||0}-${Number(c.numero)||0}</td></tr></table>

      <label class="chk" style="margin-top:10px"><input type="checkbox" id="mc_sync" ${c.sincronizar?'checked':''}> Sincronizar todos los días${hd} (desde lo último bajado)</label>${off}
      <div class="row" style="margin-top:10px"><button class="primary" onclick="mcGuardarClave()">Guardar</button>
      ${c.cargada?'<button onclick="mcBorrarClave()">Borrar clave</button>':''}</div>
      <p class="hint">Se guarda cifrada. Nunca se vuelve a mostrar ni queda en los registros.</p>`:'<p class="hint">Solo un administrador puede cargar o cambiar la clave fiscal.</p>'}`;
  }catch(e){$('#mc_cred').innerHTML=`<span class="tag no">ERROR</span> ${esc(e.message)}`;}

async function mcGuardarClave(){

async function mcBorrarClave(){

async function mcSincronizar(){
  try{const {corrida}=await api(`/api/mis-comprobantes/${MC.cuit}/sincronizar`,{method:'POST',body:JSON.stringify({tipo:$('#mc_tipo').value,desde:$('#mc_desde').value,hasta:$('#mc_hasta').value})});

/** Propone el rango de la próxima sincronización: la primera trae 12 meses; después, desde lo último bajado. */
async function mcRango(){
  if(!/^\d{11}$/.test(MC.cuit)||!$('#mc_rango'))return;
  try{const {rango:r}=await api(`/api/mis-comprobantes/${MC.cuit}/rango?tipo=${$('#mc_tipo').value}`);
    $('#mc_desde').value=r.desde;$('#mc_hasta').value=r.hasta;
    const f=d=>d?d.split('-').reverse().join('/'):'nunca';
    $('#mc_rango').textContent=r.primera
      ?`Primera sincronización: trae los últimos 12 meses. Si querés más historia, cambiá «Desde» (ARCA consulta de a 365 días y Arcanum divide el período solo).`
      :`Ya bajado: emitidos hasta ${f(r.cubierto.emitido)}, recibidos hasta ${f(r.cubierto.recibido)}. Arranca un poco antes de lo último bajado para tomar lo que ARCA muestra tarde; no se duplica nada.`;
  }catch{}
}
async function mcCorridas(retomar){
  try{const {corridas}=await api(`/api/mis-comprobantes/${MC.cuit}/corridas`);
    $('#mc_corridas').innerHTML=corridas.length?`<table><tr><th>#</th><th>Qué</th><th>Rango</th><th>Estado</th><th>Cantidad</th><th>Inicio</th><th>Detalle</th></tr>${corridas.map(c=>`<tr>
      <td class="mono">${Number(c.id)}</td><td>${esc(c.tipo)}</td><td class="mono">${String(c.desde).slice(0,10)} a ${String(c.hasta).slice(0,10)}</td>
      <td><span class="tag ${c.estado==='terminado'?'ok':c.estado==='error'?'no':'warn'}">${esc(MC_ESTADO[c.estado]||c.estado)}</span></td>
      <td class="mono">${c.cantidad}</td><td class="hint">${new Date(c.iniciada_at).toLocaleString('es-AR')}</td>
      <td class="hint">${esc(c.error||mcAvance(c,true))}${MC_VIVOS.includes(c.estado)?` <button class="ghost" onclick="mcSeguir(${Number(c.id)})">Ver en vivo</button> <button class="ghost" onclick="mcCancelar(${Number(c.id)})">Cancelar</button>`:''}${c.tiene_captura?` <button class="ghost" onclick="mcCaptura(${Number(c.id)})">Ver pantalla</button>`:''}</td></tr>`).join('')}</table>`:'<p class="hint">Todavía no se sincronizó este CUIT.</p>';
    const viva=corridas.find(c=>MC_VIVOS.includes(c.estado));
    if(retomar&&viva)mcSeguir(viva.id);
  }catch(e){$('#mc_corridas').innerHTML=`<p class="hint">${esc(e.message)}</p>`;}
}
async function mcCancelar(id){
  if(!await confirmar({titulo:'Cancelar la sincronización',texto:'Se cierra la sesión del navegador en ARCA. Lo que ya se bajó queda guardado.',si:'Cancelar sincronización',no:'Seguir',tono:'aviso'}))return;
  try{await api(`/api/mis-comprobantes/corridas/${Number(id)}/cancelar`,{method:'POST'});toast('Se cancela en unos segundos');}catch(e){toast(e.message,true);}
}
async function mcCaptura(id){
  try{const r=await fetch(`/api/mis-comprobantes/corridas/${id}/captura`,{credentials:'include'});
    if(!r.ok)throw new Error('Esta corrida no tiene pantalla guardada');
    const url=URL.createObjectURL(await r.blob());
    modal(`<button class="modal-x" type="button" aria-label="Cerrar" onclick="closeModal()">&times;</button><h3 style="text-transform:none">Pantalla del robot al fallar · corrida ${id}</h3>
      <p class="hint">Lo último que vio el navegador de Fisherboy antes de cortar la sesión.</p>
      <img src="${url}" alt="Pantalla de ARCA al fallar la corrida ${id}" style="display:block;width:100%;max-width:100%;height:auto;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;margin-top:8px">`);
  }catch(e){toast(e.message,true);}
}
function mcHace(iso){const s=Math.max(0,Math.round((Date.now()-new Date(iso))/1000));return s<60?`${s} s`:`${Math.floor(s/60)} min ${s%60} s`;}
function mcAvance(c,corto){const p=c&&c.progreso;if(!p||!MC_VIVOS.includes(c.estado))return '';
  const tipo=p.tipo==='recibido'?'Recibidos':p.tipo==='emitido'?'Emitidos':'';
  const ia=p.ia>0?` · el paso falló y la IA lo está reintentando (${p.ia} ${p.ia===1?'acción':'acciones'})`:'';
  return `${tipo?tipo+' · ':''}Paso ${p.paso} de ${p.total}: ${p.descripcion||'—'}${ia}${corto?'':` · último avance hace ${p.avance?mcHace(p.avance):'—'}`}`;}
function mcSeguir(id){
  mcPararTimers();MC.corrida=id;MC.seq=0;$('#mc_vivo').classList.remove('hidden');
  const paso=async()=>{
    if(!$('#mc_vivo')){mcPararTimers();return;}
    try{const {corrida:c}=await api(`/api/mis-comprobantes/corridas/${id}`);
      const t=$('#mc_vivo_estado');t.textContent=MC_ESTADO[c.estado]||c.estado;t.className='tag '+(c.estado==='terminado'?'ok':c.estado==='error'?'no':'warn');
      const humano=c.estado==='humano'||c.estado==='esperando_humano';
      const pideOk=c.estado==='esperando_ok';
      $('#mc_tomar').classList.toggle('hidden',humano||pideOk||!MC_VIVOS.includes(c.estado)||!['admin','superadmin'].includes(ME.role)); // operador: solo cuando ARCA pide una persona
      $('#mc_si').classList.toggle('hidden',!pideOk);$('#mc_no').classList.toggle('hidden',!pideOk);
      $('#mc_devolver').classList.toggle('hidden',!humano);
      const av=$('#mc_vivo_avance'),ta=mcAvance(c);av.textContent=ta;av.classList.toggle('hidden',!ta);av.title=c.progreso&&c.progreso.error?`Error del paso: ${c.progreso.error}`:'';
      $('#mc_vivo_motivo').textContent=pideOk?`Fisherboy frenó antes de tocar «${(c.progreso&&c.progreso.ok&&c.progreso.ok.texto)||'un botón'}» porque podría no deshacerse${c.progreso&&c.progreso.ok&&c.progreso.ok.motivo?` (${c.progreso.ok.motivo})`:''}. Mirá la pantalla y decidí: «Sí, dale» lo toca, «No» lo cancela.`:c.estado==='esperando_humano'?'ARCA pide a una persona (captcha o segundo factor). Resolvelo en la pantalla y después tocá "Devolver a la receta".':c.estado==='error'?(c.error||''):c.estado==='terminado'?`Listo: ${c.cantidad} comprobantes.`:'';
      if(!MC_VIVOS.includes(c.estado)){mcPararTimers();mcCorridas(false);mcAplicar();mcMonotributo();mcRango();if(c.estado==='terminado'&&!FUNC.analisis)refrescarFunciones();}
    }catch{}
  };
  const foto=async()=>{
    if(!$('#mc_img'))return;
    try{const r=await fetch(`/api/mis-comprobantes/corridas/${id}/frame?desde=${MC.seq}`,{credentials:'include'});
      if(r.status===200){const b=await r.blob();MC.seq=+(r.headers.get('x-agent-seq')||MC.seq);if(MC.url)URL.revokeObjectURL(MC.url);MC.url=URL.createObjectURL(b);$('#mc_img').src=MC.url;}
    }catch{}
  };
  paso();foto();MC.timer=setInterval(paso,2000);MC.frameTimer=setInterval(foto,500);
  const pan=$('#mc_pantalla');
  pan.onclick=e=>{const r=$('#mc_img').getBoundingClientRect();mcEvento({tipo:'click',x:Math.round((e.clientX-r.left)*1280/r.width),y:Math.round((e.clientY-r.top)*800/r.height)});pan.focus();};
  pan.onwheel=e=>{e.preventDefault();mcEvento({tipo:'scroll',dy:Math.round(e.deltaY)});};
  pan.onkeydown=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;e.preventDefault();
    if(e.key.length===1)mcEvento({tipo:'texto',texto:e.key});else if(['Enter','Tab','Backspace','Delete','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(e.key))mcEvento({tipo:'tecla',tecla:e.key});};
}
async function mcEvento(cmd){

/* ----- Análisis: un solo juego de filtros para el análisis, el listado y el CSV. Cada barra,
   fila o indicador filtra con un clic y queda como chip para sacarlo. ----- */
const MCA={f:{tipo:'',clase:'',cbte:'',cbteNombre:'',contraparte:'',contraparteNombre:'',contraparteLado:'',q:''},per:'12m',desde:'',hasta:'',mesPrevio:null,abiertos:null};
const MESES_CORTO=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_LARGO=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mcaMesCorto=m=>`${MESES_CORTO[+m.slice(5,7)-1]} ${m.slice(2,4)}`;
const mcaMesLargo=m=>`${MESES_LARGO[+m.slice(5,7)-1]} ${m.slice(0,4)}`;
function mcaPlata(n,corto){const v=Number(n||0),a=Math.abs(v),s=v<0?'−':'';
  if(!corto)return `${s}$ ${a.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  if(a>=1e6)return `${s}$ ${(a/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})} M`;
  if(a>=1e4)return `${s}$ ${Math.round(a/1e3).toLocaleString('es-AR')} mil`;
  return `${s}$ ${Math.round(a).toLocaleString('es-AR')}`;}
const I_CHEV_R='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',I_CHEV_D='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
function mcaContraparteEl(el){mcaContraparte(el.dataset.doc,el.dataset.nombre,el.dataset.lado);}
const mcaPct=x=>`${(x*100).toLocaleString('es-AR',{maximumFractionDigits:1})}%`;
function mcaPeriodo(per,silencioso){
  const hoy=new Date(),y=hoy.getFullYear(),m=hoy.getMonth(),f=d=>isoHoy(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())));
  let d=MCA.desde,h=MCA.hasta;
  if(per==='12m'){d=f(new Date(y,m-11,1));h=f(hoy);}else if(per==='mes'){d=f(new Date(y,m,1));h=f(hoy);}
  else if(per==='anio'){d=`${y}-01-01`;h=f(hoy);}else if(per==='anioant'){d=`${y-1}-01-01`;h=`${y-1}-12-31`;}
  MCA.per=per;MCA.mesPrevio=null;$('#mca_per').value=per;$('#mc_fdesde').value=d||'';$('#mc_fhasta').value=h||'';
  if(!silencioso)mcAplicar();
}
/* En Mis Comprobantes el listado usa sus propios filtros; en Análisis, los del análisis. */
function mcFiltros(){const q=new URLSearchParams();const d=$('#mc_fdesde').value,h=$('#mc_fhasta').value;
  if(!$('#mca_seg')){const t=$('#mc_ftipo')&&$('#mc_ftipo').value;if(t)q.set('tipo',t);if(d)q.set('desde',d);if(h)q.set('hasta',h);return q.toString();}
  const f=MCA.f;if(f.tipo)q.set('tipo',f.tipo);if(d)q.set('desde',d);if(h)q.set('hasta',h);
  for(const k of ['clase','cbte','contraparte','q'])if(f[k])q.set(k,f[k]);
  return q.toString();}
function mcaChips(){
  const f=MCA.f,ch=[];

  if(f.contraparte)ch.push(['contraparte',`${f.contraparteLado==='recibido'?'Proveedor':f.contraparteLado==='emitido'?'Cliente':'Contraparte'}: ${f.contraparteNombre||f.contraparte}`]);
  if(f.cbte)ch.push(['cbte',`Tipo: ${f.cbteNombre||f.cbte}`]);
  if(f.clase)ch.push(['clase',{facturas:'Solo facturas',nc:'Solo notas de crédito',nd:'Solo notas de débito'}[f.clase]]);

  $('#mca_chips').innerHTML=ch.map(([k,t])=>`<span class="mca-chip">${escA(t)}<button type="button" aria-label="Quitar filtro ${escA(t)}" onclick="mcaQuitar('${k}')">&times;</button></span>`).join('')
    +(ch.length>1?'<button type="button" class="ghost" style="padding:3px 8px;font-size:12px" onclick="mcaLimpiar()">Limpiar filtros</button>':'');

function mcaQuitar(k){const f=MCA.f;

function mcaLimpiar(){MCA.f={tipo:MCA.f.tipo,clase:'',cbte:'',cbteNombre:'',contraparte:'',contraparteNombre:'',contraparteLado:'',q:''};$('#mca_clase').value='';$('#mca_q').value='';mcaPeriodo('12m');}
function mcaMes(mes){
  if(!MCA.mesPrevio)MCA.mesPrevio={per:MCA.per,desde:$('#mc_fdesde').value,hasta:$('#mc_fhasta').value};
  const [y,m]=mes.split('-').map(Number),fin=new Date(Date.UTC(y,m,0)).getUTCDate();

function mcaContraparte(doc,nombre,lado){Object.assign(MCA.f,{contraparte:doc,contraparteNombre:nombre,contraparteLado:lado});mcAplicar();}
function mcaTipo(lado,cbte){Object.assign(MCA.f,{tipo:lado,cbte:String(cbte),cbteNombre:NOMBRE_TIPO[cbte]||String(cbte)});mcAplicar();}
function mcaKpi(tipo,clase){MCA.f.tipo=tipo;MCA.f.clase=clase||'';$('#mca_clase').value=MCA.f.clase;mcAplicar();}
function mcaFechaManual(){MCA.mesPrevio=null;MCA.per='custom';$('#mca_per').value='custom';mcAplicar();}
function mcAplicar(){

async function mcAnalisis(){
  const box=$('#mca_cuerpo');if(!box)return;
  try{const {analisis:a}=await api(`/api/mis-comprobantes/${MC.cuit}/analisis?${mcFiltros()}`);
    const filtrado=MCA.f.contraparte||MCA.f.cbte||MCA.f.clase||MCA.f.q||MCA.f.tipo||MCA.mesPrevio;
    if(!a.total.cantidad){box.innerHTML=`<p class="hint" style="margin-top:12px">${filtrado?'No hay comprobantes con estos filtros.':'Todavía no hay comprobantes bajados en este período. Cuando sincronices Mis Comprobantes, acá vas a ver totales, gráficos y subtotales.'}</p>`;return;}
    box.innerHTML=mcaKpis(a)+mcaMeses(a)+`<div class="mca-2">${mcaTop('Principales clientes',a.clientes,'emitido')}${mcaTop('Principales proveedores',a.proveedores,'recibido')}</div>`
      +`<div class="mca-2">${mcaTipos(a)}<div class="card"><h3 style="text-transform:none;margin-top:0">Totales del período</h3>${mcaTotales(a)}</div></div>`+mcaSubtotales(a);

function mcaKpis(a){const k=a.kpis,var_=k.variacion;
  const comp=var_==null?'sin datos del período anterior':`${var_>=0?'+':'−'}${mcaPct(Math.abs(var_))} vs período anterior`;
  const kpi=(label,val,sub,onclick,titulo)=>`<button type="button" class="mca-kpi" onclick="${onclick}" title="${escA(titulo)}"><div class="label">${label}</div><div class="val">${val}</div><div class="sub">${sub}</div></button>`;
  return `<div class="mca-kpis">
    ${kpi('Facturado',mcaPlata(k.facturado,true),`<span style="color:${var_==null?'var(--muted)':var_>=0?'var(--ok)':'var(--bad)'}">${comp}</span>`,"mcaKpi('emitido')",`${mcaPlata(k.facturado)} en ${k.cantEmitidos} comprobantes, notas de crédito restadas. Clic: ver solo emitidos.`)}
    ${kpi('Notas de crédito',mcaPlata(k.notasCredito,true),k.facturado>0?`${mcaPct(k.notasCredito/(k.facturado+k.notasCredito))} de lo facturado`:'emitidas',"mcaKpi('emitido','nc')",`${mcaPlata(k.notasCredito)}. Clic: ver solo las notas de crédito emitidas.`)}
    ${kpi('Comprado',mcaPlata(k.comprado,true),`${k.cantRecibidos} ${k.cantRecibidos===1?'comprobante':'comprobantes'} recibidos`,"mcaKpi('recibido')",`${mcaPlata(k.comprado)}. Clic: ver solo recibidos.`)}
    ${kpi('IVA crédito fiscal',mcaPlata(k.ivaCredito,true),`débito ${mcaPlata(k.ivaDebito,true)}`,"mcaKpi('recibido')",`Crédito ${mcaPlata(k.ivaCredito)} (recibidos) · Débito ${mcaPlata(k.ivaDebito)} (emitidos).`)}
    ${kpi('Resultado bruto',mcaPlata(k.resultado,true),'facturado menos comprado',"mcaKpi('')",`${mcaPlata(k.resultado)}. No incluye sueldos, impuestos ni gastos sin comprobante. Clic: ver emitidos y recibidos.`)}
  </div>`;}
function mcaMeses(a){const max=Math.max(1,...a.porMes.map(m=>Math.max(m.emitido,m.recibido)));
  const alto=v=>v>0?Math.max(2,Math.round(v/max*100)):0;

  const cols=a.porMes.map(m=>`<button type="button" class="mca-mes" onclick="mcaMes('${m.mes}')" title="${escA(`${mcaMesLargo(m.mes)} · Facturado ${mcaPlata(m.emitido)} (${m.cantEmitidos}) · Comprado ${mcaPlata(m.recibido)} (${m.cantRecibidos}). Clic: ver este mes.`)}" aria-label="${escA(`Ver ${mcaMesLargo(m.mes)}`)}">
      ${ver('emitido')?`<i class="mca-e" style="height:${alto(m.emitido)}%"></i>`:''}${ver('recibido')?`<i class="mca-r" style="height:${alto(m.recibido)}%"></i>`:''}</button>`).join('');
  return `<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3 style="text-transform:none;margin:0">Por mes</h3>
    <div class="mca-ley">${ver('emitido')?'<span><i class="mca-e"></i>Facturado</span>':''}${ver('recibido')?'<span><i class="mca-r"></i>Comprado</span>':''}<span>Máximo: ${mcaPlata(max,true)}</span></div></div>
    <div class="mca-meses">${cols}</div><div class="mca-ejes">${a.porMes.map(m=>`<span>${mcaMesCorto(m.mes)}</span>`).join('')}</div>
    <p class="hint" style="margin:8px 0 0">Tocá un mes para ver solo ese mes.</p></div>`;}
function mcaTop(titulo,r,lado){
  if(!r.items.length)return `<div class="card"><h3 style="text-transform:none;margin-top:0">${titulo}</h3><p class="hint">Sin ${lado==='emitido'?'emitidos':'recibidos'} con estos filtros.</p></div>`;
  const max=Math.max(1,...r.items.map(x=>x.total),r.otros.total),cls=lado==='emitido'?'mca-e':'mca-r';

      <span class="n">${esc(x.nombre||x.docNro)}</span><span class="m">${mcaPlata(x.total,true)}</span><span class="b"><i class="${cls}" style="width:${Math.max(1,Math.round(Math.max(0,x.total)/max*100))}%"></i></span></button>`;

function mcaTipos(a){
  return `<div class="card" style="overflow-x:auto"><h3 style="text-transform:none;margin-top:0">Por tipo de comprobante</h3><table><tr><th>Lado</th><th>Tipo</th><th>Cant.</th><th style="text-align:right">Total</th></tr>
    ${a.porTipo.map(t=>`<tr class="mca-click" tabindex="0" onclick="mcaTipo(${jsA(t.tipo)},${Number(t.cbteTipo)})" onkeydown="if(event.key==='Enter')this.click()" title="Clic: filtrar por este tipo"><td>${t.tipo==='emitido'?'Emitido':'Recibido'}</td><td>${esc(NOMBRE_TIPO[t.cbteTipo]||t.cbteTipo)}</td><td class="mono">${t.cantidad}</td><td class="mono" style="text-align:right">${mcaPlata(t.total)}</td></tr>`).join('')}</table></div>`;}
function mcaTotales(a){const k=a.kpis,t=a.total;
  const fila=(l,v)=>`<tr><td>${l}</td><td class="mono" style="text-align:right">${v}</td></tr>`;
  return `<table>${fila('Comprobantes',t.cantidad)}${fila('Facturado',mcaPlata(k.facturado))}${fila('Notas de crédito emitidas',mcaPlata(-k.notasCredito))}${fila('Comprado',mcaPlata(k.comprado))}${fila('IVA débito',mcaPlata(k.ivaDebito))}${fila('IVA crédito',mcaPlata(k.ivaCredito))}${fila('Saldo de IVA (débito − crédito)',mcaPlata(k.ivaDebito-k.ivaCredito))}${fila('Resultado bruto',mcaPlata(k.resultado))}</table>
    <p class="hint" style="margin:8px 0 0">Período ${esc(a.periodo.desde.split('-').reverse().join('/'))} a ${esc(a.periodo.hasta.split('-').reverse().join('/'))}. Importes en pesos; la moneda extranjera, al tipo de cambio del comprobante.</p>`;}
function mcaSubtotales(a){
  if(!MCA.abiertos)MCA.abiertos=new Set(a.subtotales.slice(0,2).map(g=>g.mes+'|'+g.tipo));
  const filas=a.subtotales.map((g,i)=>{const k=g.mes+'|'+g.tipo,ab=MCA.abiertos.has(k),lado=g.tipo==='emitido'?'Emitidos':'Recibidos';
    const cab=`<tr class="mca-grupo"><td><button type="button" class="mca-tog" aria-expanded="${ab}" aria-label="${ab?'Cerrar':'Abrir'} ${escA(mcaMesLargo(g.mes))}" onclick="mcaToggle('${k}')">${ab?I_CHEV_D:I_CHEV_R}</button><button type="button" class="mca-link" onclick="mcaMes('${g.mes}')" title="Clic: ver solo este mes">${esc(mcaMesLargo(g.mes))}</button> <span class="hint">· ${lado}</span></td><td class="mono">${g.cantidad}</td><td class="mono" style="text-align:right">${mcaPlata(g.neto)}</td><td class="mono" style="text-align:right">${mcaPlata(g.iva)}</td><td class="mono" style="text-align:right">${mcaPlata(g.total)}</td></tr>`;
    const hijos=ab?g.contrapartes.map(x=>`<tr class="mca-click" tabindex="0" data-doc="${escA(x.docNro)}" data-nombre="${escA(x.nombre)}" data-lado="${esc(g.tipo)}" onclick="mcaContraparteEl(this)" onkeydown="if(event.key==='Enter')this.click()" title="Clic: filtrar por esta contraparte"><td style="padding-left:34px">${esc(x.nombre||'')} <span class="hint mono">${esc(x.docNro||'')}</span></td><td class="mono">${x.cantidad}</td><td class="mono" style="text-align:right">${mcaPlata(x.neto)}</td><td class="mono" style="text-align:right">${mcaPlata(x.iva)}</td><td class="mono" style="text-align:right">${mcaPlata(x.total)}</td></tr>`).join(''):'';

    <table style="margin-top:8px"><tr><th>Mes / contraparte</th><th>Cant.</th><th style="text-align:right">Neto</th><th style="text-align:right">IVA</th><th style="text-align:right">Total</th></tr>${filas}
    <tr class="mca-grupo"><td>Total del período</td><td class="mono">${a.total.cantidad}</td><td class="mono" style="text-align:right">${mcaPlata(a.total.neto)}</td><td class="mono" style="text-align:right">${mcaPlata(a.total.iva)}</td><td class="mono" style="text-align:right">${mcaPlata(a.total.total)}</td></tr></table>
    ${MCA.f.tipo?'':'<p class="hint" style="margin:8px 0 0">El total suma emitidos y recibidos; elegí Emitidos o Recibidos arriba para ver cada lado por separado.</p>'}</div>`;}
/* Bloques plegables del Analisis: toda tarjeta con un titulo h3 (directo o dentro de su primera
   fila) se pliega tocando el titulo; queda solo la cabecera. Cuales estan plegadas se guarda por
   titulo en este navegador, asi se mantienen al cambiar filtros o al volver. */
function mcaPlegadas(){try{return new Set(JSON.parse(localStorage.getItem('arcanum.mcaPlegadas')||'[]'));}catch{return new Set();}}
function mcaGuardarPlegadas(set){try{localStorage.setItem('arcanum.mcaPlegadas',JSON.stringify([...set]));}catch{}}
function mcaPintarPleg(card){const pl=card.classList.contains('plegada'),b=card.querySelector('.mca-pleg-btn')||card._plegBtn;
  if(b){b.innerHTML=pl?I_CHEV_R:I_CHEV_D;b.setAttribute('aria-expanded',String(!pl));b.setAttribute('aria-label',`${pl?'Desplegar':'Plegar'} ${card.dataset.pleg}`);}}
function mcaPlegables(root){
  if(!root)return;const cerr=mcaPlegadas();
  root.querySelectorAll('.card').forEach(card=>{
    if(card.dataset.pleg)return;
    const h=[...card.children].find(e=>e.tagName==='H3')||[...card.children].map(e=>e.classList.contains('row')?[...e.children].find(x=>x.tagName==='H3'):null).find(Boolean);
    if(!h)return;
    const clave=h.textContent.trim();if(!clave)return;
    card.dataset.pleg=clave;
    (h.parentElement===card?h:h.parentElement).classList.add('mca-cab');
    h.classList.add('mca-pleg');h.title='Plegar o desplegar';
    const b=document.createElement('button');b.type='button';b.className='mca-tog mca-pleg-btn';
    h.prepend(b);
    h.onclick=()=>mcaPlegar(card);
    h.tabIndex=-1;
    if(cerr.has(clave))card.classList.add('plegada');
    mcaPintarPleg(card);
  });
  // Titulos de seccion (h2) con la tarjeta justo abajo (Sincronizaciones, Comprobantes): el
  // titulo queda a la vista y pliega la tarjeta entera.
  root.querySelectorAll('h2').forEach(h=>{
    const cab=h.parentElement&&h.parentElement.classList.contains('row')?h.parentElement:h;
    const card=cab.nextElementSibling;
    if(!card||!card.classList.contains('card')||card.dataset.pleg)return;
    const clave=h.textContent.trim();if(!clave)return;
    card.dataset.pleg=clave;card.dataset.plegExt='1';
    h.classList.add('mca-pleg');h.title='Plegar o desplegar';
    const b=document.createElement('button');b.type='button';b.className='mca-tog mca-pleg-btn';
    h.prepend(b);card._plegBtn=b;
    h.onclick=()=>mcaPlegar(card);
    h.tabIndex=-1;
    if(cerr.has(clave))card.classList.add('plegada');
    mcaPintarPleg(card);
  });
}
function mcaPlegar(card,plegar){
  const pl=plegar==null?!card.classList.contains('plegada'):plegar;
  card.classList.toggle('plegada',pl);mcaPintarPleg(card);
  const set=mcaPlegadas();pl?set.add(card.dataset.pleg):set.delete(card.dataset.pleg);mcaGuardarPlegadas(set);
}
function mcaPlegarTodo(plegar){document.querySelectorAll('#view .card[data-pleg]').forEach(c=>mcaPlegar(c,plegar));}
function mcaToggle(k){MCA.abiertos.has(k)?MCA.abiertos.delete(k):MCA.abiertos.add(k);mcAnalisis();}
function mcaToggleTodos(abrir){if(!abrir){MCA.abiertos=new Set();mcAnalisis();return;}
  api(`/api/mis-comprobantes/${MC.cuit}/analisis?${mcFiltros()}`).then(({analisis:a})=>{MCA.abiertos=new Set(a.subtotales.map(g=>g.mes+'|'+g.tipo));mcAnalisis();}).catch(()=>{});}
/* Las categorías del catálogo se guardan como clave; esto es lo que se muestra. */
const CATEGORIAS={facturacion:'Facturación',consultas:'Consultas',agro:'Agro y remitos',aduana:'Aduana',otros:'Otros'};
const catNombre=c=>CATEGORIAS[c]||String(c||'Otros').replace(/^./,x=>x.toUpperCase());
const NOMBRE_TIPO={1:'Factura A',2:'ND A',3:'NC A',6:'Factura B',7:'ND B',8:'NC B',11:'Factura C',12:'ND C',13:'NC C',51:'Factura M',201:'FCE A',206:'FCE B',211:'FCE C'};
async function mcCargarTabla(){
  try{const {comprobantes:l}=await api(`/api/mis-comprobantes/${MC.cuit}?${mcFiltros()}`);
    MC.filas=l;
    const r=$('#mc_tabla_resumen');if(r)r.textContent=l.length?`${l.length} ${l.length===1?'comprobante':'comprobantes'} con los filtros del análisis${l.length>=500?' (se muestran los primeros 500; el CSV trae hasta 5000)':''}.`:'Con los filtros del análisis.';
    mcPintarTabla();
